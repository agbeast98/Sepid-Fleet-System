/* ============================================================
   سامانه ناوگان — طراحی
   ============================================================ */
:root {
  color-scheme: light;
  --bg: #f2f1ec;
  --bg-2: #eae8e1;
  --surface: #fcfcfb;
  --surface-2: #f6f5f1;
  --surface-3: #efede7;
  --ink: #14171c;
  --ink-2: #494c54;
  --muted: #85847f;
  --line: rgba(20, 22, 28, .085);
  --line-2: rgba(20, 22, 28, .15);
  --grid: #e4e2da;
  --axis: #c3c2b7;

  --brand: #0e4d5b;
  --brand-2: #13697b;
  --brand-ink: #ffffff;
  --brand-soft: #e2eef0;
  --brand-softer: #eef5f6;
  --accent: #b9832c;
  --accent-soft: #f6ecda;

  --good: #0b8a0b;
  --good-bg: #e6f4e6;
  --warn: #e29b00;
  --warn-ink: #7a4f00;
  --warn-bg: #fdf1d6;
  --serious: #e0703f;
  --serious-ink: #8f3a12;
  --serious-bg: #fbe8de;
  --crit: #d03b3b;
  --crit-ink: #a52424;
  --crit-bg: #fae3e3;

  --c-none: #1baf7a;
  --c-pm: #2a78d6;
  --c-driver: #eb6834;
  --c-both: #4a3aa7;

  --side-bg: #0f1b20;
  --side-bg-2: #0b1519;
  --side-ink: #c9d3d6;
  --side-muted: #6f8288;
  --side-line: rgba(255, 255, 255, .07);

  --r-sm: 8px;
  --r: 12px;
  --r-lg: 16px;
  --r-xl: 20px;
  --shadow-1: 0 1px 0 rgba(20, 22, 28, .04), 0 1px 3px rgba(20, 22, 28, .05);
  --shadow-2: 0 1px 0 rgba(20, 22, 28, .04), 0 8px 24px -8px rgba(20, 22, 28, .12);
  --shadow-3: 0 24px 64px -16px rgba(10, 14, 20, .35);
  --ring: 0 0 0 3px rgba(19, 105, 123, .22);
  --side-w: 268px;
  --font: 'Vazirmatn', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c0f11; --bg-2: #111518; --surface: #161a1d; --surface-2: #1b2024; --surface-3: #222830;
    --ink: #eef1f2; --ink-2: #b4bcc0; --muted: #7c868b; --line: rgba(255, 255, 255, .075); --line-2: rgba(255, 255, 255, .14);
    --grid: #2a3035; --axis: #3d4449;
    --brand: #5cb6c6; --brand-2: #7cc8d5; --brand-ink: #062026; --brand-soft: rgba(92, 182, 198, .14); --brand-softer: rgba(92, 182, 198, .08);
    --accent: #d9a54f; --accent-soft: rgba(217, 165, 79, .14);
    --good: #3fc23f; --good-bg: rgba(12, 163, 12, .15); --warn: #fab219; --warn-ink: #fbc54d; --warn-bg: rgba(250, 178, 25, .14);
    --serious: #ec835a; --serious-ink: #f3a07e; --serious-bg: rgba(236, 131, 90, .15); --crit: #e25555; --crit-ink: #f08080; --crit-bg: rgba(208, 59, 59, .17);
    --c-none: #199e70; --c-pm: #3987e5; --c-driver: #d95926; --c-both: #9085e9;
    --side-bg: #0a1215; --side-bg-2: #070d10;
    --shadow-1: 0 1px 0 rgba(0, 0, 0, .3); --shadow-2: 0 10px 30px -10px rgba(0, 0, 0, .6);
    --ring: 0 0 0 3px rgba(92, 182, 198, .3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0f11; --bg-2: #111518; --surface: #161a1d; --surface-2: #1b2024; --surface-3: #222830;
  --ink: #eef1f2; --ink-2: #b4bcc0; --muted: #7c868b; --line: rgba(255, 255, 255, .075); --line-2: rgba(255, 255, 255, .14);
  --grid: #2a3035; --axis: #3d4449;
  --brand: #5cb6c6; --brand-2: #7cc8d5; --brand-ink: #062026; --brand-soft: rgba(92, 182, 198, .14); --brand-softer: rgba(92, 182, 198, .08);
  --accent: #d9a54f; --accent-soft: rgba(217, 165, 79, .14);
  --good: #3fc23f; --good-bg: rgba(12, 163, 12, .15); --warn: #fab219; --warn-ink: #fbc54d; --warn-bg: rgba(250, 178, 25, .14);
  --serious: #ec835a; --serious-ink: #f3a07e; --serious-bg: rgba(236, 131, 90, .15); --crit: #e25555; --crit-ink: #f08080; --crit-bg: rgba(208, 59, 59, .17);
  --c-none: #199e70; --c-pm: #3987e5; --c-driver: #d95926; --c-both: #9085e9;
  --side-bg: #0a1215; --side-bg-2: #070d10;
  --shadow-1: 0 1px 0 rgba(0, 0, 0, .3); --shadow-2: 0 10px 30px -10px rgba(0, 0, 0, .6);
  --ring: 0 0 0 3px rgba(92, 182, 198, .3);
}

/* ---------- پایه ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; font-family: var(--font); font-size: 14px; line-height: 1.7; color: var(--ink);
  background: var(--bg); direction: rtl; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  font-feature-settings: "ss01";
}
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.4; }
p { margin: 0 0 .6em; }
::selection { background: var(--brand-soft); }
.ic { width: 18px; height: 18px; flex: none; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.nowrap { white-space: nowrap; }
.grow { flex: 1 1 auto; }
.only-print { display: none; }
[hidden] { display: none !important; }
kbd { font-family: var(--font); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; background: var(--surface); color: var(--ink-2); }
:focus-visible { outline: none; box-shadow: var(--ring); border-radius: 8px; }

/* ---------- چیدمان ---------- */
#app { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 100vh; position: relative; }
#app::before { content: ''; position: fixed; inset-block: 0; inset-inline-start: 0; width: var(--side-w); background: var(--side-bg-2); z-index: 0; }
.sidebar {
  position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
  background:
    radial-gradient(120% 60% at 100% 0%, rgba(92, 182, 198, .10), transparent 60%),
    linear-gradient(180deg, var(--side-bg), var(--side-bg-2));
  color: var(--side-ink); border-inline-start: 1px solid var(--side-line); z-index: 30;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 22px 20px 18px; }
.brand-mark {
  width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #1b7c8f, #0e4d5b); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25), 0 6px 16px -6px rgba(27, 124, 143, .8);
}
.brand-mark .ic { width: 22px; height: 22px; }
.brand-text { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.brand-text b { font-size: 16px; font-weight: 800; color: #fff; letter-spacing: -.2px; }
.brand-text span { font-size: 12px; color: var(--side-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { flex: 1; overflow-y: auto; padding: 4px 12px 12px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .1) transparent; }
.nav-group { margin-top: 14px; }
.nav-title { font-size: 11px; font-weight: 600; color: var(--side-muted); padding: 0 12px 6px; letter-spacing: .2px; }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 9px 12px; margin: 2px 0; border-radius: 10px;
  color: var(--side-ink); font-weight: 500; transition: background .15s, color .15s; position: relative;
}
.nav-item .ic { opacity: .75; }
.nav-item:hover { background: rgba(255, 255, 255, .05); color: #fff; }
.nav-item.active { background: rgba(92, 182, 198, .14); color: #fff; }
.nav-item.active::before { content: ''; position: absolute; inset-inline-start: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: #6fcad9; }
.nav-item.active .ic { opacity: 1; color: #7fd3e1; }
.nav-item.accent { color: #f3d9a8; }
.nav-item.accent .ic { color: #e2b765; opacity: 1; }
.nav-badge { margin-inline-start: auto; min-width: 22px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; }
.nav-badge.crit { background: #d03b3b; color: #fff; }
.nav-dot { margin-inline-start: auto; width: 8px; height: 8px; border-radius: 50%; }
.nav-dot.warn { background: #fab219; box-shadow: 0 0 0 4px rgba(250, 178, 25, .18); }
.side-foot { padding: 12px; border-top: 1px solid var(--side-line); }
.backup-card { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(255, 255, 255, .04); border: 1px solid var(--side-line); transition: background .15s; }
.backup-card:hover { background: rgba(255, 255, 255, .07); }
.bc-ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; }
.backup-card.tone-good .bc-ic { background: rgba(12, 163, 12, .16); color: #5fd35f; }
.backup-card.tone-warn .bc-ic { background: rgba(250, 178, 25, .16); color: #fbc54d; }
.bc-text { display: flex; flex-direction: column; line-height: 1.4; min-width: 0; }
.bc-text b { font-size: 12.5px; color: #fff; font-weight: 600; }
.bc-text small { font-size: 11px; color: var(--side-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; padding: 12px 32px;
  background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}
.search { position: relative; flex: 1 1 auto; min-width: 0; max-width: 560px; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: border-color .15s, box-shadow .15s; }
.search:focus-within { border-color: var(--brand-2); box-shadow: var(--ring); }
.search > .ic { color: var(--muted); }
.search input { flex: 1; width: 100%; border: 0; background: none; outline: none; min-width: 0; height: 100%; }
.search input::placeholder { color: var(--muted); }
.search-pop { position: absolute; top: calc(100% + 8px); inset-inline: 0; max-height: 440px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-3); padding: 6px; display: none; }
.search-pop.open { display: block; animation: pop .14s ease-out; }
.sp-group { font-size: 11px; font-weight: 700; color: var(--muted); padding: 8px 10px 4px; }
.sp-item { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 9px; }
.sp-item .ic { color: var(--muted); }
.sp-item span { display: flex; flex-direction: column; line-height: 1.45; min-width: 0; }
.sp-item small { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sp-item.on, .sp-item:hover { background: var(--brand-softer); }
.sp-item.on .ic { color: var(--brand); }
.sp-empty { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 22px; color: var(--muted); }
.top-actions { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }
.only-mobile { display: none; }
.scrim { display: none; }

.view { padding: 26px 32px 60px; }
.page { max-width: 1480px; margin: 0 auto; animation: fadeUp .28s ease-out; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.ph-text h1 { font-size: 25px; font-weight: 800; letter-spacing: -.4px; }
.ph-text p { color: var(--muted); margin: 2px 0 0; font-size: 13.5px; }
.ph-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs { display: flex; align-items: center; gap: 4px; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.crumbs a:hover { color: var(--brand); }
.crumbs .ic { width: 14px; height: 14px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.99); } to { opacity: 1; transform: none; } }

/* ---------- کارت و شبکه ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: 20px; min-width: 0; }
.card.flush { padding: 0; overflow: hidden; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.card-head.pad { padding: 18px 20px 0; }
.card-head h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card-head h3 .ic { color: var(--brand); }
.link { display: inline-flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 600; color: var(--brand); }
.link .ic { width: 15px; height: 15px; }
.link:hover { text-decoration: underline; text-underline-offset: 4px; }
.stack { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-bottom: 18px; }
.grid-main { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(300px, 1fr); gap: 18px; margin-bottom: 18px; align-items: start; }
.section { margin-bottom: 26px; }
.section-title { font-size: 15px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-title span { font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-3); padding: 0 8px; border-radius: 20px; }
.sub-title { font-size: 13.5px; font-weight: 700; margin: 18px 0 10px; }

/* ---------- دکمه‌ها ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 15px;
  border-radius: 10px; border: 1px solid transparent; font-weight: 600; font-size: 13.5px; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s, box-shadow .15s, transform .08s; user-select: none;
}
.btn:active { transform: translateY(1px); }
.btn .ic { width: 17px; height: 17px; }
.btn-primary { background: var(--brand); color: var(--brand-ink); box-shadow: 0 1px 0 rgba(255, 255, 255, .15) inset, 0 4px 12px -4px color-mix(in srgb, var(--brand) 60%, transparent); }
.btn-primary:hover { background: var(--brand-2); }
.btn-ghost { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-2); border-color: var(--line-2); }
.btn-soft { background: var(--brand-soft); color: var(--brand); }
.btn-soft:hover { background: color-mix(in srgb, var(--brand-soft) 70%, var(--brand) 12%); }
.btn-danger { background: var(--crit); color: #fff; }
.btn-danger:hover { filter: brightness(1.06); }
.danger-text { color: var(--crit-ink) !important; }
.btn-sm { height: 32px; padding: 0 11px; font-size: 12.5px; border-radius: 9px; }
.btn-sm .ic { width: 15px; height: 15px; }
.btn-lg { height: 46px; padding: 0 22px; font-size: 14.5px; border-radius: 12px; }
.btn.full { width: 100%; margin-top: 10px; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.btn-row.end { justify-content: flex-end; }
.btn-col { display: flex; flex-direction: column; gap: 8px; }
.btn-col .btn { justify-content: flex-start; }
.icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--ink-2); transition: background .15s, color .15s; flex: none; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn.sm { width: 30px; height: 30px; border-radius: 8px; }
.icon-btn.sm .ic { width: 16px; height: 16px; }
.icon-btn.danger:hover { background: var(--crit-bg); color: var(--crit-ink); }
.icon-btn:disabled { opacity: .35; pointer-events: none; }
.topbar .icon-btn { border-color: var(--line); background: var(--surface); }

/* ---------- فرم ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.field-label .req { color: var(--crit); font-style: normal; margin-inline-start: 3px; }
.field-hint { font-size: 11.5px; color: var(--muted); }
.input {
  width: 100%; height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface);
  outline: none; transition: border-color .15s, box-shadow .15s;
}
textarea.input { height: auto; padding: 10px 12px; resize: vertical; line-height: 1.8; min-height: 44px; }
.input:hover { border-color: color-mix(in srgb, var(--line-2) 50%, var(--brand) 25%); }
.input:focus { border-color: var(--brand-2); box-shadow: var(--ring); }
.input::placeholder { color: var(--muted); opacity: .8; }
.input.num { direction: ltr; text-align: right; font-variant-numeric: tabular-nums; }
.select { position: relative; min-width: 0; }
.select select { appearance: none; -webkit-appearance: none; padding-inline-end: 34px; cursor: pointer; }
.select .ic { position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--muted); pointer-events: none; }
.input-date, .input-ic { position: relative; }
.input-date .ic, .input-ic .ic { position: absolute; inset-inline-start: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 17px; height: 17px; pointer-events: none; }
.input-date .input, .input-ic .input { padding-inline-start: 36px; }
.input-date .input { cursor: pointer; font-variant-numeric: tabular-nums; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.form-grid.cols-1 { grid-template-columns: 1fr; }
.form-grid .span2, .span2 { grid-column: 1 / -1; }
.check { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.check input { width: 17px; height: 17px; accent-color: var(--brand); margin: 0; }
.switch { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 500; }
.switch input { display: none; }
.switch .sw { width: 38px; height: 22px; border-radius: 20px; background: var(--surface-3); border: 1px solid var(--line-2); position: relative; transition: background .2s; }
.switch .sw::after { content: ''; position: absolute; top: 2px; inset-inline-start: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .25); transition: inset-inline-start .2s; }
.switch input:checked + .sw { background: var(--brand); border-color: var(--brand); }
.switch input:checked + .sw::after { inset-inline-start: 18px; }

.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface-3); border-radius: 11px; border: 1px solid var(--line); }
.seg button { border: 0; background: transparent; height: 32px; padding: 0 12px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1), 0 0 0 1px var(--line); }
.seg button i { font-style: normal; font-size: 11px; color: var(--muted); background: var(--surface-2); padding: 0 6px; border-radius: 10px; }
.seg-wrap { flex-wrap: wrap; }
.seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.filters .field:has(.seg) { max-width: 100%; }

.filters { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; padding: 14px 18px; }
.filters .field { min-width: 160px; }
.filters .field.grow { flex: 1 1 240px; }
.filters-title { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; color: var(--ink-2); height: 40px; padding-inline-end: 6px; border-inline-end: 1px solid var(--line); margin-inline-end: 4px; }
.filters-title .ic { color: var(--brand); }
.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; margin-bottom: 16px; }
.toolbar .select { width: 200px; }

/* ---------- برچسب‌ها ---------- */
.pill, .st, .apill, .rpill { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 20px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill .ic, .st .ic, .apill .ic, .rpill .ic { width: 14px; height: 14px; }
.st-crit { background: var(--crit-bg); color: var(--crit-ink); }
.st-warn { background: var(--warn-bg); color: var(--warn-ink); }
.st-good { background: var(--good-bg); color: var(--good); }
.st-muted { background: var(--surface-3); color: var(--muted); }
.st-plain { background: transparent; color: var(--muted); padding: 0; }
.apill-warn { background: var(--warn-bg); color: var(--warn-ink); }
.apill-serious { background: var(--serious-bg); color: var(--serious-ink); }
.apill-crit { background: var(--crit-bg); color: var(--crit-ink); }
.rpill { background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); padding-inline-start: 8px; }
.rpill .ic { color: var(--rc); }
.rpill::before { content: none; }
.rpill-none { --rc: var(--c-none); }
.rpill-driver { --rc: var(--c-driver); }
.rpill-pm { --rc: var(--c-pm); }
.rpill-both { --rc: var(--c-both); }
.rpill-driver, .rpill-pm, .rpill-both { background: color-mix(in srgb, var(--rc) 10%, var(--surface)); border-color: color-mix(in srgb, var(--rc) 28%, transparent); }
.sev { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.sev i { width: 22px; height: 8px; border-radius: 4px; background: linear-gradient(to left, var(--sc) 0 var(--sw), var(--grid) var(--sw) 100%); }
.sev-low { --sc: #8fb3bc; --sw: 33%; }
.sev-mid { --sc: var(--serious); --sw: 66%; }
.sev-high { --sc: var(--crit); --sw: 100%; }
.act { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 6px; background: var(--surface-3); color: var(--ink-2); }
.act-r { background: var(--brand-soft); color: var(--brand); }
.act-s { background: var(--accent-soft); color: var(--accent); }
.act-c { background: var(--warn-bg, #fff4dc); color: var(--warn-ink, #8a5a00); }
.yn-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 10px; border-radius: 6px; background: var(--surface-3); }
.yn-tag.yes { background: var(--brand-soft); color: var(--brand); }
.yn-tag.bad { background: var(--crit-bg); color: var(--crit-ink); }

.avatar { --h: 180; width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; flex: none; font-size: 13px; font-weight: 700; background: hsl(var(--h) 45% 90%); color: hsl(var(--h) 45% 28%); letter-spacing: -.5px; }
:root[data-theme="dark"] .avatar { background: hsl(var(--h) 30% 22%); color: hsl(var(--h) 55% 78%); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .avatar { background: hsl(var(--h) 30% 22%); color: hsl(var(--h) 55% 78%); } }
.avatar.lg { width: 44px; height: 44px; font-size: 15px; }
.avatar.xl { width: 72px; height: 72px; font-size: 22px; }

.plate { display: inline-flex; align-items: stretch; height: 26px; border-radius: 6px; border: 1.5px solid var(--ink); overflow: hidden; background: #fff; color: #111; font-weight: 800; font-size: 13px; direction: ltr; box-shadow: var(--shadow-1); }
.plate-flag { width: 9px; background: linear-gradient(#239f40 0 33%, #fff 33% 66%, #da0000 66%); border-inline-end: 1.5px solid #111; }
.plate-main { display: flex; align-items: center; gap: 4px; padding: 0 8px; letter-spacing: .5px; }
.plate-main i { font-style: normal; font-weight: 700; }

/* ---------- جدول ---------- */
.table-wrap { overflow-x: auto; }
.table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.2px; }
.table th { text-align: start; font-weight: 600; font-size: 12px; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
.card:not(.flush) .table th { background: transparent; }
.table td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr:last-child td { border-bottom: 0; }
.table tr.row-link { cursor: pointer; transition: background .12s; }
.table tr.row-link:hover td { background: var(--brand-softer); }
.table tr.dim td { color: var(--muted); }
.table.compact td { padding: 8px 12px; }
.num-cell { font-variant-numeric: tabular-nums; }
.num-cell b { font-size: 15px; }
.cell-topic { min-width: 200px; }
.cell-topic b, .part-cell b { display: block; font-weight: 600; }
.cell-topic small, .part-cell small { display: block; color: var(--muted); font-size: 12px; line-height: 1.5; margin-top: 1px; }
.acts-cell div { display: flex; align-items: center; gap: 6px; margin: 2px 0; }
.acts-cell small { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.table-foot { padding: 10px 16px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--surface-2); }

/* ---------- داشبورد ---------- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px 18px; box-shadow: var(--shadow-1); position: relative; overflow: hidden; }
.kpi::after { content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 3px; background: var(--kc); opacity: .9; }
.kpi-total { --kc: var(--brand); }
.kpi-driver { --kc: var(--c-driver); }
.kpi-pm { --kc: var(--c-pm); }
.kpi-both { --kc: var(--c-both); }
.kpi-none { --kc: var(--c-none); }
.kpi-top { display: flex; align-items: center; gap: 8px; }
.kpi-ic { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--kc) 13%, transparent); color: var(--kc); }
.kpi-ic .ic { width: 16px; height: 16px; }
.kpi-label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.kpi-value { font-size: 32px; font-weight: 800; letter-spacing: -1px; line-height: 1.25; margin-top: 10px; }
.kpi-sub { font-size: 12px; color: var(--muted); }

.charts .card { display: flex; flex-direction: column; }
.chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart-svg .gridline { stroke: var(--grid); stroke-width: 1; }
.chart-svg .axis { stroke: var(--axis); stroke-width: 1; }
.chart-svg .tick { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart-svg .xlabel { fill: var(--ink-2); font-size: 11px; font-family: var(--font); font-weight: 600; }
.chart-svg .xlabel-2 { fill: var(--muted); font-weight: 500; }
.chart-host { width: 100%; min-height: 240px; }
.chart-svg .bar { transition: opacity .15s; }
.chart-svg .hit:hover ~ .bar { opacity: 1; }
.chart-svg .bar.is-hover { filter: brightness(1.08); }
.chart-svg .crosshair { stroke: var(--axis); stroke-dasharray: 3 3; opacity: 0; }
.chart-svg .crosshair.is-hover { opacity: 1; }
.chart-svg .dot { transition: r .12s; }
.chart-svg .dot.is-hover { r: 6; }
.legend { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend li { display: flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.legend-h { margin-bottom: 10px; }
.donut { display: flex; flex-direction: column; align-items: stretch; gap: 16px; flex: 1; justify-content: center; }
.donut-fig { position: relative; flex: none; align-self: center; }
.donut-fig svg { display: block; width: 180px; height: 180px; }
.donut-seg { transition: opacity .15s, transform .15s; transform-origin: center; }
.donut:has(.is-hover) .donut-seg:not(.is-hover) { opacity: .35; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.donut-center b { font-size: 30px; font-weight: 800; line-height: 1.1; }
.donut-center span { font-size: 11.5px; color: var(--muted); }
.legend-v { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; min-width: 0; }
.legend-v li { display: grid; grid-template-columns: 10px 1fr auto auto; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 8px; cursor: default; white-space: nowrap; }
.legend-v li span { overflow: hidden; text-overflow: ellipsis; }
.legend-v li.is-hover { background: var(--surface-2); }
.legend-v b { font-weight: 700; color: var(--ink); }
.legend-v em { font-style: normal; color: var(--muted); font-size: 11.5px; text-align: end; }
.chart-tip { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow-3); padding: 8px 11px; font-size: 12.5px; opacity: 0; transition: opacity .12s; min-width: 140px; }
.chart-tip.in { opacity: 1; }
.tip-title { font-weight: 700; margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 7px; }
.tip-row i { width: 9px; height: 9px; border-radius: 3px; }
.tip-row span { color: var(--ink-2); flex: 1; }
.tip-row b { font-variant-numeric: tabular-nums; }
.tip-row small { color: var(--muted); font-weight: 500; }

.fleet-body { display: flex; flex-direction: column; gap: 14px; }
.fleet-badge { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 12px; background: var(--fb); color: var(--fc); }
.fleet-badge .ic { width: 26px; height: 26px; }
.fleet-badge b { font-size: 22px; font-weight: 800; }
.fleet-good { --fb: var(--good-bg); --fc: var(--good); }
.fleet-warn { --fb: var(--warn-bg); --fc: var(--warn-ink); }
.fleet-crit { --fb: var(--crit-bg); --fc: var(--crit-ink); }
.fleet-plain { --fb: var(--surface-2); --fc: var(--muted); }
.fleet-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fleet-meta div { background: var(--surface-2); border-radius: 10px; padding: 8px 12px; display: flex; flex-direction: column; }
.fleet-meta span { font-size: 11.5px; color: var(--muted); }
.fleet-meta b { font-size: 18px; font-weight: 800; }
.fleet-scale { position: relative; display: flex; height: 8px; border-radius: 6px; overflow: visible; gap: 2px; }
.fleet-scale i { display: block; height: 100%; border-radius: 4px; }
.fleet-scale .s-good { width: 20%; background: var(--good); opacity: .7; }
.fleet-scale .s-warn { width: 30%; background: var(--warn); opacity: .7; }
.fleet-scale .s-crit { width: 50%; background: var(--crit); opacity: .7; }
.fleet-scale em { position: absolute; top: -5px; width: 4px; height: 18px; border-radius: 3px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); transform: translateX(50%); }
.fleet-legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: -6px; }
.recs { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line-2); }
.recs h4 { font-size: 13px; display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.recs h4 .ic { color: var(--accent); width: 16px; height: 16px; }
.recs ul { margin: 0; padding-inline-start: 18px; color: var(--ink-2); font-size: 13px; }
.recs li { margin: 3px 0; }
.recs li::marker { color: var(--accent); }

.alert-list, .act-list, .mini-list { list-style: none; margin: 0; padding: 0; }
.alert-list li a, .act-list li a, .mini-list li a { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; margin: 0 -10px; transition: background .12s; }
.alert-list li a:hover, .act-list li a:hover, .mini-list li a:hover { background: var(--surface-2); }
.alert-list li + li, .act-list li + li, .mini-list li + li { border-top: 1px solid var(--line); }
.al-main, .mini-list span:first-child { display: flex; flex-direction: column; flex: 1; min-width: 0; line-height: 1.5; }
.al-main small, .mini-list small { color: var(--muted); font-size: 12px; }
.al-val { font-size: 12.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.alert-list .st { min-width: 118px; justify-content: center; }
.more { font-size: 12px; color: var(--muted); padding-top: 8px; }
.calm { display: flex; align-items: center; gap: 10px; padding: 18px; border-radius: 12px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; }
.calm .ic { color: var(--good); width: 22px; height: 22px; }
.notice { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-radius: 12px; font-size: 13px; margin-bottom: 14px; flex-wrap: wrap; }
.notice > span { flex: 1 1 260px; }
.notice-info { background: var(--brand-softer); border: 1px solid var(--brand-soft); color: var(--ink-2); }
.notice-info > .ic { color: var(--brand); }
.notice-warn { background: var(--warn-bg); color: var(--warn-ink); }

/* ---------- حالت خالی ---------- */
.empty { text-align: center; padding: 40px 20px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.empty-ic { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: var(--brand-softer); color: var(--brand); margin-bottom: 6px; border: 1px solid var(--brand-soft); }
.empty-ic .ic { width: 28px; height: 28px; }
.empty h4 { font-size: 15px; font-weight: 700; }
.empty p { color: var(--muted); font-size: 13px; max-width: 380px; margin-bottom: 8px; }

/* ---------- فرم مرحله‌ای ---------- */
.wizard { display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 18px; align-items: start; }
.wz-side { position: sticky; top: 84px; display: flex; flex-direction: column; gap: 14px; }
.wz-steps { list-style: none; margin: 0; padding: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); counter-reset: s; }
.wz-steps button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 0; background: none; text-align: start; font-weight: 500; color: var(--ink-2); position: relative; }
.wz-steps li:not(:last-child) button::after { content: ''; position: absolute; inset-inline-start: 23px; top: 36px; height: 12px; width: 2px; background: var(--line-2); border-radius: 2px; }
.wz-steps li.done:not(:last-child) button::after { background: var(--brand); opacity: .5; }
.wz-steps button:hover { background: var(--surface-2); }
.ws-dot { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; background: var(--surface-3); color: var(--muted); flex: none; border: 1.5px solid transparent; }
.ws-dot .ic { width: 15px; height: 15px; }
.wz-steps li.done .ws-dot { background: var(--brand-soft); color: var(--brand); }
.wz-steps li.cur button { background: var(--brand-softer); color: var(--ink); font-weight: 700; }
.wz-steps li.cur .ws-dot { background: var(--brand); color: var(--brand-ink); box-shadow: 0 0 0 4px var(--brand-soft); }
.wz-live { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow-1); }
.wl-title { font-size: 12px; font-weight: 700; color: var(--muted); }
.wl-machine { display: flex; align-items: center; gap: 8px; }
.wl-machine .ic { color: var(--brand); }
.wl-acts { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px dashed var(--line-2); }
.wl-act { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; }
.wl-act small { color: var(--muted); }
.wz-main { padding: 0; overflow: hidden; }
.wz-head { display: flex; align-items: center; gap: 14px; padding: 20px 24px; border-bottom: 1px solid var(--line); position: relative; background: linear-gradient(180deg, var(--brand-softer), transparent); }
.wz-ic { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); box-shadow: 0 6px 16px -6px var(--brand); }
.wz-head small { color: var(--muted); font-size: 12px; }
.wz-head h2 { font-size: 19px; font-weight: 800; }
.wz-progress { position: absolute; bottom: -1px; inset-inline: 0; height: 3px; background: transparent; }
.wz-progress i { display: block; height: 100%; background: var(--brand); border-radius: 0 3px 3px 0; transition: width .35s ease; margin-inline-start: 0; }
.wz-body { padding: 24px; display: flex; flex-direction: column; gap: 18px; min-height: 300px; animation: fadeUp .22s ease-out; }
.wz-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-top: 1px solid var(--line); background: var(--surface-2); }
.wz-miss { display: inline-flex; align-items: center; gap: 6px; color: var(--crit-ink); font-size: 13px; font-weight: 600; }
.wz-miss .ic { width: 16px; height: 16px; }
.wz-miss.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

.q-label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }
.machine-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.mp { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); text-align: start; transition: border-color .15s, background .15s, box-shadow .15s; }
.mp:hover { border-color: var(--brand-2); }
.mp b { font-size: 15px; font-weight: 800; direction: ltr; }
.mp small { font-size: 12px; color: var(--muted); }
.mp-model { font-size: 11px; font-weight: 600; color: var(--brand); }
.mp-check { position: absolute; top: 10px; inset-inline-end: 10px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); opacity: 0; transform: scale(.6); transition: .15s; }
.mp-check .ic { width: 13px; height: 13px; stroke-width: 3; }
.mp.on { border-color: var(--brand); background: var(--brand-softer); box-shadow: 0 0 0 3px var(--brand-soft); }
.mp.on .mp-check { opacity: 1; transform: none; }

.q-card { display: flex; gap: 16px; padding: 18px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); }
.q-follow { margin-inline-start: 36px; background: var(--surface); border-style: dashed; animation: fadeUp .22s ease-out; }
.q-num { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 800; background: var(--surface); border: 1px solid var(--line-2); color: var(--brand); flex: none; }
.q-follow .q-num { background: var(--brand-softer); border-color: transparent; }
.q-num .ic { width: 16px; height: 16px; }
.q-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.q-main h4 { font-size: 15px; font-weight: 700; line-height: 1.7; }
.q-help { color: var(--muted); font-size: 13px; margin: -6px 0 0; }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 520px; }
.yn-opt { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); text-align: start; transition: .15s; }
.yn-opt:hover { border-color: var(--brand-2); }
.yn-ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); flex: none; transition: .15s; }
.yn-ic .ic { width: 17px; height: 17px; stroke-width: 2.5; }
.yn-l { display: flex; flex-direction: column; line-height: 1.45; }
.yn-l b { font-size: 15px; }
.yn-l small { color: var(--muted); font-size: 12px; }
.yn-opt.on { border-color: var(--brand); background: var(--brand-softer); box-shadow: 0 0 0 3px var(--brand-soft); }
.yn-opt.yn-yes.on .yn-ic { background: var(--brand); color: var(--brand-ink); }
.yn-opt.yn-no.on .yn-ic { background: var(--ink-2); color: var(--surface); }
.flag { display: flex; gap: 10px; align-items: flex-start; padding: 11px 14px; border-radius: 12px; font-size: 13.5px; line-height: 1.8; animation: fadeUp .22s ease-out; }
.flag .ic { margin-top: 3px; }
.flag-driver { background: color-mix(in srgb, var(--c-driver) 12%, var(--surface)); color: var(--ink); }
.flag-driver .ic { color: var(--c-driver); }
.flag-pm { background: color-mix(in srgb, var(--c-pm) 12%, var(--surface)); }
.flag-pm .ic { color: var(--c-pm); }
.flag-ok { background: var(--good-bg); color: var(--ink); }
.flag-ok .ic { color: var(--good); }
.q-extra { animation: fadeUp .22s ease-out; }
.gold { display: flex; flex-direction: column; gap: 12px; }
.gold-step { display: flex; gap: 12px; align-items: flex-start; }
.gold-n { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-weight: 800; font-size: 13px; flex: none; margin-top: 26px; }
.gold-step .field { flex: 1; }
.sev-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sp { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 16px; border-radius: 14px; border: 1.5px solid var(--line-2); background: var(--surface); text-align: start; transition: .15s; }
.sp:hover { border-color: var(--spc); }
.sp b { font-size: 15px; }
.sp small { color: var(--muted); font-size: 12px; line-height: 1.6; }
.sp-bars { display: flex; gap: 3px; align-items: flex-end; height: 20px; margin-bottom: 4px; }
.sp-bars i { width: 6px; border-radius: 2px; background: var(--grid); }
.sp-bars i:nth-child(1) { height: 8px; } .sp-bars i:nth-child(2) { height: 14px; } .sp-bars i:nth-child(3) { height: 20px; }
.sp-low { --spc: #8fb3bc; } .sp-low .sp-bars i:nth-child(1) { background: var(--spc); }
.sp-mid { --spc: var(--serious); } .sp-mid .sp-bars i:nth-child(-n+2) { background: var(--spc); }
.sp-high { --spc: var(--crit); } .sp-high .sp-bars i { background: var(--spc); }
.sp.on { border-color: var(--spc); background: color-mix(in srgb, var(--spc) 9%, var(--surface)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--spc) 20%, transparent); }

/* بازبینی / نتیجه */
.review { display: flex; flex-direction: column; gap: 16px; }
.rv-result { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 14px; background: color-mix(in srgb, var(--rc) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--rc) 30%, transparent); }
.rv-result > div:nth-child(2) { flex: 1; }
.rv-result small { color: var(--ink-2); font-size: 12px; }
.rv-result h3 { font-size: 19px; font-weight: 800; }
.rv-ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--rc); color: #fff; }
.rv-ic .ic { width: 24px; height: 24px; }
.rv-none { --rc: var(--c-none); } .rv-driver { --rc: var(--c-driver); } .rv-pm { --rc: var(--c-pm); } .rv-both { --rc: var(--c-both); }
.rv-acts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.act-card { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); position: relative; overflow: hidden; }
.act-card::before { content: ''; position: absolute; inset-inline-start: 0; top: 0; bottom: 0; width: 4px; background: var(--tc); }
.act-card.tone-warn { --tc: var(--warn); } .act-card.tone-serious { --tc: var(--serious); } .act-card.tone-crit { --tc: var(--crit); }
.ac-main { flex: 1; display: flex; flex-direction: column; line-height: 1.5; min-width: 0; }
.ac-main small, .ac-act small { color: var(--muted); font-size: 11.5px; }
.ac-main b { font-size: 14.5px; }
.ac-main span { font-size: 12px; color: var(--ink-2); }
.ac-act { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.rv-grid, .kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 0; }
.rv-grid > div, .kv > div { background: var(--surface-2); border-radius: 10px; padding: 9px 12px; }
.rv-grid dt, .kv dt { font-size: 11.5px; color: var(--muted); }
.rv-grid dd, .kv dd { margin: 0; font-weight: 600; }
.qa { width: 100%; border-collapse: collapse; font-size: 13.5px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.qa th { width: 40px; background: var(--surface-2); color: var(--brand); font-weight: 800; text-align: center; border-bottom: 1px solid var(--line); }
.qa td { padding: 11px 14px; border-bottom: 1px solid var(--line); }
.qa td:last-child { width: 130px; text-align: center; }
.qa tr:last-child td, .qa tr:last-child th { border-bottom: 0; }
.qa tr.sub td:first-of-type { padding-inline-start: 30px; color: var(--ink-2); position: relative; }
.qa tr.sub td:first-of-type::before { content: '↲'; position: absolute; inset-inline-start: 12px; color: var(--muted); }
.qa-note { margin-top: 6px; padding: 8px 12px; border-radius: 8px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; }
.qa-note p { margin: 2px 0; }

/* ---------- پرسنل ---------- */
.people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
.person-card { display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: transform .15s, box-shadow .15s, border-color .15s; }
.person-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: var(--line-2); }
.person-card.inactive { opacity: .6; }
.pc-top { display: flex; align-items: center; gap: 12px; }
.pc-top div { display: flex; flex-direction: column; line-height: 1.45; }
.pc-top b { font-size: 15px; }
.pc-top small { color: var(--muted); font-size: 12px; }
.pc-sev { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pcs { background: var(--surface-2); border-radius: 10px; padding: 7px 10px; display: flex; flex-direction: column; border-top: 2px solid var(--sc); }
.pcs span { font-size: 11px; color: var(--muted); }
.pcs b { font-size: 18px; font-weight: 800; line-height: 1.3; }
.pcs-low { --sc: #8fb3bc; } .pcs-mid { --sc: var(--serious); } .pcs-high { --sc: var(--crit); }
.pc-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pc-ms { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.pc-ms i { font-style: normal; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; background: var(--surface-3); color: var(--ink-2); direction: ltr; }
.rules-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 10px; }
.rule-col { background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.rule-head { padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.rule-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--ink-2); }
.profile { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.profile h3 { font-size: 18px; font-weight: 800; margin-top: 6px; }
.kv-line { display: flex; gap: 6px; align-items: center; color: var(--ink-2); }
.note { color: var(--ink-2); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 6px 0 0; white-space: pre-wrap; width: 100%; text-align: start; }
.timeline { list-style: none; margin: 0; padding: 0; position: relative; }
.timeline::before { content: ''; position: absolute; inset-inline-start: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.timeline li { position: relative; padding-inline-start: 24px; }
.tl-dot { position: absolute; inset-inline-start: 1px; top: 17px; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface); background: var(--sc, var(--muted)); box-shadow: 0 0 0 1px var(--line-2); }
.tl-dot.sev-low { --sc: #8fb3bc; } .tl-dot.sev-mid { --sc: var(--serious); } .tl-dot.sev-high { --sc: var(--crit); }
.timeline a { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px; }
.timeline a:hover { background: var(--surface-2); }
.tl-main { flex: 1; display: flex; flex-direction: column; line-height: 1.5; min-width: 0; }
.tl-main small { color: var(--muted); font-size: 12px; }
.act-table td:first-child { font-weight: 600; }

/* ---------- ماشین‌آلات ---------- */
.machine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.machine-card { display: flex; flex-direction: column; gap: 14px; padding: 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: transform .15s, box-shadow .15s; position: relative; overflow: hidden; }
.machine-card::before { content: ''; position: absolute; inset: 0 0 auto; height: 70px; background: linear-gradient(180deg, var(--brand-softer), transparent); pointer-events: none; }
.machine-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); }
.machine-card.inactive { opacity: .55; }
.mc-top { display: flex; align-items: center; justify-content: space-between; position: relative; }
.mc-model { font-size: 11.5px; font-weight: 700; padding: 2px 10px; border-radius: 20px; background: var(--surface); border: 1px solid var(--line-2); color: var(--brand); }
.mc-name { display: flex; flex-direction: column; position: relative; }
.mc-name b { font-size: 24px; font-weight: 800; letter-spacing: -.5px; direction: ltr; text-align: end; align-self: flex-start; }
.mc-name small { color: var(--muted); }
.mc-people { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; }
.mc-people div { background: var(--surface-2); border-radius: 10px; padding: 7px 10px; min-width: 0; }
.mc-people dt { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.mc-people dt .ic { width: 13px; height: 13px; }
.mc-people dd { margin: 0; font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mc-stats { display: grid; grid-template-columns: 1fr 1fr 1.3fr; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); align-items: center; }
.mc-stats > div { display: flex; flex-direction: column; line-height: 1.35; }
.mc-stats span { font-size: 11px; color: var(--muted); }
.mc-stats b { font-size: 16px; font-weight: 800; }
.mc-stats small { font-size: 11px; color: var(--muted); }
.mc-maint { align-items: flex-end; gap: 4px; }
.info-card { margin-bottom: 18px; padding: 0; overflow: hidden; }
.info-table { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.info-table > div { padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; border-inline-start: 1px solid var(--line); }
.info-table > div:first-child { border-inline-start: 0; }
.info-table span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.info-table b { font-size: 14.5px; font-weight: 700; }
.info-table b a:hover { color: var(--brand); }
.odo-big { font-size: 34px; font-weight: 800; letter-spacing: -1px; display: flex; align-items: baseline; gap: 8px; line-height: 1.3; }
.odo-big small { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
.odo-log { list-style: none; margin: 12px 0 0; padding: 10px 0 0; border-top: 1px solid var(--line); font-size: 12.5px; }
.odo-log li { display: flex; justify-content: space-between; padding: 3px 0; color: var(--ink-2); }
.maint-peek { display: block; transition: box-shadow .15s; }
.maint-peek:hover { box-shadow: var(--shadow-2); }
.maint-peek .card-head .ic { color: var(--muted); }
.mp-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.mpc { border-radius: 10px; padding: 8px; text-align: center; display: flex; flex-direction: column; background: var(--mb); }
.mpc b { font-size: 20px; font-weight: 800; color: var(--mc); line-height: 1.3; }
.mpc span { font-size: 10.5px; color: var(--ink-2); }
.mpc.crit { --mb: var(--crit-bg); --mc: var(--crit-ink); } .mpc.warn { --mb: var(--warn-bg); --mc: var(--warn-ink); } .mpc.good { --mb: var(--good-bg); --mc: var(--good); } .mpc.muted { --mb: var(--surface-2); --mc: var(--muted); }

/* ---------- نگهداری ---------- */
.howto { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; padding: 0; margin-bottom: 18px; overflow: hidden; }
.howto-step { display: flex; gap: 12px; align-items: center; padding: 16px 18px; border-inline-start: 1px solid var(--line); }
.howto-step:first-child { border-inline-start: 0; }
.howto-step > span { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); font-weight: 800; flex: none; }
.howto-step div { display: flex; flex-direction: column; line-height: 1.5; }
.howto-step small { color: var(--muted); font-size: 12px; }
.maint-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.maint-pick { display: flex; align-items: center; gap: 16px; padding: 16px 18px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); transition: .15s; }
.maint-pick:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); }
.mpk-ring { position: relative; width: 56px; height: 56px; flex: none; }
.mpk-ring span { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 800; }
.mpk-main { flex: 1; display: flex; flex-direction: column; min-width: 0; line-height: 1.45; }
.mpk-main b { font-size: 17px; font-weight: 800; direction: ltr; text-align: end; align-self: flex-start; }
.mpk-main small { color: var(--muted); font-size: 12px; }
.mpk-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.mpk-go { color: var(--muted); }
.machine-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; scrollbar-width: thin; }
.mtab { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-weight: 700; font-size: 13px; white-space: nowrap; direction: ltr; transition: .15s; }
.mtab:hover { border-color: var(--line-2); }
.mtab.on { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.mtab .dot { width: 7px; height: 7px; border-radius: 50%; }
.dot.crit { background: var(--crit); } .dot.warn { background: var(--warn); }
.mtab.on .dot { box-shadow: 0 0 0 2px var(--brand); }
.maint-top { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, 1.6fr); gap: 16px; margin-bottom: 16px; }
.odo-hero { display: flex; align-items: center; gap: 14px; }
.oh-ic { width: 50px; height: 50px; border-radius: 14px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex: none; }
.oh-ic .ic { width: 26px; height: 26px; }
.oh-main { flex: 1; display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
.oh-main small { color: var(--muted); font-size: 12px; }
.oh-main b { font-size: 26px; font-weight: 800; letter-spacing: -.5px; }
.oh-main span { font-size: 12px; color: var(--ink-2); }
.sum-tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.sum-tile { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px; padding: 12px 16px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow-1); text-align: start; transition: .15s; position: relative; overflow: hidden; }
.sum-tile b { font-size: 28px; font-weight: 800; color: var(--tc); line-height: 1.2; }
.sum-tile span { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; color: var(--ink-2); }
.sum-tile span .ic { width: 14px; height: 14px; color: var(--tc); }
.sum-tile:hover { border-color: var(--line-2); }
.sum-tile.on { background: var(--tb); border-color: color-mix(in srgb, var(--tc) 40%, transparent); }
.sum-tile.crit { --tc: var(--crit-ink); --tb: var(--crit-bg); } .sum-tile.warn { --tc: var(--warn-ink); --tb: var(--warn-bg); } .sum-tile.good { --tc: var(--good); --tb: var(--good-bg); } .sum-tile.muted { --tc: var(--muted); --tb: var(--surface-2); }
.sys-block { margin-bottom: 14px; }
.sys-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 14px 18px; border: 0; background: none; text-align: start; }
.sys-head:hover { background: var(--surface-2); }
.sys-head h3 { font-size: 15px; font-weight: 700; }
.sys-ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); flex: none; }
.sys-ic .ic { width: 17px; height: 17px; }
.count { font-size: 12px; color: var(--muted); }
.sys-head .chev { color: var(--muted); transition: transform .2s; }
.sys-block.collapsed .chev { transform: rotate(90deg); }
.sys-block.collapsed .table-wrap { display: none; }
.sys-block .table-wrap { border-top: 1px solid var(--line); }
.maint-table td { padding: 10px 14px; }
.maint-table .part-cell { min-width: 210px; }
.st-row-over td:first-child { box-shadow: inset -3px 0 0 var(--crit); }
.st-row-soon td:first-child { box-shadow: inset -3px 0 0 var(--warn); }
.last { display: flex; flex-direction: column; line-height: 1.4; }
.last small { color: var(--muted); font-size: 11.5px; }
.remain { min-width: 140px; display: flex; flex-direction: column; gap: 5px; }
.remain-t { font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.remain-t i { font-style: normal; color: var(--muted); margin: 0 5px; }
.remain-t b.neg { color: var(--crit-ink); }
.bar { height: 5px; border-radius: 4px; background: var(--grid); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--good); transition: width .4s; }
.bar-soon i { background: var(--warn); } .bar-over i { background: var(--crit); }
.row-actions { display: flex; align-items: center; gap: 2px; justify-content: flex-end; white-space: nowrap; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.hist li > div { flex: 1; display: flex; flex-direction: column; }
.hist small { color: var(--muted); }
.h-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); flex: none; }
.bulk-tools { display: flex; gap: 6px; margin: 16px 0 10px; }
.bulk-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-height: 42vh; overflow: auto; padding: 2px; }
.bulk-list fieldset { border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px 10px; margin: 0; display: flex; flex-direction: column; gap: 5px; }
.bulk-list legend { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px; padding: 0 6px; }
.bulk-list legend .ic { color: var(--brand); width: 16px; height: 16px; }
.bulk-list .check { font-size: 13px; }

/* ---------- قطعات جایگزین ---------- */
.model-tabs { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-bottom: 16px; }
.model-tab { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--surface); border: 1.5px solid var(--line); transition: .15s; }
.model-tab:hover { border-color: var(--line-2); }
.model-tab.on { border-color: var(--brand); background: var(--brand-softer); box-shadow: 0 0 0 3px var(--brand-soft); }
.mt-ic { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-2); flex: none; }
.model-tab.on .mt-ic { background: var(--brand); color: var(--brand-ink); }
.mt-main { flex: 1; display: flex; flex-direction: column; line-height: 1.4; min-width: 0; }
.mt-main b { font-size: 15px; }
.mt-main small { color: var(--muted); font-size: 12px; direction: ltr; text-align: end; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mt-count { font-size: 13px; font-weight: 800; color: var(--brand); }
.mt-count i { font-style: normal; color: var(--muted); margin: 0 2px; font-weight: 400; }
.alt-block { margin-bottom: 14px; padding: 0; overflow: hidden; }
.alt-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.alt-head h3 { font-size: 15px; font-weight: 700; }
.alt-row { display: grid; grid-template-columns: minmax(180px, 280px) 1fr auto; gap: 14px; align-items: center; padding: 10px 18px; border-bottom: 1px solid var(--line); transition: background .15s; }
.alt-row:last-child { border-bottom: 0; }
.alt-row:hover { background: var(--surface-2); }
.alt-row.focus { background: var(--accent-soft); animation: focusPulse 1.6s ease-out; }
@keyframes focusPulse { 0% { box-shadow: inset 0 0 0 2px var(--accent); } 100% { box-shadow: inset 0 0 0 2px transparent; } }
.alt-part b { display: block; font-weight: 600; }
.alt-part small { display: block; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
.alt-chips { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.alt-chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 6px 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; transition: .15s; max-width: 100%; }
.alt-chip:hover { border-color: var(--brand-2); }
.alt-chip .ac-n { font-size: 10.5px; font-weight: 700; color: var(--brand); background: var(--brand-soft); padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
.alt-chip b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.alt-chip small { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.alt-chip .ic { width: 16px; height: 16px; color: var(--good); }
.alt-chip.ok { border-color: color-mix(in srgb, var(--good) 35%, transparent); }
.alt-add { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 12px; border-radius: 10px; border: 1.5px dashed var(--line-2); background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 600; transition: .15s; }
.alt-add:hover { color: var(--brand); border-color: var(--brand-2); background: var(--brand-softer); }
.alt-add .ic { width: 15px; height: 15px; }
.alt-edit { border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; background: var(--surface-2); }
.ae-n { font-size: 12px; font-weight: 800; color: var(--brand); margin-bottom: 10px; }
.ae-tools { display: flex; align-items: center; gap: 4px; margin-top: 12px; }
.modal-ctx { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--surface-2); margin-bottom: 14px; font-size: 13px; }
.modal-ctx .ic { color: var(--brand); }
.modal-ctx span { color: var(--muted); }

/* ---------- پشتیبان ---------- */
.backup-hero { display: flex; align-items: center; gap: 20px; margin-bottom: 18px; padding: 24px; position: relative; overflow: hidden; }
.backup-hero::before { content: ''; position: absolute; inset: 0; background: radial-gradient(80% 140% at 100% 0%, var(--hb), transparent 60%); pointer-events: none; }
.backup-hero.tone-good { --hb: var(--good-bg); --hc: var(--good); }
.backup-hero.tone-warn { --hb: var(--warn-bg); --hc: var(--warn-ink); }
.bh-ic { width: 64px; height: 64px; border-radius: 18px; display: grid; place-items: center; background: var(--surface); color: var(--hc); box-shadow: var(--shadow-2); flex: none; position: relative; }
.bh-ic .ic { width: 32px; height: 32px; }
.bh-main { flex: 1; position: relative; }
.bh-main h2 { font-size: 20px; font-weight: 800; }
.bh-main p { margin: 2px 0; color: var(--ink-2); }
.backup-hero .btn { position: relative; }
.auto-on { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: var(--good-bg); }
.auto-on div { display: flex; flex-direction: column; }
.auto-on small { color: var(--ink-2); }
.pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 0 rgba(12, 163, 12, .5); animation: pulse 2s infinite; flex: none; }
@keyframes pulse { 70% { box-shadow: 0 0 0 10px rgba(12, 163, 12, 0); } 100% { box-shadow: 0 0 0 0 rgba(12, 163, 12, 0); } }
.drop { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 26px; border-radius: 14px; border: 2px dashed var(--line-2); background: var(--surface-2); cursor: pointer; text-align: center; transition: .15s; margin-bottom: 10px; }
.drop .ic { width: 30px; height: 30px; color: var(--brand); margin-bottom: 4px; }
.drop span { color: var(--muted); font-size: 12.5px; }
.drop:hover, .drop.over { border-color: var(--brand-2); background: var(--brand-softer); }
.stats-list { list-style: none; margin: 0 0 12px; padding: 0; }
.stats-list li { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
.stats-list li span { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.stats-list li .ic { width: 16px; height: 16px; color: var(--muted); }
.stats-list li b { font-size: 15px; }
.snap-list { list-style: none; margin: 0; padding: 0; }
.snap-list li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.snap-list li:last-child { border-bottom: 0; }
.snap-list li div { display: flex; flex-direction: column; line-height: 1.45; }
.snap-list small { color: var(--muted); font-size: 12px; }
.sn-ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--surface-2); color: var(--brand); }
.skeleton { height: 120px; border-radius: 12px; background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2)); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { to { background-position: -200% 0; } }
.danger-zone { border-color: color-mix(in srgb, var(--crit) 25%, var(--line)); }
.danger-zone h3 .ic { color: var(--crit) !important; }

/* ---------- تنظیمات ---------- */
.rules-editor { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.rule-edit { background: var(--surface-2); border-radius: 14px; padding: 12px; }
.re-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.re-rows { display: flex; flex-direction: column; gap: 6px; }
.re-row { display: grid; grid-template-columns: 62px 62px 1fr 30px; gap: 6px; align-items: center; }
.re-row .input { height: 34px; padding: 0 8px; font-size: 13px; }
.re-labels span { font-size: 11px; color: var(--muted); font-weight: 600; }
.model-list { list-style: none; margin: 0; padding: 0; }
.model-list li { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); }
.model-list span { display: flex; flex-direction: column; line-height: 1.45; }
.model-list small { color: var(--muted); font-size: 12px; }
.about p { color: var(--ink-2); }

/* ---------- پنجره ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(8, 12, 16, .45); backdrop-filter: blur(3px); opacity: 0; transition: opacity .2s; }
.modal { position: relative; width: 100%; max-height: calc(100vh - 40px); display: flex; flex-direction: column; background: var(--surface); border-radius: var(--r-xl); box-shadow: var(--shadow-3); border: 1px solid var(--line); opacity: 0; transform: translateY(10px) scale(.985); transition: opacity .2s, transform .2s; }
.modal-wrap.in .modal-backdrop { opacity: 1; }
.modal-wrap.in .modal { opacity: 1; transform: none; }
.modal-sm { max-width: 440px; } .modal-md { max-width: 600px; } .modal-lg { max-width: 820px; }
.modal-head { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
.modal-head h3 { flex: 1; font-size: 16px; font-weight: 800; }
.modal-ic { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); }
.modal-body { padding: 20px; overflow-y: auto; }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface-2); border-radius: 0 0 var(--r-xl) var(--r-xl); }
.confirm-msg { font-size: 14px; color: var(--ink-2); line-height: 1.9; }
body.has-modal { overflow: hidden; }

.toasts { position: fixed; bottom: 22px; left: 22px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
.toast { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; background: #15191d; color: #f0f2f3; box-shadow: var(--shadow-3); font-weight: 500; font-size: 13.5px; transform: translateY(12px); opacity: 0; transition: .25s; max-width: 420px; }
.toast.in { transform: none; opacity: 1; }
.toast-ok .ic { color: #5fd35f; } .toast-warn .ic { color: #fbc54d; } .toast-danger .ic { color: #f08080; } .toast-info .ic { color: #7fd3e1; }

/* تقویم */
.datepicker { position: absolute; z-index: 80; width: 288px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 16px; box-shadow: var(--shadow-3); padding: 12px; animation: pop .14s ease-out; }
.dp-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.dp-head .icon-btn { width: 32px; height: 32px; }
.dp-title b { font-size: 15px; }
.dp-title span { color: var(--muted); }
.dp-week, .dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.dp-week span { font-size: 11.5px; color: var(--muted); font-weight: 600; padding: 4px 0; }
.dp-day { height: 34px; border: 0; background: none; border-radius: 9px; font-size: 13px; font-weight: 500; }
.dp-day:hover { background: var(--surface-3); }
.dp-day.today { color: var(--brand); font-weight: 800; box-shadow: inset 0 0 0 1.5px var(--brand-soft); }
.dp-day.sel { background: var(--brand); color: var(--brand-ink); font-weight: 700; }
.dp-foot { display: flex; justify-content: space-between; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); }

.ring { display: block; }

/* ---------- واکنش‌گرا ---------- */
@media (max-width: 1280px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 > :last-child { grid-column: 1 / -1; }
  .info-table { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .info-table > div:nth-child(4) { border-inline-start: 0; }
  .info-table > div:nth-child(n+4) { border-top: 1px solid var(--line); }
}
@media (max-width: 1080px) {
  #app { grid-template-columns: 1fr; }
  #app::before { display: none; }
  .sidebar { position: fixed; inset-block: 0; inset-inline-start: 0; width: var(--side-w); transform: translateX(100%); transition: transform .25s ease; }
  body.nav-open .sidebar { transform: none; box-shadow: var(--shadow-3); }
  .scrim { display: block; position: fixed; inset: 0; z-index: 25; background: rgba(0, 0, 0, .35); opacity: 0; pointer-events: none; transition: opacity .2s; }
  body.nav-open .scrim { opacity: 1; pointer-events: auto; }
  .only-mobile { display: inline-grid; }
  .grid-main { grid-template-columns: 1fr; }
  .wizard { grid-template-columns: minmax(0, 1fr); }
  .wz-side { position: static; min-width: 0; }
  .wz-steps { display: flex; overflow-x: auto; gap: 4px; }
  .wz-steps li { flex: none; }
  .wz-steps li button::after { display: none; }
  .wz-steps button span:last-child { white-space: nowrap; font-size: 12.5px; }
  .maint-top { grid-template-columns: 1fr; }
  .rules-editor, .rules-grid { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .topbar { padding: 10px 16px; gap: 8px; }
  .top-actions { gap: 6px; }
  .search input::placeholder { font-size: 12.5px; }
  .search kbd { display: none; }
  .btn-new span { display: none; }
  .btn-new { width: 38px; padding: 0; }
  .view { padding: 18px 16px 50px; }
  .ph-text h1 { font-size: 20px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpis .kpi:first-child { grid-column: 1 / -1; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .donut { flex-direction: column; align-items: stretch; }
  .donut-fig { align-self: center; }
  .form-grid { grid-template-columns: 1fr; }

/* ---------- چاپ ---------- */

.sep { color: var(--muted); margin: 0 6px; opacity: .7; }
.mcode { direction: ltr; unicode-bidi: isolate; white-space: nowrap; }
.page > .card, .page > section.card { margin-bottom: 18px; }
.card form + .card-head, .card .form-grid + .card-head { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }

/* ============================================================
   افزوده‌ها: شرکت، خرابی‌ها، جزئیات داشبورد، تبعات، چاپ
   ============================================================ */
.brand-text .co { font-size: 12px; font-weight: 700; color: #bfe0e6; white-space: normal; line-height: 1.5; }
.brand-text small { font-size: 11px; color: var(--side-muted); }

.section-title .ic { color: var(--brand); }
.dash-sec { margin-top: 6px; }
.sub-line { display: block; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.count { font-size: 12px; color: var(--muted); }

/* کارت‌های قابل کلیک داشبورد */

.legend-v li[data-href]:hover { background: var(--surface-2); }

/* صفحه جزئیات */

.ins-kind { display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); font-weight: 600; font-size: 13px; white-space: nowrap; transition: .15s; }
.ins-kind .ic { width: 16px; height: 16px; color: var(--kc); }

.ins-kind.on { border-color: var(--kc); background: color-mix(in srgb, var(--kc) 10%, var(--surface)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--kc) 16%, transparent); }
.ins-tiles { display: grid; grid-template-columns: 1.4fr repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.ins-tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 2px; min-width: 0; }

/* کادر تایپ یا انتخاب */

.input-ic.combo .combo-chev { inset-inline-start: auto; inset-inline-end: 10px; width: 16px; height: 16px; }
.combo-pop { position: absolute; z-index: 85; max-height: 270px; overflow-y: auto; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow-3); padding: 5px; animation: pop .12s ease-out; }
.cb-item { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 0; background: none; border-radius: 8px; text-align: start; font-size: 13.5px; }

.cb-item + .cb-new { border-top: 1px dashed var(--line-2); margin-top: 4px; }
.cb-new .ic, .cb-empty .ic { width: 15px; height: 15px; }

/* خرابی‌ها و تعمیرات */
.st-info { background: var(--brand-soft); color: var(--brand); }

.rep-table td { vertical-align: top; }

.sum-tile.info { --tc: var(--brand); --tb: var(--brand-soft); }
.sum-tiles.five { grid-template-columns: repeat(5, minmax(0, 1fr)); margin-bottom: 16px; }

.up { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 11px 13px; border-radius: 12px; border: 1.5px solid var(--line-2); background: var(--surface); text-align: start; transition: .15s; --uc: var(--muted); }
.up b { font-size: 13.5px; display: flex; align-items: center; gap: 7px; }
.up b::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--uc); flex: none; }
.up small { color: var(--muted); font-size: 11.5px; }

.up:hover { border-color: var(--uc); }
.up.on { border-color: var(--uc); background: color-mix(in srgb, var(--uc) 9%, var(--surface)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--uc) 18%, transparent); }
.form-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.rep-form > .card { margin-bottom: 16px; }

.rep-form .card-head h3 .req { color: var(--crit); font-style: normal; }
.form-actions { display: flex; align-items: center; gap: 12px; justify-content: space-between; padding: 12px 18px; position: sticky; bottom: 12px; z-index: 5; box-shadow: var(--shadow-2); }
.delay-live { min-height: 40px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; }
.delay-reason.need .input { border-color: var(--crit); box-shadow: 0 0 0 3px var(--crit-bg); }
.delay-reason.need .field-label::after { content: ' — تعمیر تأخیر داشته؛ علت را بنویسید'; color: var(--crit-ink); font-weight: 600; }
.rep-hero { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 14px; background: color-mix(in srgb, var(--rc) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--rc) 28%, transparent); margin-bottom: 20px; }
.rep-hero small { color: var(--ink-2); font-size: 12px; }

.rh-wait { --rc: var(--warn); } .rh-repair { --rc: var(--brand-2); } .rh-done { --rc: var(--good); } .rh-late { --rc: var(--crit); }
.rep-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); }
.rep-steps li { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 3px; position: relative; padding: 0 6px; }
.rep-steps li:not(:last-child)::before { content: ''; position: absolute; top: 16px; inset-inline-start: 50%; width: 100%; height: 2px; background: var(--line-2); }

.rs-dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); position: relative; z-index: 1; border: 3px solid var(--surface); }
.rs-dot .ic { width: 16px; height: 16px; }
.rep-steps li.done .rs-dot { background: var(--brand); color: var(--brand-ink); }
.rep-steps li.cur .rs-dot { background: var(--brand-soft); color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.rep-steps b { font-size: 13px; }

.rep-quick { justify-content: center; margin-top: 18px; }
.kv dd.pre { white-space: pre-wrap; font-weight: 500; }
.kv > div.bad { background: var(--crit-bg); }
.an-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.an-link:hover { background: var(--brand-softer); }

@media (max-width: 1280px) {

}

}

  .head-acts .link { display: none; }

  .rank em { display: none; }

  .cons-txt { -webkit-line-clamp: 3; }
}
