const INSIGHT = {
  total: { title: 'همه بررسی‌ها', icon: 'clipboard-list', color: 'var(--brand)', test: () => true },
  driver: { title: 'سهل‌انگاری راننده', icon: 'user', color: 'var(--c-driver)', test: a => Logic.resultOf(a) === 'driver' },
  pm: { title: 'سهل‌انگاری مسئول PM', icon: 'user-cog', color: 'var(--c-pm)', test: a => Logic.resultOf(a) === 'pm' },
  both: { title: 'سهل‌انگاری مشترک (راننده و PM)', icon: 'users', color: 'var(--c-both)', test: a => Logic.resultOf(a) === 'both' },
  none: { title: 'بدون سهل‌انگاری', icon: 'circle-check', color: 'var(--c-none)', test: a => Logic.resultOf(a) === 'none' },
};
const PERIOD_LABEL = { all: 'همه دوره‌ها', '30': '۳۰ روز گذشته', '90': '۹۰ روز گذشته', year: 'سال جاری' };
function dashFilterText() {
  const p = [];
  if (DashState.driver) p.push('راننده: ' + Q.pname(DashState.driver));
  if (DashState.machine) p.push('ماشین: ' + ((Q.machine(DashState.machine) || {}).code || ''));
  p.push(PERIOD_LABEL[DashState.period] || '');
  return p.filter(Boolean).join(' · ');
}

Pages.insight = (kind, mid) => {
  if (!INSIGHT[kind]) kind = 'total';
  const K = INSIGHT[kind];
  if (mid && Q.machine(mid)) DashState.machine = mid;
  const d = Store.get();
  const all = filterAnalyses(d.analyses, DashState);
  const list = Logic.sorted(all.filter(K.test)).reverse();
  const n = list.length;
  const bySev = SEVERITIES.map(s => ({ s, n: list.filter(a => a.severity === s.key).length }));
  const groupBy = (keyFn, labelFn, hrefFn) => {
    const m = new Map();
    list.forEach(a => { const k = keyFn(a); if (!k) return; m.set(k, (m.get(k) || 0) + 1); });
    return [...m.entries()].map(([k, c]) => ({ c, label: labelFn(k), href: hrefFn(k) })).sort((a, b) => b.c - a.c);
  };
  const byMachine = groupBy(a => a.machineId, id => (Q.machine(id) || {}).code || '—', id => '#/machines/' + id);
  const byDriver = groupBy(a => a.driverId, id => Q.pname(id), id => '#/people/' + id);
  const byPm = groupBy(a => a.pmId, id => Q.pname(id), id => '#/people/' + id);
  const rankCard = (title, ic, rows) => `<section class="card">
      <div class="card-head"><h3>${icon(ic)}${title}</h3></div>
      ${rows.length ? `<ul class="rank">${rows.map(r => `<li><a href="${r.href}">
        <span class="rk-l">${esc(r.label)}</span>
        <span class="rk-bar"><i style="width:${(r.c / rows[0].c) * 100}%;background:${K.color}"></i></span>
        <b>${nf(r.c)}</b><em>${pct(r.c, n, 0)}</em></a></li>`).join('')}</ul>` : '<p class="muted small">موردی وجود ندارد.</p>'}
    </section>`;
  const peopleCards = kind === 'pm' ? [rankCard('به تفکیک مسئول PM', 'user-cog', byPm)]
    : kind === 'both' ? [rankCard('به تفکیک راننده', 'user', byDriver), rankCard('به تفکیک مسئول PM', 'user-cog', byPm)]
      : [rankCard('به تفکیک راننده', 'user', byDriver)];

  const drivers = d.people.filter(p => p.role === 'driver');
  const periodOpts = [['all', 'همه دوره‌ها'], ['30', '۳۰ روز گذشته'], ['90', '۹۰ روز گذشته'], ['year', 'سال جاری']];
  const rows = list.map(a => {
    const m = Q.machine(a.machineId) || {};
    const acts = Logic.actionsFor(a);
    return `<tr class="row-link" data-href="#/analyses/${a.id}">
      <td class="nowrap">${toFa(a.date)}</td>
      <td><b class="mcode">${esc(m.code || '—')}</b></td>
      <td class="cell-topic"><b>${esc(a.topic || '—')}</b>${a.cause ? `<small>${esc(a.cause)}</small>` : ''}</td>
      <td>${esc(Q.pname(a.driverId))}</td>
      <td>${esc(Q.pname(a.pmId))}</td>
      <td>${sevPill(a.severity)}</td>
      <td>${resultPill(Logic.resultOf(a))}</td>
      <td class="acts-cell">${acts.driver ? `<div>${actionPill(acts.driver.action)}<small>راننده · بار ${nf(acts.driver.n)}</small></div>` : ''}${acts.pm ? `<div>${actionPill(acts.pm.action)}<small>PM · بار ${nf(acts.pm.n)}</small></div>` : ''}${!acts.driver && !acts.pm ? '<span class="muted">—</span>' : ''}</td>
    </tr>`;
  }).join('');

  const html = `
    <div class="ins-kinds">${Object.entries(INSIGHT).map(([k, v]) => `<a class="ins-kind ${k === kind ? 'on' : ''}" style="--kc:${v.color}" href="#/insight/${k}">${icon(v.icon)}<span>${v.title}</span><i>${nf(all.filter(v.test).length)}</i></a>`).join('')}</div>

    <div class="filters card">
      <div class="filters-title">${icon('filter')}<span>فیلترها</span></div>
      ${F.field('راننده', F.select('driver', [['', 'همه رانندگان'], ...drivers.map(p => [p.id, p.name])], DashState.driver))}
      ${F.field('ماشین', F.select('machine', [['', 'همه ماشین‌ها'], ...d.machines.map(m => [m.id, m.code])], DashState.machine))}
      <div class="field"><span class="field-label">بازه زمانی</span>
        <div class="seg">${periodOpts.map(([v, l]) => `<button type="button" class="${DashState.period === v ? 'on' : ''}" data-period="${v}">${l}</button>`).join('')}</div>
      </div>
      ${(DashState.driver || DashState.machine || DashState.period !== 'all') ? `<button class="btn btn-ghost btn-sm" data-reset>${icon('rotate-ccw')}حذف فیلترها</button>` : ''}
    </div>

    <div class="ins-tiles" style="--kc:${K.color}">
      <div class="ins-tile main"><span>${esc(K.title)}</span><b>${nf(n)}</b><small>${kind === 'total' ? 'بررسی در این فیلتر' : pct(n, all.length) + ' از ' + nf(all.length) + ' بررسی'}</small></div>
      ${bySev.map(x => `<div class="ins-tile"><span>${sevPill(x.s.key)}</span><b>${nf(x.n)}</b><small>${pct(x.n, n)}</small></div>`).join('')}
    </div>

    <div class="grid-2">
      ${rankCard('به تفکیک ماشین', 'truck', byMachine)}
      ${peopleCards.join('')}
    </div>

    <section class="card flush">
      <div class="card-head pad"><h3>${icon('list-checks')}فهرست بررسی‌ها</h3><span class="count">${nf(n)} مورد</span></div>
      ${n ? `<div class="table-wrap"><table class="table">
        <thead><tr><th>تاریخ</th><th>ماشین</th><th>موضوع / علت</th><th>راننده</th><th>مسئول PM</th><th>حساسیت</th><th>نتیجه</th><th>اقدام مدیریتی</th></tr></thead>
        <tbody>${rows}</tbody></table></div>` : emptyState('search-x', 'موردی در این دسته پیدا نشد', 'فیلترها را تغییر دهید یا دسته دیگری را انتخاب کنید.')}
    </section>`;

  return {
    title: esc(K.title),
    docTitle: K.title,
    sub: esc(dashFilterText()),
    crumbs: `<a href="#/dashboard">داشبورد</a>${icon('chevron-left')}<span>جزئیات</span>`,
    actions: `<button class="btn btn-ghost" data-csv ${n ? '' : 'disabled'}>${icon('file-spreadsheet')}خروجی اکسل</button><button class="btn btn-primary" data-print ${n ? '' : 'disabled'}>${icon('printer')}چاپ گزارش</button>`,
    html,
    mount(el) {
      const go = () => { location.hash = '#/insight/' + kind; App.rerender(); };
      el.querySelectorAll('select[name=driver],select[name=machine]').forEach(s => s.addEventListener('change', () => { DashState[s.name] = s.value; go(); }));
      el.querySelectorAll('[data-period]').forEach(b => b.addEventListener('click', () => { DashState.period = b.dataset.period; go(); }));
      const r = el.querySelector('[data-reset]'); if (r) r.addEventListener('click', () => { DashState.driver = ''; DashState.machine = ''; DashState.period = 'all'; go(); });
      el.querySelector('[data-print]').addEventListener('click', () => printAnalysesReport(list, K.title, dashFilterText()));
      el.querySelector('[data-csv]').addEventListener('click', () => exportAnalysesCSV(list));
      bindRowLinks(el);
    },
  };
};

function remainText(st, m, part) {
  const u = unitLabel(m);
  const km = st.remainKm, dy = st.remainDays;
  const iv = pIv(part, m) || 1;
  if (km !== null && km < 0 && !(dy !== null && dy < 0 && -dy / (part.mo * 30.44) > -km / iv)) return `${nf(-km)} ${u} گذشته`;
  if (dy !== null && dy < 0) return `${nf(-dy)} روز گذشته`;
  if (km !== null && dy !== null) return (km / iv) <= (dy / (part.mo * 30.44)) ? `${nf(km)} ${u} مانده` : `${nf(dy)} روز مانده`;
  if (km !== null) return `${nf(km)} ${u} مانده`;
  if (dy !== null) return `${nf(dy)} روز مانده`;
  return '';
}
function bindRowLinks(el) {
  el.querySelectorAll('tr[data-href]').forEach(tr => tr.addEventListener('click', e => {
    if (e.target.closest('a,button,input,select')) return;
    location.hash = tr.dataset.href;
  }));
}

const QTEXT = {
  q1: 'آیا علائم به صورتی بوده است که راننده متوجه آن شود؟',
  q1b: 'آیا راننده گزارش خرابی را به مسئول ماشین‌آلات ارائه داده است؟',
  q2: 'آیا علائم به صورتی بوده است که مسئول PM متوجه آن شود؟',
  q2b: 'آیا مسئول PM گزارش خرابی را به مسئول ماشین‌آلات ارائه داده است؟',

    .filter(a => (!ListState.result || Logic.resultOf(a) === ListState.result) && (!ListState.sev || a.severity === ListState.sev)
      && (!ListState.q || matches(`${a.topic} ${a.cause} ${Q.pname(a.driverId)} ${Q.pname(a.pmId)} ${(Q.machine(a.machineId) || {}).code}`, ListState.q)));

  const rows = list.map(a => {
    const m = Q.machine(a.machineId) || {};
    const acts = Logic.actionsFor(a);
    const r = Logic.resultOf(a);
    return `<tr class="row-link" data-href="#/analyses/${a.id}">
      <td class="nowrap">${toFa(a.date)}</td>
      <td><b class="mcode">${esc(m.code || '—')}</b></td>
      <td class="cell-topic"><b>${esc(a.topic || '—')}</b>${a.cause ? `<small>${esc(a.cause)}</small>` : ''}</td>
      <td>${esc(Q.pname(a.driverId))}</td>
      <td>${sevPill(a.severity)}</td>
      <td>${resultPill(r)}</td>
      <td class="acts-cell">${acts.driver ? `<div>${actionPill(acts.driver.action)}<small>راننده · بار ${nf(acts.driver.n)}</small></div>` : ''}${acts.pm ? `<div>${actionPill(acts.pm.action)}<small>PM · بار ${nf(acts.pm.n)}</small></div>` : ''}${!acts.driver && !acts.pm ? '<span class="muted">—</span>' : ''}</td>
    </tr>`;
  }).join('');

  const html = `
    <div class="filters card">
      <div class="field grow">${`<span class="field-label">جستجو</span><div class="input-ic">${icon('search')}<input class="input" name="q" placeholder="موضوع، علت، نام راننده…" value="${esc(ListState.q)}"></div>`}</div>
      ${F.field('ماشین', F.select('machine', [['', 'همه'], ...d.machines.map(m => [m.id, m.code])], ListState.machine))}
      ${F.field('نتیجه', F.select('result', [['', 'همه'], ...Object.values(RESULTS).map(r => [r.key, r.label])], ListState.result))}
      ${F.field('حساسیت', F.select('sev', [['', 'همه'], ...SEVERITIES.map(s => [s.key, s.label])], ListState.sev))}
      ${F.field('از تاریخ', F.date('from', ListState.from))}
      ${F.field('تا تاریخ', F.date('to', ListState.to))}
    </div>
    <section class="card flush">
      ${d.analyses.length ? (list.length ? `<div class="table-wrap"><table class="table">
        <thead><tr><th>تاریخ</th><th>ماشین</th><th>موضوع / علت</th><th>راننده</th><th>حساسیت</th><th>نتیجه</th><th>اقدام مدیریتی</th></tr></thead>
        <tbody>${rows}</tbody></table></div><div class="table-foot">${nf(list.length)} مورد از ${nf(d.analyses.length)} تحلیل</div>`
      : emptyState('search-x', 'موردی با این فیلترها پیدا نشد'))
      : emptyState('clipboard-list', 'هنوز تحلیلی ثبت نشده', 'هر خرابی را با پاسخ به چند سؤال تحلیل کنید؛ نتیجه و اقدام مدیریتی خودکار مشخص می‌شود.', `<a class="btn btn-primary" href="#/analyses/new">${icon('plus')}ثبت اولین تحلیل</a>`)}

  return {

    html,

function printAnalysesReport(list, title, filterText) {
  const cnt = { none: 0, driver: 0, pm: 0, both: 0 };
  list.forEach(a => cnt[Logic.resultOf(a)]++);
  const rows = list.map((a, i) => {
    const m = Q.machine(a.machineId) || {};
    const acts = Logic.actionsFor(a);
    const actTxt = [acts.driver ? `راننده: ${acts.driver.action} (بار ${toFa(acts.driver.n)})` : '', acts.pm ? `PM: ${acts.pm.action} (بار ${toFa(acts.pm.n)})` : ''].filter(Boolean).join('<br>');
    return `<tr>
      <td class="c">${toFa(i + 1)}</td>
      <td class="nw">${toFa(a.date)}</td>
      <td class="nw"><b>${esc(m.code || '')}</b></td>
      <td>${esc(a.topic || '')}${a.cause ? `<small>${esc(a.cause)}</small>` : ''}</td>
      <td>${esc(Q.pname(a.driverId))}</td>
      <td>${esc(Q.pname(a.pmId))}</td>
      <td class="nw">${a.severity ? esc(SEV[a.severity].label) : ''}</td>
      <td>${esc(RESULTS[Logic.resultOf(a)].label)}</td>
      <td>${actTxt || '—'}</td>
    </tr>`;
  }).join('');
  const html = `<div class="pr-doc">
    ${Printer.head('گزارش تحلیل خرابی‌ها — ' + title, esc(filterText || ''), `<span>تعداد: ${toFa(list.length)} مورد</span>`)}
    <div class="pr-sum"><div>بدون سهل‌انگاری<b>${toFa(cnt.none)}</b></div><div>سهل‌انگاری راننده<b>${toFa(cnt.driver)}</b></div><div>سهل‌انگاری PM<b>${toFa(cnt.pm)}</b></div><div>مشترک<b>${toFa(cnt.both)}</b></div></div>
    <table class="pr-table">
      <thead><tr><th class="c">ردیف</th><th>تاریخ</th><th>ماشین</th><th>موضوع / علت خرابی</th><th>راننده</th><th>مسئول PM</th><th>حساسیت</th><th>نتیجه بررسی</th><th>اقدام مدیریتی</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${Printer.signs(['تهیه‌کننده (مسئول ماشین‌آلات)', 'سرپرست', 'مدیریت'])}
    ${Printer.foot()}
  </div>`;

function exportAnalysesCSV(list) {
  const head = ['تاریخ', 'خودرو', 'پلاک', 'مدل', 'موضوع', 'علت', 'راننده', 'مسئول PM', QTEXT.q1, QTEXT.q1b, QTEXT.q2, QTEXT.q2b, QTEXT.q3, 'توضیحات تکمیلی', 'اثر نامطلوب', 'علت ریشه‌ای', 'راهکار', 'سطح حساسیت', 'نتیجه', 'اقدام راننده', 'اقدام PM'];
  const rows = list.map(a => {
    const m = Q.machine(a.machineId) || {};
    const acts = Logic.actionsFor(a);
    const g = a.goldratt || {};
    return [a.date, m.code, m.plate, Q.modelName(m.model), a.topic, a.cause, Q.pname(a.driverId), Q.pname(a.pmId),
      YN[a.q1] || '', YN[a.q1b] || '', YN[a.q2] || '', YN[a.q2b] || '', YN[a.q3] || '', a.q3note, g.ude, g.root, g.change,
      a.severity ? SEV[a.severity].label : '', RESULTS[Logic.resultOf(a)].label,
      acts.driver ? `${acts.driver.action} (بار ${acts.driver.n})` : '', acts.pm ? `${acts.pm.action} (بار ${acts.pm.n})` : ''];
  });
  downloadCSV(`تحلیل-خرابی-${J.today().replace(/\//g, '-')}.csv`, [head, ...rows]);
}
function downloadCSV(name, rows) {
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  downloadBlob(name, new Blob([csv], { type: 'text/csv;charset=utf-8' }));
}
function downloadBlob(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

   فرم مرحله‌ای تحلیل
   ============================================================ */
let Draft = null;
const STEPS = [
  { key: 'info', label: 'مشخصات خرابی', icon: 'file-text' },
  { key: 'driver', label: 'بررسی راننده', icon: 'user' },
  { key: 'pm', label: 'بررسی مسئول PM', icon: 'user-cog' },
  { key: 'pressure', label: 'فشار به دستگاه', icon: 'gauge' },
  { key: 'goldratt', label: 'تحلیل علت (گلدرات)', icon: 'git-fork' },
  { key: 'severity', label: 'سطح حساسیت', icon: 'signal' },
  { key: 'review', label: 'نتیجه و ثبت', icon: 'clipboard-check' },
];

function newDraft(machineId) {
  const m = machineId ? Q.machine(machineId) : null;
  return {
    id: null, step: 0, machineId: m ? m.id : '', date: J.today(), topic: '', cause: '',
    driverId: m ? m.driverId : '', pmId: m ? m.pmId : '', supervisorId: m ? m.supervisorId : '',
    driverName: m && m.driverId ? Q.pname(m.driverId) : '', repairId: null,
    q1: '', q1b: '', q2: '', q2b: '', q3: '', q3note: '', goldratt: { ude: '', root: '', change: '' },
    severity: '', note: '', createdAt: null, dirty: false,
  };
}

function stepValid(W, i) {
  switch (STEPS[i].key) {
    case 'info': { const mm = Q.machine(W.machineId); return !!(W.machineId && J.norm(W.date) && W.topic.trim() && (!mm || !mm.floating || (W.driverName || '').trim())); }
    case 'driver': return !!(W.q1 && (W.q1 === 'no' || W.q1b));
    case 'pm': return !!(W.q2 && (W.q2 === 'no' || W.q2b));
    case 'pressure': return !!W.q3;
    case 'goldratt': return true;
    case 'severity': return !!W.severity;
    default: return true;
  }
}
function stepMissing(W, i) {
  switch (STEPS[i].key) {
    case 'info': return !W.machineId ? 'ماشین را انتخاب کنید' : !J.norm(W.date) ? 'تاریخ معتبر وارد کنید' : !W.topic.trim() ? 'موضوع خرابی را بنویسید' : 'نام راننده را وارد کنید';
    case 'driver': return 'به سؤال‌های این مرحله پاسخ دهید';
    case 'pm': return 'به سؤال‌های این مرحله پاسخ دهید';
    case 'pressure': return 'به سؤال این مرحله پاسخ دهید';
    case 'severity': return 'سطح حساسیت را انتخاب کنید';
    default: return '';
  }
}

Pages.wizard = (editId, presetMachine, repairId) => {
  if (editId) {
    const a = Store.get().analyses.find(x => x.id === editId);
    if (!a) return { title: 'یافت نشد', html: emptyState('search-x', 'این تحلیل پیدا نشد') };
    if (!Draft || Draft.id !== editId) Draft = { ...clone(a), goldratt: { ude: '', root: '', change: '', ...(a.goldratt || {}) }, driverName: a.driverId ? Q.pname(a.driverId) : '', step: 0, dirty: false };
  } else if (repairId) {
    const rp = Q.repair(repairId);
    if (!rp) return { title: 'یافت نشد', html: emptyState('search-x', 'این خرابی پیدا نشد') };
    if (!Draft || Draft.id || Draft.repairId !== repairId) {
      Draft = newDraft(rp.machineId);
      Object.assign(Draft, { repairId: rp.id, date: J.norm(rp.referDate) || J.norm(rp.reportDate) || J.today(), topic: String(rp.type || '').replace(/\s+/g, ' ').trim(), cause: rp.repairerNote || '' });
    }
  } else if (!Draft || Draft.id || Draft.repairId) {
    Draft = newDraft(presetMachine);
  } else if (presetMachine && !Draft.dirty) {
    Draft = newDraft(presetMachine);
  }
  const W = Draft;
  const isEdit = !!W.id;

  return {
    title: isEdit ? 'ویرایش تحلیل خرابی' : 'ثبت تحلیل خرابی جدید',
    sub: W.repairId ? 'تحلیل خرابیِ اعلام‌شده؛ مشخصات خرابی از قبل پر شده است.' : 'فرم بررسی علائم؛ با پاسخ به سؤال‌ها، نتیجه و اقدام مدیریتی خودکار مشخص می‌شود.',
    crumbs: W.repairId ? `<a href="#/repairs">خرابی‌ها و تعمیرات</a>${icon('chevron-left')}<a href="#/repairs/${W.repairId}">خرابی</a>${icon('chevron-left')}<span>تحلیل</span>` : `<a href="#/analyses">تحلیل‌های خرابی</a>${icon('chevron-left')}<span>${isEdit ? 'ویرایش' : 'تحلیل جدید'}</span>`,
    actions: !isEdit && W.dirty ? `<button class="btn btn-ghost" data-discard>${icon('trash-2')}پاک کردن فرم</button>` : '',
    cls: 'page-wizard',
    html: `<div class="wizard" id="wizard"></div>`,
    mount(el) {
      const host = el.querySelector('#wizard');
      renderWizard(host);
      const dis = el.querySelector('[data-discard]');
      if (dis) dis.addEventListener('click', async () => {
        if (await Modal.confirm({ title: 'پاک کردن فرم', message: 'همه پاسخ‌های واردشده پاک شود؟', ok: 'پاک شود', danger: true })) { Draft = null; App.rerender(); }
      });
    },
  };
};

      </div>
    </aside>
    <section class="wz-main card">
      <div class="wz-head">
        <span class="wz-ic">${icon(STEPS[i].icon)}</span>
        <div><small>مرحله ${toFa(i + 1)} از ${toFa(STEPS.length)}</small><h2>${STEPS[i].label}</h2></div>
        <div class="wz-progress"><i style="width:${((i + 1) / STEPS.length) * 100}%"></i></div>
      </div>
      <div class="wz-body" id="wzBody">${body}</div>
      <div class="wz-foot">
        ${i > 0 ? `<button type="button" class="btn btn-ghost" data-prev>${icon('arrow-right')}مرحله قبل</button>` : '<span></span>'}
        <span class="wz-miss" id="wzMiss"></span>
        ${i < STEPS.length - 1 ? `<button type="button" class="btn btn-primary" data-next>مرحله بعد${icon('arrow-left')}</button>`
      : `<button type="button" class="btn btn-primary btn-lg" data-save>${icon('save')}${W.id ? 'ذخیره تغییرات' : 'ثبت نهایی تحلیل'}</button>`}
      </div>
    </section>`;

  /* رویدادها */
  const set = (k, v) => { W[k] = v; W.dirty = true; };
  host.querySelectorAll('[data-machine]').forEach(b => b.addEventListener('click', () => {
    const mm = Q.machine(b.dataset.machine);
    set('machineId', mm.id); W.driverId = mm.driverId; W.driverName = mm.driverId ? Q.pname(mm.driverId) : ''; W.pmId = mm.pmId; W.supervisorId = mm.supervisorId;
    renderWizard(host);
  }));
  host.querySelectorAll('[data-yn]').forEach(g => g.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
    const k = g.dataset.yn;
    set(k, b.dataset.v);
    if (k === 'q1' && b.dataset.v === 'no') W.q1b = '';
    if (k === 'q2' && b.dataset.v === 'no') W.q2b = '';
    if (k === 'q3' && b.dataset.v === 'no') W.q3note = '';
    renderWizard(host);
    // حرکت خودکار به مرحله بعد وقتی مرحله کامل شد
    const kk = STEPS[W.step].key;
    if (['driver', 'pm', 'pressure'].includes(kk) && stepValid(W, W.step) && !(kk === 'pressure' && W.q3 === 'yes')) {
      setTimeout(() => { if (Draft === W && STEPS[W.step].key === kk) { W.step++; renderWizard(host); } }, 420);
    }
  })));
  host.querySelectorAll('[data-sev]').forEach(b => b.addEventListener('click', () => { set('severity', b.dataset.sev); renderWizard(host); setTimeout(() => { if (Draft === W && STEPS[W.step].key === 'severity') { W.step++; renderWizard(host); } }, 380); }));
  host.querySelectorAll('input[name],textarea[name],select[name]').forEach(inp => {
    const h = () => {
      const n = inp.name, v = inp.value;
      if (n === 'date') set('date', toEn(v));
      else if (n.startsWith('g_')) { W.goldratt[n.slice(2)] = v; W.dirty = true; }
      else {
        set(n, v);
        if (n === 'driverName' && normText(v) !== normText(Q.pname(W.driverId))) W.driverId = '';
      }
      if (inp.tagName === 'SELECT') renderWizard(host);
    };
    inp.addEventListener(inp.tagName === 'SELECT' ? 'change' : 'input', h);
    if (inp.dataset.date !== undefined) inp.addEventListener('change', h);
  });
  host.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', async () => {
    const k = +b.dataset.goto;
    for (let s = 0; s < k; s++) if (!stepValid(W, s)) { W.step = s; renderWizard(host); flashMiss(stepMissing(W, s)); return; }
    if (key === 'info' && k > 0 && !(await ensureDriver(W))) return;
    W.step = k; renderWizard(host);
  }));
  const next = host.querySelector('[data-next]');
  if (next) next.addEventListener('click', async () => {
    if (!stepValid(W, i)) { flashMiss(stepMissing(W, i)); return; }
    if (key === 'info' && !(await ensureDriver(W))) return;
    W.step++; renderWizard(host); host.scrollIntoView({ block: 'start', behavior: 'smooth' });
  });
  const prev = host.querySelector('[data-prev]');
  if (prev) prev.addEventListener('click', () => { W.step--; renderWizard(host); });
  const save = host.querySelector('[data-save]');
  if (save) save.addEventListener('click', () => saveDraft());
}

function flashMiss(msg) {
  const el = $('#wzMiss');
  if (!el) return;
  el.innerHTML = `${icon('circle-alert')}${esc(msg)}`;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
}

function reviewBlock(W) {
  const m = Q.machine(W.machineId) || {};
  const r = Logic.resultOf(W);
  const acts = Logic.actionsFor({ ...W, createdAt: W.createdAt || new Date().toISOString() });
  const g = W.goldratt || {};
  return `
    <div class="review">
      <div class="rv-result rv-${r}">
        <div class="rv-ic">${icon(r === 'none' ? 'shield-check' : 'triangle-alert')}</div>
        <div><small>نتیجه فرم تحلیل</small><h3>${RESULTS[r].label}</h3></div>
        ${sevPill(W.severity)}
      </div>
      ${acts.driver || acts.pm ? `<div class="rv-acts">
        ${acts.driver ? actCard('راننده', W.driverId, acts.driver, W.severity) : ''}
        ${acts.pm ? actCard('مسئول PM', W.pmId, acts.pm, W.severity) : ''}
      </div>` : `<div class="flag flag-ok">${icon('circle-check')}<span>برای این خرابی اقدام مدیریتی لازم نیست.</span></div>`}
      <dl class="rv-grid">

        <div><dt>راننده</dt><dd>${esc(Q.pname(W.driverId))}</dd></div>
        <div><dt>مسئول PM</dt><dd>${esc(Q.pname(W.pmId))}</dd></div>
        <div class="span2"><dt>موضوع</dt><dd>${esc(W.topic || '—')}</dd></div>
        ${W.cause ? `<div class="span2"><dt>علت</dt><dd>${esc(W.cause)}</dd></div>` : ''}
      </dl>
      <table class="qa">
        <tr><th>۱</th><td>${QTEXT.q1}</td><td>${ynTag(W.q1)}</td></tr>
        ${W.q1 === 'yes' ? `<tr class="sub"><th></th><td>${QTEXT.q1b}</td><td>${ynTag(W.q1b, true)}</td></tr>` : ''}
        <tr><th>۲</th><td>${QTEXT.q2}</td><td>${ynTag(W.q2)}</td></tr>
        ${W.q2 === 'yes' ? `<tr class="sub"><th></th><td>${QTEXT.q2b}</td><td>${ynTag(W.q2b, true)}</td></tr>` : ''}
        <tr><th>۳</th><td>${QTEXT.q3}${W.q3 === 'yes' && W.q3note ? `<div class="qa-note">${esc(W.q3note)}</div>` : ''}</td><td>${ynTag(W.q3)}</td></tr>
        <tr><th>۴</th><td>${QTEXT.q4}${g.ude || g.root || g.change ? `<div class="qa-note">${g.ude ? `<p><b>اثر نامطلوب:</b> ${esc(g.ude)}</p>` : ''}${g.root ? `<p><b>علت ریشه‌ای:</b> ${esc(g.root)}</p>` : ''}${g.change ? `<p><b>راهکار:</b> ${esc(g.change)}</p>` : ''}</div>` : ''}</td><td>${g.ude || g.root || g.change ? '<span class="yn-tag">ثبت شده</span>' : '<span class="muted">—</span>'}</td></tr>
        <tr><th>۵</th><td>${QTEXT.q5}</td><td>${sevPill(W.severity)}</td></tr>
      </table>
    </div>`;
}
function ynTag(v, invertBad = false) {
  if (!v) return '<span class="muted">—</span>';
  const bad = invertBad ? v === 'no' : false;
  return `<span class="yn-tag ${bad ? 'bad' : v}">${YN[v]}</span>`;
}
function actCard(role, pid, a, sev) {
  return `<div class="act-card tone-${Logic.actionTone(a.action)}">
    ${avatar(Q.pname(pid))}
    <div class="ac-main"><small>${role}</small><b>${esc(Q.pname(pid))}</b>
      <span>${ordinal(a.n)} مورد سهل‌انگاری «${esc(SEV[sev].label)}»</span></div>
    <div class="ac-act"><small>اقدام مدیریتی</small>${actionPill(a.action)}</div>
  </div>`;
}

/* نام راننده تایپ‌شده را به یک فرد در فهرست رانندگان تبدیل می‌کند */
async function ensureDriver(W) {
  const nm = String(W.driverName || '').trim();
  if (!nm) { W.driverId = ''; return true; }
  if (W.driverId && normText(Q.pname(W.driverId)) === normText(nm)) return true;
  const id = await resolveDriverId(nm);
  if (id === null) return false;
  W.driverId = id; W.driverName = Q.pname(id);
  return true;
}

async function saveDraft() {
  const W = Draft;
  for (let s = 0; s < STEPS.length; s++) if (!stepValid(W, s)) { W.step = s; App.rerender(); setTimeout(() => flashMiss(stepMissing(W, s)), 50); return; }
  if (!(await ensureDriver(W))) return;
  const rec = {
    id: W.id || uid('a'), machineId: W.machineId, date: J.norm(W.date), topic: W.topic.trim(), cause: W.cause.trim(),
    driverId: W.driverId, pmId: W.pmId, supervisorId: W.supervisorId,
    q1: W.q1, q1b: W.q1 === 'yes' ? W.q1b : '', q2: W.q2, q2b: W.q2 === 'yes' ? W.q2b : '', q3: W.q3, q3note: W.q3 === 'yes' ? W.q3note.trim() : '',
    goldratt: { ude: W.goldratt.ude.trim(), root: W.goldratt.root.trim(), change: W.goldratt.change.trim() },
    severity: W.severity, note: W.note || '', repairId: W.repairId || null,
    createdAt: W.createdAt || new Date().toISOString(), updatedAt: new Date().toISOString(),
  };
  const isEdit = !!W.id;
  App.hold = true;
  Store.update(d => {
    const i = d.analyses.findIndex(x => x.id === rec.id);
    if (i >= 0) d.analyses[i] = rec; else d.analyses.push(rec);
    if (rec.repairId) { const rp = d.repairs.find(x => x.id === rec.repairId); if (rp) rp.analysisId = rec.id; }
  });
  App.hold = false;
  Draft = null;
  Toast.show(isEdit ? 'تغییرات ذخیره شد' : 'تحلیل با موفقیت ثبت شد');
  location.hash = `#/analyses/${rec.id}`;
}

Pages.people = () => {
  const d = Store.get();
  const roles = [['driver', 'رانندگان'], ['pm', 'مسئولین PM'], ['supervisor', 'سرپرستان']];
  const machinesOf = (pid) => d.machines.filter(m => m.driverId === pid || m.pmId === pid || m.supervisorId === pid);

  const card = (p) => {
    const role = p.role === 'pm' ? 'pm' : 'driver';
    const sum = (p.role === 'driver' || p.role === 'pm') ? Logic.personSummary(p.id, role) : null;
    const ms = machinesOf(p.id);
    const worst = sum ? sum.rows.filter(r => r.n).sort((a, b) => ({ crit: 0, serious: 1, warn: 2 }[Logic.actionTone(a.action)] - { crit: 0, serious: 1, warn: 2 }[Logic.actionTone(b.action)]))[0] : null;
    return `<a class="person-card ${p.active === false ? 'inactive' : ''}" href="#/people/${p.id}">
      <div class="pc-top">${avatar(p.name, 'lg')}<div><b>${esc(p.name)}</b><small>${roleLabel(p.role)}${p.active === false ? ' · غیرفعال' : ''}</small></div></div>
      ${sum ? `<div class="pc-sev">${sum.rows.map(r => `<div class="pcs pcs-${r.sev}"><span>${r.label}</span><b>${nf(r.n)}</b></div>`).join('')}</div>
      <div class="pc-foot">${worst ? actionPill(worst.action) : `<span class="st st-good">${icon('circle-check')}بدون سهل‌انگاری</span>`}
        <span class="pc-ms">${ms.map(m => `<i>${esc(m.code)}</i>`).join('')}</span></div>`
        : `<div class="pc-foot"><span class="muted small">سرپرست ${nf(ms.length)} خودرو</span></div>`}

    crumbs: `<a href="#/people">اقدامات مدیریتی</a>${icon('chevron-left')}<span>${esc(p.name)}</span>`,
    actions: `<button class="btn btn-ghost" data-del>${icon('trash-2')}حذف</button><button class="btn btn-primary" data-edit>${icon('pencil')}ویرایش</button>`,
    html,
    mount(el) {
      el.querySelector('[data-edit]').addEventListener('click', () => personModal(p));
      el.querySelector('[data-del]').addEventListener('click', async () => {
        const used = d.analyses.some(a => a.driverId === id || a.pmId === id) || d.machines.some(m => m.driverId === id || m.pmId === id || m.supervisorId === id);
        if (used) {
          if (!await Modal.confirm({ title: 'غیرفعال کردن', message: 'این فرد در سوابق یا خودروها استفاده شده و حذف نمی‌شود تا سوابق از بین نرود. به‌جای حذف، غیرفعال شود؟', ok: 'غیرفعال شود' })) return;
          Store.update(dd => { dd.people.find(x => x.id === id).active = false; });
          Toast.show('فرد غیرفعال شد'); return;
        }
        if (!await Modal.confirm({ title: 'حذف فرد', message: `«${esc(p.name)}» حذف شود؟`, ok: 'حذف', danger: true })) return;
        App.hold = true; Store.update(dd => { dd.people = dd.people.filter(x => x.id !== id); }); App.hold = false;
        location.hash = '#/people';
      });
    },
  };
};

function personModal(p) {
  const isNew = !p;
  p = p || { name: '', role: 'driver', phone: '', note: '', active: true };
  Modal.open({
    title: isNew ? 'افزودن فرد' : 'ویرایش اطلاعات فرد', icon: 'user',
    body: `<form class="form-grid" id="pf">
      ${F.field('نام و نام خانوادگی', F.input('name', p.name, 'required'), { req: true, cls: 'span2' })}
      ${F.field('سمت', F.select('role', [['driver', 'راننده'], ['pm', 'مسئول PM'], ['supervisor', 'سرپرست'], ['other', 'سایر']], p.role))}
      ${F.field('تلفن', F.input('phone', p.phone, 'dir="ltr" inputmode="tel"'))}
      ${F.field('توضیحات', F.textarea('note', p.note, 'rows="2"'), { cls: 'span2' })}
      <label class="check span2"><input type="checkbox" name="active" ${p.active !== false ? 'checked' : ''}><span>فعال</span></label>
    </form>`,
    footer: `${!isNew ? `<button class="btn btn-ghost danger-text" data-delp>${icon('trash-2')}حذف</button><span class="grow"></span>` : ''}<button class="btn btn-ghost" data-close>انصراف</button><button class="btn btn-primary" data-save>${icon('save')}ذخیره</button>`,
    onMount(el, api) {
      const dp = el.querySelector('[data-delp]');
      if (dp) dp.addEventListener('click', async () => {
        const d = Store.get(); const id = p.id;
        const used = d.analyses.some(a => a.driverId === id || a.pmId === id) || d.machines.some(m => m.driverId === id || m.pmId === id || m.supervisorId === id);
        api.close();
        if (used) {
          if (!await Modal.confirm({ title: 'غیرفعال کردن', message: 'این فرد در سوابق یا ماشین‌ها استفاده شده و حذف نمی‌شود تا سوابق از بین نرود. به‌جای حذف، غیرفعال شود؟', ok: 'غیرفعال شود' })) return;
          Store.update(dd => { dd.people.find(x => x.id === id).active = false; }); Toast.show('فرد غیرفعال شد'); return;
        }
        if (!await Modal.confirm({ title: 'حذف فرد', message: `«${esc(p.name)}» حذف شود؟`, ok: 'حذف', danger: true })) return;
        Store.update(dd => { dd.people = dd.people.filter(x => x.id !== id); });
      });
      el.querySelector('[data-save]').addEventListener('click', () => {
        const v = F.read(el.querySelector('#pf'));
        if (!v.name.trim()) { Toast.show('نام را وارد کنید', 'warn'); return; }
        Store.update(d => {
          if (isNew) d.people.push({ id: uid('p'), name: v.name.trim(), role: v.role, phone: v.phone, note: v.note, active: v.active });
          else Object.assign(d.people.find(x => x.id === p.id), { name: v.name.trim(), role: v.role, phone: v.phone, note: v.note, active: v.active });
        });
        api.close(); Toast.show('ذخیره شد');
      });
    },
  });
}

function odoModal(m) {
  Modal.open({
    title: `ثبت کارکرد ${m.code}`, icon: 'gauge', size: 'sm',
    body: `<form class="form-grid cols-1" id="of">
      ${F.field(`کارکرد فعلی (${unitLabel(m)})`, F.num('value', m.odometer, 'autofocus'), { req: true })}
      ${F.field('تاریخ', F.date('date', J.today()))}
    </form>`,
    footer: `<button class="btn btn-ghost" data-close>انصراف</button><button class="btn btn-primary" data-save>${icon('save')}ثبت</button>`,
    onMount(el, api) {
      const go = () => {
        const v = F.read(el.querySelector('#of'));
        const val = num(v.value), date = J.norm(v.date) || J.today();
        if (val === null || val < 0) { Toast.show('عدد معتبر وارد کنید', 'warn'); return; }
        const doit = () => {
          Store.update(d => {
            const mm = d.machines.find(x => x.id === m.id);
            mm.odometer = val; mm.odoDate = date;
            d.odoLogs.push({ id: uid('o'), machineId: m.id, value: val, date });
          });
          api.close(); Toast.show('کارکرد ثبت شد');
        };
        if (m.odometer !== null && m.odometer !== undefined && val < m.odometer) {
          Modal.confirm({ title: 'کارکرد کمتر از قبل', message: `عدد واردشده (${nf(val)}) از کارکرد قبلی (${nf(m.odometer)}) کمتر است. اگر کیلومترشمار عوض شده، ادامه دهید.`, ok: 'ثبت شود' }).then(ok => ok && doit());
        } else doit();
      };
      el.querySelector('[data-save]').addEventListener('click', go);
      el.querySelector('#of').addEventListener('submit', e => { e.preventDefault(); go(); });
    },
  });
}

function machineModal(m) {

        </div>
      </div>
      ${F.field('راننده', F.select('driverId', [['', '—'], ['__floating', 'راننده ثابت ندارد (متغیر)'], ...d.people.filter(p => p.role === 'driver').map(p => [p.id, p.name])], m.floating ? '__floating' : m.driverId), { hint: 'برای لودر و تراکتور که راننده ثابت ندارند، «متغیر» را انتخاب کنید' })}
      ${F.field('مسئول PM', F.select('pmId', ppl('pm'), m.pmId))}
      ${F.field('سرپرست', F.select('supervisorId', ppl('supervisor'), m.supervisorId))}

    footer: `${!isNew ? `<button class="btn btn-ghost danger-text" data-del>${icon('trash-2')}حذف</button><span class="grow"></span>` : ''}<button class="btn btn-ghost" data-close>انصراف</button><button class="btn btn-primary" data-save>${icon('save')}ذخیره</button>`,

        const v = F.read(f);
        if (!v.code.trim()) { Toast.show('نام ماشین را وارد کنید', 'warn'); return; }
        let modelId = v.model;
        Store.update(dd => {
          if (modelId === '__new') {
            const name = v.newModelName.trim() || v.code.trim();
            modelId = 'M' + Date.now().toString(36).toUpperCase();
            dd.models.push({ id: modelId, name, brand: '' });
            if (v.copyFrom.startsWith('copy:')) dd.catalog[modelId] = dd.catalog[v.copyFrom.slice(5)].map((p, i) => ({ ...clone(p), id: `${modelId}-${p.sys}-${i}-${Math.random().toString(36).slice(2, 5)}`, alts: clone(p.alts || []) }));
            else dd.catalog[modelId] = [];
          }
          const data = { code: v.code.trim(), type: v.type.trim(), plate: toEn(v.plate.trim()).replace(/\s+/g, ''), model: modelId, driverId: v.driverId === '__floating' ? '' : v.driverId, floating: v.driverId === '__floating', pmId: v.pmId, supervisorId: v.supervisorId, unit: v.unit, note: v.note, active: v.active };
          if (isNew) dd.machines.push({ id: uid('m'), odometer: null, odoDate: null, ...data });
          else Object.assign(dd.machines.find(x => x.id === m.id), data);

        api.close(); Toast.show('ذخیره شد');
      });
      const del = el.querySelector('[data-del]');
      if (del) del.addEventListener('click', async () => {
        const used = d.analyses.some(a => a.machineId === m.id) || d.repairs.some(r => r.machineId === m.id);
        if (used) { Toast.show('این ماشین تحلیل یا خرابی ثبت‌شده دارد؛ به‌جای حذف، تیک «فعال» را بردارید', 'warn', 5000); return; }
        if (!await Modal.confirm({ title: 'حذف ماشین', message: `«${esc(m.code)}» و سوابق تعویض قطعاتش حذف شود؟`, ok: 'حذف', danger: true })) return;
        api.close();
        App.hold = true;
        Store.update(dd => { dd.machines = dd.machines.filter(x => x.id !== m.id); dd.partLogs = dd.partLogs.filter(l => l.machineId !== m.id); dd.odoLogs = dd.odoLogs.filter(l => l.machineId !== m.id); });
        App.hold = false;
        if (/^#\/machines\//.test(location.hash)) location.hash = '#/machines'; else App.rerender();
      });
    },
  });
}

/* ============================================================
   نگهداری پیشگیرانه (عمر قطعات و موعد تعویض)
   ============================================================ */
const MaintState = { q: '', filter: 'all', sys: '', collapsed: {} };

function intervalText(p, m) {
  const a = [];
  if (m) { const iv = pIv(p, m); if (iv > 0) a.push(`${nf(iv)} ${m.unit === 'hour' ? 'ساعت کار' : 'کیلومتر'}`); }
  else { if (p.km > 0) a.push(`${nf(p.km)} کیلومتر`); if (p.hr > 0) a.push(`${nf(p.hr)} ساعت کار`); }
  if (p.mo > 0) a.push(`${nf(p.mo)} ماه`);
  return a.length ? a.join(' یا ') : '<span class="muted">طبق بازدید</span>';
}

Pages.maint = (id) => {
  const d = Store.get();
  const active = d.machines.filter(m => m.active !== false);
  if (!id) {
    const cards = active.map(m => {
      const s = Maint.machineSummary(m);
      const tracked = s.over + s.soon + s.ok;
      const healthy = tracked ? s.ok / tracked : 0;
      return `<a class="maint-pick" href="#/maint/${m.id}">
        <div class="mpk-ring">${Charts.ring(tracked ? healthy : 0, s.over ? 'var(--crit)' : s.soon ? 'var(--warn)' : 'var(--good)', 56, 6)}<span>${tracked ? pct(s.ok, tracked, 0) : '—'}</span></div>
        <div class="mpk-main"><b>${esc(m.code)}</b><small>${esc(Q.modelName(m.model))} · ${m.odometer !== null && m.odometer !== undefined ? nf(m.odometer) + ' ' + unitLabel(m) : 'کارکرد ثبت نشده'}</small>
          <div class="mpk-tags">
            ${s.over ? `<span class="st st-crit">${icon('octagon-alert')}${nf(s.over)} گذشته</span>` : ''}
            ${s.soon ? `<span class="st st-warn">${icon('triangle-alert')}${nf(s.soon)} نزدیک</span>` : ''}
            ${!tracked ? `<span class="st st-muted">${icon('circle-dashed')}هنوز راه‌اندازی نشده</span>` : (!s.over && !s.soon ? `<span class="st st-good">${icon('circle-check')}همه سالم</span>` : '')}
          </div></div>
        ${icon('chevron-left', 'mpk-go')}
      </a>`;
    }).join('');
    return {
      title: 'نگهداری پیشگیرانه',
      sub: 'ماشین را انتخاب کنید تا همه قطعاتش همراه با دوره تعویض و وضعیت فعلی نمایش داده شود.',
      html: `
        <div class="howto card">
          <div class="howto-step"><span>۱</span><div><b>کارکرد فعلی را ثبت کنید</b><small>کیلومتر یا ساعت کار فعلی ماشین</small></div></div>
          <div class="howto-step"><span>۲</span><div><b>آخرین تعویض هر قطعه را وارد کنید</b><small>یا یک‌جا برای همه با «ثبت سرویس اولیه»</small></div></div>
          <div class="howto-step"><span>۳</span><div><b>سایت خودش موعد را حساب می‌کند</b><small>زرد: نزدیک موعد · قرمز: گذشته از موعد</small></div></div>
        </div>
        <div class="maint-grid">${cards}</div>`,
    };
  }

  const m = Q.machine(id);
  if (!m) return { title: 'یافت نشد', html: emptyState('search-x', 'این ماشین پیدا نشد') };
  const parts = d.catalog[m.model] || [];
  const sts = new Map(parts.map(p => [p.id, Maint.status(m, p)]));
  const cnt = { all: parts.length, over: 0, soon: 0, ok: 0, none: 0, na: 0 };
  sts.forEach(s => cnt[s.state]++);
  const shown = parts.filter(p => {
    const s = sts.get(p.id);
    if (MaintState.filter === 'interval' && !s.hasInterval) return false;
    if (!['all', 'interval'].includes(MaintState.filter) && s.state !== MaintState.filter) return false;
    if (MaintState.sys && p.sys !== MaintState.sys) return false;
    if (MaintState.q && !matches(`${p.name} ${p.note}`, MaintState.q)) return false;
    return true;
  });
  const bySys = SYSTEMS.map(sys => ({ sys, list: shown.filter(p => p.sys === sys.key) })).filter(g => g.list.length);
  const hasOdo = m.odometer !== null && m.odometer !== undefined;
  const u = unitLabel(m);

  const row = (p) => {
    const s = sts.get(p.id);
    const last = s.last;
    let remain = '<span class="muted">—</span>';
    if (s.state !== 'na' && s.state !== 'none') {
      const parts2 = [];
      if (s.remainKm !== null) parts2.push(s.remainKm < 0 ? `<b class="neg">${nf(-s.remainKm)}</b> ${u} گذشته` : `<b>${nf(s.remainKm)}</b> ${u} مانده`);
      else if (pIv(p, m) > 0 && !hasOdo) parts2.push('<span class="muted">کارکرد ثبت نشده</span>');
      if (s.remainDays !== null) parts2.push(s.remainDays < 0 ? `<b class="neg">${nf(-s.remainDays)}</b> روز گذشته` : `<b>${nf(s.remainDays)}</b> روز مانده`);
      const w = Math.min(100, (s.usedPct || 0) * 100);
      remain = `<div class="remain"><div class="remain-t">${parts2.join('<i>·</i>')}</div><div class="bar bar-${s.state}"><i style="width:${w}%"></i></div></div>`;
    }
    const next = [s.nextKm !== null ? `${nf(s.nextKm)}` : '', s.nextDate ? toFa(s.nextDate) : ''].filter(Boolean).join(' · ');
    return `<tr class="st-row st-row-${s.state}">
      <td class="part-cell c-part"><b>${esc(p.name)}</b>${p.note ? `<small>${esc(p.note)}</small>` : ''}</td>
      <td class="c-act">${actTag(p.act)}</td>
      <td class="nowrap c-int" data-label="دوره">${intervalText(p, m)}</td>
      <td class="nowrap c-last" data-label="آخرین تعویض">${last ? `<span class="last"><b>${last.km !== null && last.km !== undefined ? nf(last.km) : '—'}</b><small>${toFa(last.date || '')}</small></span>` : '<span class="muted">—</span>'}</td>
      <td class="nowrap c-next" data-label="موعد بعدی">${next || '<span class="muted">—</span>'}</td>
      <td class="c-rem">${remain}</td>
      <td class="c-cons cons-cell" data-label="تبعات">${p.cons ? `<button type="button" class="cons-txt" data-cons="${p.id}" title="${esc(p.cons)}">${esc(p.cons)}</button>` : `<button type="button" class="cons-add" data-editpart="${p.id}" title="نوشتن تبعات انجام ندادن به‌موقع">${icon('plus')}نوشتن تبعات</button>`}</td>
      <td class="c-st">${statusPill(s.state)}</td>
      <td class="c-ops"><div class="row-actions">
        <button class="btn btn-sm ${s.state === 'over' || s.state === 'soon' ? 'btn-primary' : 'btn-soft'}" data-log="${p.id}" title="ثبت تعویض / سرویس">${icon('wrench')}<span>ثبت</span></button>
        <button class="icon-btn sm" data-hist="${p.id}" title="سوابق">${icon('history')}</button>
        <button class="icon-btn sm" data-editpart="${p.id}" title="ویرایش قطعه">${icon('pencil')}</button>
      </div></td>
    </tr>`;
  };

  const filters = [['all', 'همه', cnt.all], ['over', 'گذشته از موعد', cnt.over], ['soon', 'نزدیک موعد', cnt.soon], ['ok', 'سالم', cnt.ok], ['none', 'ثبت نشده', cnt.none], ['interval', 'فقط قطعات دوره‌ای', cnt.all - cnt.na]];

  const html = `
    <div class="machine-tabs">${active.map(x => `<a class="mtab ${x.id === m.id ? 'on' : ''}" href="#/maint/${x.id}">${esc(x.code)}${(() => { const s = Maint.machineSummary(x); return s.over ? `<i class="dot crit"></i>` : s.soon ? `<i class="dot warn"></i>` : ''; })()}</a>`).join('')}</div>

    <div class="maint-top">
      <section class="card odo-hero">
        <div class="oh-ic">${icon('gauge')}</div>
        <div class="oh-main"><small>کارکرد فعلی ${esc(m.code)}</small>
          <b>${hasOdo ? nf(m.odometer) : 'ثبت نشده'}</b><span>${hasOdo ? u + (m.odoDate ? ' · ' + toFa(m.odoDate) : '') : 'برای محاسبه موعد، کارکرد را ثبت کنید'}</span></div>
        <button class="btn ${hasOdo ? 'btn-ghost' : 'btn-primary'}" data-odo>${icon('pencil')}${hasOdo ? 'به‌روزرسانی' : 'ثبت کارکرد'}</button>
      </section>
      <div class="sum-tiles">
        <button class="sum-tile crit ${MaintState.filter === 'over' ? 'on' : ''}" data-f="over"><b>${nf(cnt.over)}</b><span>${icon('octagon-alert')}گذشته از موعد</span></button>
        <button class="sum-tile warn ${MaintState.filter === 'soon' ? 'on' : ''}" data-f="soon"><b>${nf(cnt.soon)}</b><span>${icon('triangle-alert')}نزدیک موعد</span></button>
        <button class="sum-tile good ${MaintState.filter === 'ok' ? 'on' : ''}" data-f="ok"><b>${nf(cnt.ok)}</b><span>${icon('circle-check')}سالم</span></button>
        <button class="sum-tile muted ${MaintState.filter === 'none' ? 'on' : ''}" data-f="none"><b>${nf(cnt.none)}</b><span>${icon('circle-dashed')}ثبت نشده</span></button>
      </div>
    </div>

    ${cnt.none > 0 && cnt.ok + cnt.over + cnt.soon === 0 && parts.length ? `<div class="notice notice-info">${icon('info')}<span>هنوز آخرین تعویض هیچ قطعه‌ای ثبت نشده است. اگر ماشین به‌تازگی سرویس کامل شده، با دکمه «ثبت سرویس اولیه» می‌توانید همه قطعات دوره‌ای را یک‌جا ثبت کنید.</span><button class="btn btn-sm btn-primary" data-bulk>${icon('list-checks')}ثبت سرویس اولیه</button></div>` : ''}

    <div class="toolbar card">
      <div class="input-ic grow">${icon('search')}<input class="input" name="q" placeholder="جستجوی قطعه… (مثلاً لوله رادیات)" value="${esc(MaintState.q)}"></div>
      ${F.select('sys', [['', 'همه سیستم‌ها'], ...SYSTEMS.map(s => [s.key, s.name])], MaintState.sys)}
      <div class="seg seg-wrap">${filters.map(([k, l, c]) => `<button class="${MaintState.filter === k ? 'on' : ''}" data-f="${k}">${l}<i>${nf(c)}</i></button>`).join('')}</div>
    </div>

    ${bySys.length ? bySys.map(g => `
      <section class="card flush sys-block ${MaintState.collapsed[g.sys.key] ? 'collapsed' : ''}">
        <button class="sys-head" data-coll="${g.sys.key}">
          <span class="sys-ic">${icon(g.sys.icon)}</span><h3>${g.sys.name}</h3><span class="count">${nf(g.list.length)} قطعه</span>
          ${(() => { const o = g.list.filter(p => sts.get(p.id).state === 'over').length, s2 = g.list.filter(p => sts.get(p.id).state === 'soon').length; return (o ? `<span class="st st-crit">${icon('octagon-alert')}${nf(o)}</span>` : '') + (s2 ? `<span class="st st-warn">${icon('triangle-alert')}${nf(s2)}</span>` : ''); })()}
          <span class="grow"></span>${icon('chevron-down', 'chev')}
        </button>
        <div class="table-wrap"><table class="table maint-table">
          <thead><tr><th>قطعه</th><th>اقدام</th><th>دوره</th><th>آخرین تعویض</th><th>موعد بعدی</th><th>باقیمانده</th><th>تبعات</th><th>وضعیت</th><th></th></tr></thead>
          <tbody>${g.list.map(row).join('')}</tbody>
        </table></div>
      </section>`).join('') : `<section class="card">${parts.length ? emptyState('search-x', 'قطعه‌ای با این فیلترها پیدا نشد') : emptyState('package', `هنوز قطعه‌ای برای مدل «${esc(Q.modelName(m.model))}» تعریف نشده`, 'با «افزودن قطعه» نام قطعه، نوع اقدام (تعویض، بازدید، سرویس، تنظیم، مصرفی) و دوره کیلومتری / ساعتی / ماهانه را وارد کنید.', `<button class="btn btn-primary" data-addfirst>${icon('plus')}افزودن اولین قطعه</button>`)}</section>`}
  `;

  return {
    title: `نگهداری پیشگیرانه <span class="sep">·</span> <bdi>${esc(m.code)}</bdi>`,
    docTitle: 'نگهداری ' + m.code,
    sub: meta(esc(Q.modelName(m.model)), `${nf(parts.length)} قطعه در ${nf(new Set(parts.map(p => p.sys)).size)} سیستم`, `دوره کارکرد: ${m.unit === 'hour' ? 'ساعتی' : 'کیلومتری'}`),
    crumbs: `<a href="#/maint">نگهداری پیشگیرانه</a>${icon('chevron-left')}<span>${esc(m.code)}</span>`,
    actions: `<button class="btn btn-ghost" data-csv>${icon('file-spreadsheet')}خروجی</button>${parts.length ? `<button class="btn btn-ghost" data-bulkdel>${icon('trash-2')}حذف قطعه‌ها</button><button class="btn btn-ghost" data-bulk>${icon('list-checks')}ثبت سرویس اولیه</button>` : ''}<button class="btn btn-primary" data-addpart>${icon('plus')}افزودن قطعه</button>`,
    html,
    mount(el) {
      const bd = el.querySelector('[data-bulkdel]'); if (bd) bd.addEventListener('click', () => bulkDeletePartsModal(m.model));
      el.querySelectorAll('[data-addfirst]').forEach(b => b.addEventListener('click', () => partModal(m.model, null)));
      el.querySelector('[data-odo]').addEventListener('click', () => odoModal(m));
      el.querySelectorAll('[data-bulk]').forEach(b => b.addEventListener('click', () => bulkModal(m)));
      el.querySelector('[data-addpart]').addEventListener('click', () => partModal(m.model, null));
      el.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => { MaintState.filter = MaintState.filter === b.dataset.f && b.classList.contains('sum-tile') ? 'all' : b.dataset.f; App.rerender(); }));
      const q = el.querySelector('input[name=q]');
      q.addEventListener('input', debounce(() => { MaintState.q = q.value; App.rerender(); const n = $('input[name=q]'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 280));
      el.querySelector('select[name=sys]').addEventListener('change', e => { MaintState.sys = e.target.value; App.rerender(); });
      el.querySelectorAll('[data-coll]').forEach(b => b.addEventListener('click', () => { const k = b.dataset.coll; MaintState.collapsed[k] = !MaintState.collapsed[k]; b.closest('.sys-block').classList.toggle('collapsed'); }));
      el.querySelectorAll('[data-log]').forEach(b => b.addEventListener('click', () => logModal(m, Q.part(m.model, b.dataset.log))));
      el.querySelectorAll('[data-hist]').forEach(b => b.addEventListener('click', () => histModal(m, Q.part(m.model, b.dataset.hist))));
      el.querySelectorAll('[data-editpart]').forEach(b => b.addEventListener('click', () => partModal(m.model, Q.part(m.model, b.dataset.editpart), { focusCons: b.classList.contains('cons-add') })));
      el.querySelectorAll('[data-cons]').forEach(b => b.addEventListener('click', () => consModal(m, Q.part(m.model, b.dataset.cons))));
      el.querySelector('[data-csv]').addEventListener('click', () => {
        const rows = [['سیستم', 'قطعه', 'اقدام', 'دوره کیلومتری', 'دوره ساعتی', 'دوره ماه', 'آخرین تعویض (کارکرد)', 'آخرین تعویض (تاریخ)', 'موعد بعدی (کارکرد)', 'موعد بعدی (تاریخ)', 'باقیمانده کارکرد', 'باقیمانده روز', 'وضعیت', 'توضیح', 'تبعات']];
        const stl = { over: 'گذشته از موعد', soon: 'نزدیک موعد', ok: 'سالم', none: 'ثبت نشده', na: 'طبق بازدید' };
        parts.forEach(p => { const s = sts.get(p.id); rows.push([Q.sys(p.sys).name, p.name, (ACT_TYPES[p.act] || ACT_TYPES.i).label, p.km || '', p.hr || '', p.mo || '', s.last ? s.last.km : '', s.last ? s.last.date : '', s.nextKm ?? '', s.nextDate || '', s.remainKm ?? '', s.remainDays ?? '', stl[s.state], p.note, p.cons || '']); });
        downloadCSV(`نگهداری-${m.code}-${J.today().replace(/\//g, '-')}.csv`, rows);
      });
    },
  };
};

function actTag(a) { const t = ACT_TYPES[a] || ACT_TYPES.i; return `<span class="act act-${a}">${t.label}</span>`; }

function logModal(m, p) {
  const s = Maint.status(m, p);
  Modal.open({
    title: `ثبت ${ACT_TYPES[p.act].label}: ${p.name}`, icon: 'wrench', size: 'sm',
    body: `<form class="form-grid cols-1" id="lf">
      <div class="modal-ctx">${icon('truck')}<b>${esc(m.code)}</b><span>${esc(Q.sys(p.sys).name)}</span></div>
      ${F.field('تاریخ انجام', F.date('date', J.today()), { req: true })}
      ${F.field(`کارکرد هنگام انجام (${unitLabel(m)})`, F.num('km', m.odometer), { hint: m.odometer !== null && m.odometer !== undefined ? 'پیش‌فرض: کارکرد فعلی ماشین' : 'کارکرد فعلی ماشین هنوز ثبت نشده است' })}
      ${F.field('شرح / قطعه استفاده‌شده', F.textarea('note', '', 'rows="2" placeholder="مثلاً: از جایگزین ۱ استفاده شد، برند …"'))}
      ${s.last ? `<div class="muted small">آخرین ثبت: ${s.last.km !== null && s.last.km !== undefined ? nf(s.last.km) + ' ' + unitLabel(m) + ' · ' : ''}${toFa(s.last.date)}</div>` : ''}
    </form>`,
    footer: `<button class="btn btn-ghost" data-close>انصراف</button><button class="btn btn-primary" data-save>${icon('save')}ثبت</button>`,
    onMount(el, api) {
      el.querySelector('[data-save]').addEventListener('click', () => {
        const v = F.read(el.querySelector('#lf'));
        const date = J.norm(v.date);
        if (!date) { Toast.show('تاریخ معتبر وارد کنید', 'warn'); return; }
        const km = num(v.km);
        Store.update(d => {
          d.partLogs.push({ id: uid('l'), machineId: m.id, partId: p.id, date, km, note: v.note.trim(), at: new Date().toISOString() });
          const mm = d.machines.find(x => x.id === m.id);
          if (km !== null && (mm.odometer === null || mm.odometer === undefined || km > mm.odometer)) { mm.odometer = km; mm.odoDate = date; d.odoLogs.push({ id: uid('o'), machineId: m.id, value: km, date }); }
        });
        api.close(); Toast.show('ثبت شد');
      });
    },
  });
}

function histModal(m, p) {
  const render = () => {
    const logs = Maint.logsFor(m.id, p.id);
    return logs.length ? `<ul class="hist">${logs.map(l => `<li>
      <span class="h-dot"></span>
      <div><b>${toFa(l.date)}</b>${l.km !== null && l.km !== undefined ? ` · ${nf(l.km)} ${unitLabel(m)}` : ''}${l.note ? `<small>${esc(l.note)}</small>` : ''}</div>
      <button class="icon-btn sm" data-rm="${l.id}" title="حذف">${icon('trash-2')}</button></li>`).join('')}</ul>`
      : emptyState('history', 'سابقه‌ای ثبت نشده');
  };
  Modal.open({
    title: `سوابق: ${p.name}`, icon: 'history',
    body: `<div id="hb">${render()}</div>`,
    footer: `<button class="btn btn-ghost" data-close>بستن</button><button class="btn btn-primary" data-new>${icon('plus')}ثبت جدید</button>`,
    onMount(el, api) {
      el.addEventListener('click', async e => {
        const rm = e.target.closest('[data-rm]');
        if (rm) {
          if (!await Modal.confirm({ title: 'حذف سابقه', message: 'این سابقه حذف شود؟', ok: 'حذف', danger: true })) return;
          Store.update(d => { d.partLogs = d.partLogs.filter(l => l.id !== rm.dataset.rm); });
          el.querySelector('#hb').innerHTML = render();
        }
        if (e.target.closest('[data-new]')) { api.close(); logModal(Q.machine(m.id), p); }
      });
    },
  });
}

function bulkModal(m) {
  const parts = (Store.get().catalog[m.model] || []).filter(p => pIv(p, m) > 0 || p.mo > 0);
  Modal.open({
    title: `ثبت سرویس اولیه · ${m.code}`, icon: 'list-checks', size: 'lg',
    body: `<p class="muted">برای راه‌اندازی سریع: قطعاتی را که در یک تاریخ و کارکرد مشخص تعویض یا سرویس شده‌اند انتخاب کنید. بعداً هر قطعه را جداگانه هم می‌توانید اصلاح کنید.</p>
      <form class="form-grid" id="bf">
        ${F.field('تاریخ', F.date('date', J.today()), { req: true })}
        ${F.field(`کارکرد (${unitLabel(m)})`, F.num('km', m.odometer))}
      </form>
      <div class="bulk-tools"><button type="button" class="btn btn-sm btn-ghost" data-all>انتخاب همه</button><button type="button" class="btn btn-sm btn-ghost" data-none>هیچ‌کدام</button><button type="button" class="btn btn-sm btn-ghost" data-unrec>فقط ثبت‌نشده‌ها</button></div>
      <div class="bulk-list">${SYSTEMS.map(sys => {
      const l = parts.filter(p => p.sys === sys.key);
      if (!l.length) return '';
      return `<fieldset><legend>${icon(sys.icon)}${sys.name}</legend>${l.map(p => `<label class="check"><input type="checkbox" value="${p.id}" ${Maint.lastLog(m.id, p.id) ? '' : 'checked'}><span>${esc(p.name)}</span></label>`).join('')}</fieldset>`;
    }).join('')}</div>`,
    footer: `<button class="btn btn-ghost" data-close>انصراف</button><button class="btn btn-primary" data-save>${icon('save')}ثبت برای موارد انتخاب‌شده</button>`,
    onMount(el, api) {
      const boxes = () => $$('.bulk-list input[type=checkbox]', el);
      el.querySelector('[data-all]').addEventListener('click', () => boxes().forEach(b => { b.checked = true; }));
      el.querySelector('[data-none]').addEventListener('click', () => boxes().forEach(b => { b.checked = false; }));
      el.querySelector('[data-unrec]').addEventListener('click', () => boxes().forEach(b => { b.checked = !Maint.lastLog(m.id, b.value); }));
      el.querySelector('[data-save]').addEventListener('click', () => {
        const v = F.read(el.querySelector('#bf'));
        const date = J.norm(v.date); const km = num(v.km);
        if (!date) { Toast.show('تاریخ معتبر وارد کنید', 'warn'); return; }
        const ids = boxes().filter(b => b.checked).map(b => b.value);
        if (!ids.length) { Toast.show('هیچ قطعه‌ای انتخاب نشده', 'warn'); return; }
        Store.update(d => {
          ids.forEach(pid => d.partLogs.push({ id: uid('l'), machineId: m.id, partId: pid, date, km, note: 'سرویس اولیه', at: new Date().toISOString() }));
          const mm = d.machines.find(x => x.id === m.id);
          if (km !== null && (mm.odometer === null || mm.odometer === undefined || km > mm.odometer)) { mm.odometer = km; mm.odoDate = date; d.odoLogs.push({ id: uid('o'), machineId: m.id, value: km, date }); }
        });
        api.close(); Toast.show(`${nf(ids.length)} مورد ثبت شد`);
      });
    },
  });
}

/* ویرایش / افزودن قطعه در فهرست یک مدل (مشترک با صفحه قطعات جایگزین) */
function consModal(m, p) {
  const s = Maint.status(m, p);
  Modal.open({
    title: `تبعات: ${p.name}`, icon: 'triangle-alert',
    body: `<div class="modal-ctx">${icon('truck')}<b>${esc(m.code)}</b><span>${esc(Q.sys(p.sys).name)}</span><span class="grow"></span>${statusPill(s.state)}</div>
      <p class="muted small">اگر «${esc(p.name)}» سر موعد (${intervalText(p, m)}) ${ACT_TYPES[p.act] ? ACT_TYPES[p.act].label : ''} نشود:</p>
      <div class="cons-box ${s.state === 'over' || s.state === 'soon' ? s.state : ''}">${esc(p.cons || '')}</div>`,
    footer: `<button class="btn btn-ghost" data-close>بستن</button><button class="btn btn-primary" data-edit>${icon('pencil')}ویرایش تبعات</button>`,
    onMount(el, api) { el.querySelector('[data-edit]').addEventListener('click', () => { api.close(); partModal(m.model, p, { focusCons: true }); }); },

}

function partModal(modelId, p, { focusCons = false } = {}) {
  const isNew = !p;
  p = p || { name: '', sys: MaintState.sys || 'other', km: 0, hr: 0, mo: 0, act: 'r', note: '', cons: '' };
  const ms = Store.get().machines.filter(x => x.model === modelId);
  const hourly = ms.length && ms.every(x => x.unit === 'hour');
  const kmly = ms.length && ms.every(x => x.unit !== 'hour');
  Modal.open({
    title: isNew ? `افزودن قطعه به ${Q.modelName(modelId)}` : 'ویرایش قطعه', icon: 'package',
    body: `<form class="form-grid" id="ptf">
      ${F.field('نام قطعه', F.input('name', p.name), { req: true, cls: 'span2' })}
      ${F.field('سیستم', F.select('sys', SYSTEMS.map(s => [s.key, s.name]), p.sys))}
      ${F.field('نوع اقدام', F.select('act', Object.entries(ACT_TYPES).map(([k, v]) => [k, v.label]), p.act))}
      <div class="span2 iv-row">
        ${F.field('دوره کیلومتری', F.num('km', p.km || '', 'placeholder="مثلاً ۱۰۰۰۰"'), { hint: hourly ? 'ماشین‌های این مدل ساعت‌کارند؛ این دوره برایشان استفاده نمی‌شود' : 'برای ماشین‌هایی که با کیلومتر کار می‌کنند' })}
        ${F.field('دوره ساعتی (ساعت کار)', F.num('hr', p.hr || '', 'placeholder="مثلاً ۲۵۰"'), { hint: kmly ? 'ماشین‌های این مدل کیلومتری‌اند؛ این دوره برایشان استفاده نمی‌شود' : 'برای لودر، تراکتور و ماشین‌های ساعت‌کار' })}
        ${F.field('دوره ماهانه', F.num('mo', p.mo || '', 'placeholder="مثلاً ۶"'), { hint: 'هر کدام زودتر برسد، ملاک است' })}
      </div>
      ${F.field('توضیح', F.textarea('note', p.note, 'rows="2"'), { cls: 'span2' })}
      ${F.field('تبعات (اگر به‌موقع انجام نشود چه پیش می‌آید؟)', F.textarea('cons', p.cons || '', 'rows="4" placeholder="مثلاً: اگر روغن موتور سر موعد عوض نشود، روغن خاصیت روان‌کاری خود را از دست می‌دهد، یاتاقان‌ها و رینگ‌ها زودتر ساییده می‌شوند و ممکن است موتور نیاز به اورهال پیدا کند."'), { cls: 'span2', hint: 'این متن در ستون «تبعات» جدول نگهداری پیشگیرانه نمایش داده می‌شود' })}
      <div class="span2 muted small">${icon('info')} این تغییر برای همه ماشین‌های مدل «${esc(Q.modelName(modelId))}» (${ms.map(x => esc(x.code)).join('، ') || '—'}) اعمال می‌شود.</div>
    </form>`,
    footer: `${!isNew ? `<button class="btn btn-ghost danger-text" data-del>${icon('trash-2')}حذف قطعه</button><span class="grow"></span>` : ''}<button class="btn btn-ghost" data-close>انصراف</button><button class="btn btn-primary" data-save>${icon('save')}ذخیره</button>`,
    onMount(el, api) {
      if (focusCons) setTimeout(() => { const t = el.querySelector('textarea[name=cons]'); if (t) { t.focus(); t.scrollIntoView({ block: 'center' }); } }, 120);
      el.querySelector('[data-save]').addEventListener('click', () => {
        const v = F.read(el.querySelector('#ptf'));
        if (!v.name.trim()) { Toast.show('نام قطعه را وارد کنید', 'warn'); return; }
        Store.update(d => {
          const data = { name: v.name.trim(), sys: v.sys, act: v.act, km: num(v.km) || 0, hr: num(v.hr) || 0, mo: num(v.mo) || 0, note: v.note.trim(), cons: v.cons.trim() };
          if (isNew) d.catalog[modelId].push({ id: `${modelId}-${v.sys}-${uid('')}`, alts: [], ...data });
          else Object.assign(d.catalog[modelId].find(x => x.id === p.id), data);
        });
        api.close(); Toast.show('ذخیره شد');
      });
      const del = el.querySelector('[data-del]');
      if (del) del.addEventListener('click', async () => {
        if (!await Modal.confirm({ title: 'حذف قطعه', message: `«${esc(p.name)}» از فهرست ${esc(Q.modelName(modelId))} حذف شود؟ جایگزین‌های آن هم حذف می‌شود؛ سوابق تعویض در تاریخچه ماشین باقی می‌ماند.`, ok: 'حذف', danger: true })) return;
        Store.update(d => { removeParts(d, modelId, [p.id]); });
        api.close(); Toast.show('قطعه حذف شد');
      });
    },
  });
}

/* حذف قطعه از فهرست مدل؛ سوابق تعویض با نام قطعه در تاریخچه ماشین می‌ماند */
function removeParts(d, modelId, ids) {
  const set = new Set(ids);
  (d.catalog[modelId] || []).forEach(p => {
    if (!set.has(p.id)) return;
    d.partLogs.forEach(l => { if (l.partId === p.id && !l.partName) { l.partName = p.name; l.partSys = p.sys; l.partAct = p.act; } });
  });
  d.catalog[modelId] = (d.catalog[modelId] || []).filter(x => !set.has(x.id));
}
/* حذف چند قطعه با هم (یا همه) */
function bulkDeletePartsModal(modelId) {
  const parts = Store.get().catalog[modelId] || [];
  if (!parts.length) { Toast.show('فهرست قطعات این مدل خالی است', 'info'); return; }
  Modal.open({
    title: `حذف قطعه از فهرست ${Q.modelName(modelId)}`, icon: 'trash-2', size: 'lg',
    body: `<p class="muted">قطعاتی را که نمی‌خواهید علامت بزنید. این کار برای همه ماشین‌های مدل «${esc(Q.modelName(modelId))}» اعمال می‌شود و در نگهداری پیشگیرانه و قطعات جایگزین با هم حذف می‌شوند. سوابق تعویض در تاریخچه ماشین باقی می‌ماند.</p>
      <div class="bulk-tools"><button type="button" class="btn btn-sm btn-ghost" data-all>انتخاب همه</button><button type="button" class="btn btn-sm btn-ghost" data-none>هیچ‌کدام</button><span class="grow"></span><span class="muted small" id="bdCount"></span></div>
      <div class="bulk-list">${SYSTEMS.map(sys => {
      const l = parts.filter(p => p.sys === sys.key);
      if (!l.length) return '';
      return `<fieldset><legend>${icon(sys.icon)}${sys.name}</legend>${l.map(p => `<label class="check"><input type="checkbox" value="${p.id}"><span>${esc(p.name)}</span></label>`).join('')}</fieldset>`;
    }).join('')}</div>`,
    footer: `<button class="btn btn-ghost" data-close>انصراف</button><button class="btn btn-danger" data-go>${icon('trash-2')}حذف موارد انتخاب‌شده</button>`,
    onMount(el, api) {
      const boxes = () => $$('.bulk-list input[type=checkbox]', el);
      const cnt = () => { el.querySelector('#bdCount').textContent = `${nf(boxes().filter(b => b.checked).length)} از ${nf(parts.length)} انتخاب شده`; };
      el.addEventListener('change', cnt); cnt();
      el.querySelector('[data-all]').addEventListener('click', () => { boxes().forEach(b => { b.checked = true; }); cnt(); });
      el.querySelector('[data-none]').addEventListener('click', () => { boxes().forEach(b => { b.checked = false; }); cnt(); });
      el.querySelector('[data-go]').addEventListener('click', async () => {
        const ids = boxes().filter(b => b.checked).map(b => b.value);
        if (!ids.length) { Toast.show('هیچ قطعه‌ای انتخاب نشده', 'warn'); return; }
        api.close();
        if (!await Modal.confirm({ title: 'حذف قطعات', danger: true, message: `${nf(ids.length)} قطعه از فهرست «${esc(Q.modelName(modelId))}» حذف شود؟`, ok: 'حذف شود' })) return;
        Store.update(d => { removeParts(d, modelId, ids); });
        Toast.show(`${nf(ids.length)} قطعه حذف شد`);
      });
    },
  });
}

/* ============================================================
   قطعات جایگزین
   ============================================================ */
const PartsState = { q: '', sys: '', only: false };

Pages.parts = (modelId, focusId) => {
  const d = Store.get();
  if (!modelId || !d.catalog[modelId]) modelId = d.models[0] && d.models[0].id;
  if (!modelId) return { title: 'قطعات جایگزین', html: emptyState('package', 'هنوز مدلی تعریف نشده') };
  const parts = d.catalog[modelId] || [];
  const withAlt = parts.filter(p => p.alts && p.alts.length).length;
  const shown = parts.filter(p => (!PartsState.sys || p.sys === PartsState.sys) && (!PartsState.only || (p.alts && p.alts.length))
    && (!PartsState.q || matches(`${p.name} ${(p.alts || []).map(a => a.name + ' ' + a.src + ' ' + a.note).join(' ')}`, PartsState.q)) || p.id === focusId);
  const bySys = SYSTEMS.map(sys => ({ sys, list: shown.filter(p => p.sys === sys.key) })).filter(g => g.list.length);
  const ms = d.machines.filter(m => m.model === modelId);

  const row = (p) => `
    <div class="alt-row ${p.id === focusId ? 'focus' : ''}" id="part-${p.id}">
      <div class="alt-part"><b>${esc(p.name)}</b>${p.note ? `<small>${esc(p.note)}</small>` : ''}</div>
      <div class="alt-chips">
        ${(p.alts || []).map((a, i) => `<button class="alt-chip ${a.ok ? 'ok' : ''}" data-alts="${p.id}" title="${esc(a.note || '')}">
          <span class="ac-n">جایگزین ${toFa(i + 1)}</span><b>${esc(a.name)}</b>${a.src ? `<small>${esc(a.src)}</small>` : ''}${a.ok ? icon('badge-check') : ''}
        </button>`).join('')}
        <button class="alt-add" data-alts="${p.id}">${icon('plus')}<span>${p.alts && p.alts.length ? 'افزودن' : 'افزودن جایگزین'}</span></button>
      </div>
      <button class="icon-btn sm" data-editpart="${p.id}" title="ویرایش قطعه">${icon('pencil')}</button>
    </div>`;

  const html = `
    <div class="model-tabs">${d.models.map(md => {
    const c = (d.catalog[md.id] || []);
    const n = c.filter(p => p.alts && p.alts.length).length;
    const mm = d.machines.filter(m => m.model === md.id);
    return `<a class="model-tab ${md.id === modelId ? 'on' : ''}" href="#/parts/${esc(md.id)}">
        <span class="mt-ic">${icon('truck')}</span>
        <span class="mt-main"><b>${esc(md.name)}</b><small>${mm.map(m => esc(m.code)).join('، ') || 'بدون ماشین'}</small></span>
        <span class="mt-count" title="قطعات دارای جایگزین">${nf(n)}<i>/</i>${nf(c.length)}</span>
      </a>`;
  }).join('')}</div>

    <div class="toolbar card">
      <div class="input-ic grow">${icon('search')}<input class="input" name="q" placeholder="جستجوی قطعه یا جایگزین…" value="${esc(PartsState.q)}"></div>
      ${F.select('sys', [['', 'همه سیستم‌ها'], ...SYSTEMS.map(s => [s.key, s.name])], PartsState.sys)}
      <label class="switch"><input type="checkbox" name="only" ${PartsState.only ? 'checked' : ''}><span class="sw"></span><span>فقط دارای جایگزین</span></label>
    </div>

    ${bySys.length ? bySys.map(g => `
      <section class="card alt-block">
        <div class="alt-head"><span class="sys-ic">${icon(g.sys.icon)}</span><h3>${g.sys.name}</h3><span class="count">${nf(g.list.length)} قطعه</span></div>
        ${g.list.map(row).join('')}
      </section>`).join('') : `<section class="card">${parts.length ? emptyState('search-x', 'قطعه‌ای پیدا نشد') : emptyState('package', `هنوز قطعه‌ای برای «${esc(Q.modelName(modelId))}» تعریف نشده`, 'قطعه‌ای که اضافه کنید هم در نگهداری پیشگیرانه و هم اینجا دیده می‌شود.', `<button class="btn btn-primary" data-addfirst>${icon('plus')}افزودن اولین قطعه</button>`)}</section>`}`;

  return {
    title: 'قطعات جایگزین',
    sub: meta(esc(Q.modelName(modelId)), `${nf(parts.length)} قطعه`, `${nf(withAlt)} قطعه دارای جایگزین`),
    actions: `<button class="btn btn-ghost" data-csv>${icon('file-spreadsheet')}خروجی</button>${parts.length ? `<button class="btn btn-ghost" data-bulkdel>${icon('trash-2')}حذف قطعه‌ها</button>` : ''}<button class="btn btn-primary" data-addpart>${icon('plus')}افزودن قطعه</button>`,
    html,
    mount(el) {
      const bd = el.querySelector('[data-bulkdel]'); if (bd) bd.addEventListener('click', () => bulkDeletePartsModal(modelId));
      el.querySelectorAll('[data-addfirst]').forEach(b => b.addEventListener('click', () => partModal(modelId, null)));
      const q = el.querySelector('input[name=q]');
      q.addEventListener('input', debounce(() => { PartsState.q = q.value; App.rerender(); const n = $('input[name=q]'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 280));
      el.querySelector('select[name=sys]').addEventListener('change', e => { PartsState.sys = e.target.value; App.rerender(); });
      el.querySelector('input[name=only]').addEventListener('change', e => { PartsState.only = e.target.checked; App.rerender(); });
      el.querySelectorAll('[data-alts]').forEach(b => b.addEventListener('click', () => altModal(modelId, b.dataset.alts)));
      el.querySelectorAll('[data-editpart]').forEach(b => b.addEventListener('click', () => partModal(modelId, Q.part(modelId, b.dataset.editpart))));
      el.querySelector('[data-addpart]').addEventListener('click', () => partModal(modelId, null));
      el.querySelector('[data-csv]').addEventListener('click', () => {
        const max = Math.max(1, ...parts.map(p => (p.alts || []).length));
        const head = ['سیستم', 'قطعه'];
        for (let i = 1; i <= max; i++) head.push(`جایگزین ${i}`, `منبع ${i}`, `تأیید ${i}`);
        const rows = parts.map(p => { const r = [Q.sys(p.sys).name, p.name]; (p.alts || []).forEach(a => r.push(a.name, a.src, a.ok ? 'تأییدشده' : '')); return r; });
        downloadCSV(`قطعات-جایگزین-${Q.modelName(modelId)}.csv`, [head, ...rows]);
      });
      if (focusId) { const f = el.querySelector('#part-' + CSS.escape(focusId)); if (f) setTimeout(() => f.scrollIntoView({ block: 'center', behavior: 'smooth' }), 60); }
    },
  };
};

function altModal(modelId, partId) {
  const p = Q.part(modelId, partId);
  let alts = clone(p.alts || []);
  const others = Store.get().models.filter(m => m.id !== modelId).map(m => m.name);
  const render = () => alts.length ? alts.map((a, i) => `
    <div class="alt-edit" data-i="${i}">
      <div class="ae-n">جایگزین ${toFa(i + 1)}</div>
      <div class="form-grid">
        ${F.field('قطعه جایگزین', F.input('name', a.name, 'placeholder="مثلاً: لوله رادیاتور لودر ZL30"'), { req: true })}
        ${F.field('از ماشین / برند', F.input('src', a.src, `list="alt-src" placeholder="مثلاً: لودر ZL30، خاور…"`))}
        ${F.field('توضیح (نیاز به تغییر، کد فنی، …)', F.input('note', a.note), { cls: 'span2' })}
      </div>
      <div class="ae-tools">
        <label class="check"><input type="checkbox" name="ok" ${a.ok ? 'checked' : ''}><span>تأییدشده (امتحان شده و جواب داده)</span></label>
        <span class="grow"></span>
        <button type="button" class="icon-btn sm" data-up="${i}" ${i === 0 ? 'disabled' : ''} title="بالاتر">${icon('arrow-up')}</button>
        <button type="button" class="icon-btn sm" data-down="${i}" ${i === alts.length - 1 ? 'disabled' : ''} title="پایین‌تر">${icon('arrow-down')}</button>
        <button type="button" class="icon-btn sm danger" data-rm="${i}" title="حذف">${icon('trash-2')}</button>
      </div>
    </div>`).join('') : `<div class="calm">${icon('arrow-left-right')}<span>هنوز جایگزینی برای این قطعه ثبت نشده است.</span></div>`;
  const collect = (el) => { $$('.alt-edit', el).forEach(box => { const i = +box.dataset.i; const v = F.read(box); alts[i] = { ...alts[i], name: v.name, src: v.src, note: v.note, ok: v.ok }; }); };
  Modal.open({
    title: `جایگزین‌های «${p.name}»`, icon: 'arrow-left-right', size: 'lg',
    body: `<div class="modal-ctx">${icon('truck')}<b>${esc(Q.modelName(modelId))}</b><span>${esc(Q.sys(p.sys).name)}</span></div>
      <datalist id="alt-src">${[...others, 'لودر ZL30', 'خاور', 'بنز', 'ولوو', 'ایسوزو', 'اسکانیا', 'هوو', 'فوتون'].map(o => `<option value="${esc(o)}">`).join('')}</datalist>
      <div id="altList">${render()}</div>
      <button type="button" class="btn btn-soft full" data-add>${icon('plus')}افزودن جایگزین</button>`,
    footer: `<button class="btn btn-ghost" data-close>انصراف</button><button class="btn btn-primary" data-save>${icon('save')}ذخیره</button>`,
    onMount(el, api) {
      const list = el.querySelector('#altList');
      el.addEventListener('click', e => {
        const t = e.target.closest('button'); if (!t) return;
        if (t.matches('[data-add]')) { collect(el); alts.push({ id: uid('alt'), name: '', src: '', note: '', ok: false }); list.innerHTML = render(); const ins = $$('input[name=name]', list); if (ins.length) ins[ins.length - 1].focus(); }
        if (t.matches('[data-rm]')) { collect(el); alts.splice(+t.dataset.rm, 1); list.innerHTML = render(); }
        if (t.matches('[data-up]')) { collect(el); const i = +t.dataset.up; [alts[i - 1], alts[i]] = [alts[i], alts[i - 1]]; list.innerHTML = render(); }
        if (t.matches('[data-down]')) { collect(el); const i = +t.dataset.down; [alts[i + 1], alts[i]] = [alts[i], alts[i + 1]]; list.innerHTML = render(); }
      });
      if (!alts.length) { alts.push({ id: uid('alt'), name: '', src: '', note: '', ok: false }); list.innerHTML = render(); }
      el.querySelector('[data-save]').addEventListener('click', () => {
        collect(el);

        Store.update(d => { d.catalog[modelId].find(x => x.id === partId).alts = clean; });
        api.close(); Toast.show('جایگزین‌ها ذخیره شد');
      });
    },
  });
}

const RepState = { q: '', machine: '', status: '', urgency: '', from: '', to: '' };
function repFilters() {
  return [['', 'همه خرابی‌های باز', 'layers'], ...Track.stages().slice(0, -1).map(st => ['s' + st.n, st.label, LOCS[st.loc] ? LOCS[st.loc].icon : 'wrench']), ['late', 'دارای تأخیر', 'clock']];
}

function filterRepairs(list, st = RepState) {
  const f = J.norm(st.from), t = J.norm(st.to);
  return list.filter(r => {
    if (st.machine && r.machineId !== st.machine) return false;
    if (/^s\d+$/.test(st.status || '') && Track.cur(r) !== +st.status.slice(1)) return false;
    if (st.status === 'late' && !(Rep.late(r) || Track.late(r))) return false;
    if (st.urgency && r.urgency !== st.urgency) return false;
    if (f && (r.reportDate || '') < f) return false;
    if (t && (r.reportDate || '') > t) return false;
    if (st.q && !matches(`${r.type} ${r.diagnoser} ${r.shop} ${r.repairerNote} ${r.delayReason} ${r.note} ${(Q.machine(r.machineId) || {}).code || ''}`, st.q)) return false;
    return true;
  });
}
function repFilterText(st = RepState) {
  const p = [];
  const sf = repFilters().find(x => x[0] === st.status);
  p.push(st.status && sf ? 'وضعیت: ' + sf[1] : 'همه خرابی‌های باز');
  if (st.machine) p.push('ماشین: ' + ((Q.machine(st.machine) || {}).code || ''));
  if (st.urgency) p.push('سطح ضرورت: ' + (URG[st.urgency] || {}).label);
  if (J.norm(st.from)) p.push('از ' + toFa(J.norm(st.from)));
  if (J.norm(st.to)) p.push('تا ' + toFa(J.norm(st.to)));
  if (st.q) p.push('جستجو: ' + st.q);
  return p.join(' · ');
}

      el.querySelectorAll('input[data-date]').forEach(s => s.addEventListener('change', () => { RepState[s.name] = toEn(s.value); App.rerender(); }));
      el.querySelectorAll('[data-st]').forEach(b => b.addEventListener('click', () => { RepState.status = RepState.status === b.dataset.st ? '' : b.dataset.st; App.rerender(); }));

    mount(el) {

        form.machineId.value = b.dataset.machine;
        el.querySelectorAll('[data-machine]').forEach(x => x.classList.toggle('on', x === b));
