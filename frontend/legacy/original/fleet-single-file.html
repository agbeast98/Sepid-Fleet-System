   ============================================================ */
:root { --shop-bg: #e3eefb; --shop-ink: #1b4f94; --shop-line: #a9c6ee; --road-ink: #7a5418; --road-line: #dfc28f; --fac-line: #9cc3cb; --part-line: #ecb79c; --done-line: #a6d4a6; }
:root[data-theme="dark"] { --shop-bg: rgba(57, 135, 229, .16); --shop-ink: #8fb8ef; --shop-line: rgba(57, 135, 229, .4); --road-ink: var(--accent); --road-line: rgba(217, 165, 79, .4); --fac-line: rgba(92, 182, 198, .4); --part-line: rgba(236, 131, 90, .4); --done-line: rgba(63, 194, 63, .35); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --shop-bg: rgba(57, 135, 229, .16); --shop-ink: #8fb8ef; --shop-line: rgba(57, 135, 229, .4); --road-ink: var(--accent); --road-line: rgba(217, 165, 79, .4); --fac-line: rgba(92, 182, 198, .4); --part-line: rgba(236, 131, 90, .4); --done-line: rgba(63, 194, 63, .35); } }
.loc-factory { --lf: var(--brand-soft); --li: var(--brand); --ll: var(--fac-line); }
.loc-road { --lf: var(--accent-soft); --li: var(--road-ink); --ll: var(--road-line); }
.loc-shop { --lf: var(--shop-bg); --li: var(--shop-ink); --ll: var(--shop-line); }
.loc-part { --lf: var(--serious-bg); --li: var(--serious-ink); --ll: var(--part-line); }
.loc-done { --lf: var(--good-bg); --li: var(--good); --ll: var(--done-line); }

/* دسترسی */
.perm-hide { display: none !important; }
body.plv-0 .page :is([data-edit], [data-add], [data-del]),
body.plv-1 :is([data-edit], [data-add], [data-odo], [data-log], [data-editpart], [data-addpart], [data-bulk], [data-alts], .alt-add, .cons-add, [data-new], [data-send], [data-back], .rep-quick, [data-snap], [data-auto-choose], [data-auto-re], [data-auto-now], [data-auto-off], [data-rules-save], [data-rules-reset], [data-addrule], [data-rmrule], [data-rename], [data-del], [data-rm], [data-undo], [data-stg-save], [data-stg-reset], [data-phone], [data-resend]) { display: none !important; }
body.plv-1 .page :is(#gen, #mnt, #stageCfg, .rules-editor) :is(input, select) { pointer-events: none; opacity: .75; }
body.plv-2 :is([data-del], [data-rm], [data-rmrule], [data-undo]) { display: none !important; }
body:not(.is-super) :is(#drop, .danger-zone, [data-restore]) { display: none !important; }
.ic.flip { transform: scaleX(-1); }

/* ورود */
body.auth-screen #app { display: none; }
#authView { position: fixed; inset: 0; z-index: 50; overflow: auto; background: var(--bg); }
.auth { display: flex; flex-wrap: wrap; min-height: 100%; }
.auth-side { flex: 1 1 380px; background: radial-gradient(120% 60% at 100% 0%, rgba(92, 182, 198, .14), transparent 60%), linear-gradient(180deg, var(--side-bg), var(--side-bg-2)); color: var(--side-ink); padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 28px; }
.auth-brand { display: flex; align-items: center; gap: 12px; }
.auth-pitch { display: flex; flex-direction: column; gap: 12px; max-width: 440px; }
.auth-pitch b { font-size: 28px; line-height: 1.5; color: #fff; font-weight: 800; }
.auth-pitch span { font-size: 15px; line-height: 1.95; }
.auth-side small { color: var(--side-muted); }
.auth-main { flex: 1 1 420px; display: flex; align-items: center; justify-content: center; padding: 40px 22px; }
.auth-form { width: 100%; max-width: 390px; display: flex; flex-direction: column; gap: 16px; }
.auth-head { display: flex; flex-direction: column; gap: 4px; }
.auth-head h1 { font-size: 24px; font-weight: 800; }
.auth-head p { color: var(--muted); margin: 0; font-size: 13.5px; line-height: 1.9; }
.auth-ic { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand); margin-bottom: 6px; }
.auth-form .btn-lg { width: 100%; height: 50px; }
.auth-note { font-size: 12.5px; color: var(--muted); line-height: 1.9; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.auth-err { min-height: 20px; color: var(--crit-ink); font-weight: 600; font-size: 13px; }
.auth-err:empty { display: none; }
.auth-err.shake { animation: shake .4s; }
.me-card { display: flex; align-items: center; gap: 8px; padding: 9px 10px; margin-top: 8px; border-radius: 12px; background: rgba(255, 255, 255, .04); border: 1px solid var(--side-line); }
.me-card .bc-text { flex: 1; }
.me-card .icon-btn { color: var(--side-muted); }
.me-card .icon-btn:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.side-foot .backup-card + .me-card { margin-top: 8px; }

/* کاربران */
.u-cell { display: flex; align-items: center; gap: 10px; }
.u-cell > span { display: flex; flex-direction: column; line-height: 1.45; }
.u-cell small { color: var(--brand); font-size: 11.5px; font-weight: 600; }
.lock-tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--road-ink); font-size: 12px; font-weight: 700; white-space: nowrap; }
.lock-tag .ic { width: 14px; height: 14px; }
.lv-help { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.lv-help div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.lv-help span { font-size: 12.5px; color: var(--ink-2); }
.perm-list { display: flex; flex-direction: column; }
.perm-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line); }
.perm-row:first-child { border-top: 0; }
.perm-name { flex: 1 1 200px; display: flex; flex-direction: column; line-height: 1.5; }
.perm-name b { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.perm-name small { color: var(--muted); font-size: 12px; }
.perm-row.locked { color: var(--muted); }
.perm-seg { flex: 2 1 420px; display: flex; border: 1px solid var(--line-2); border-radius: 11px; overflow: hidden; background: var(--surface); }
.perm-seg button { flex: 1; min-height: 38px; border: 0; border-inline-start: 1px solid var(--line); background: transparent; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 0 8px; }
.perm-seg button:first-child { border-inline-start: 0; }
.perm-seg button:hover { background: var(--surface-2); }
.perm-seg button.on { background: var(--brand); color: var(--brand-ink); }
.perm-seg button.on.zero { background: var(--ink-2); color: var(--surface); }
.perm-seg button:disabled { cursor: default; }
.tmpl-pick { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stg-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.stg-chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 13px; border-radius: 999px; border: 1.5px dashed var(--line-2); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; user-select: none; }
.stg-chip input { display: none; }
.stg-chip .ic { width: 14px; height: 14px; display: none; }
.stg-chip.on { border-style: solid; border-color: var(--li); background: var(--lf); color: var(--li); }
.stg-chip.on .ic { display: inline; }
.sw-list { display: flex; flex-direction: column; gap: 12px; }
.sw-list .switch { white-space: normal; }

/* نوار مراحل */
.stp-wrap { overflow-x: auto; scrollbar-width: thin; margin: 2px -4px 0; padding: 4px 4px 2px; }
.stp { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); min-width: 450px; }
.stp li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; padding: 0 2px; }
.stp li:not(:last-child)::after { content: ''; position: absolute; top: 12px; inset-inline-start: calc(50% + 14px); width: calc(100% - 28px); height: 3px; border-radius: 2px; background: var(--line-2); }
.stp li.done:not(:last-child)::after { background: var(--brand); opacity: .65; }
.stp-dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 800; flex: none; background: var(--surface); color: var(--muted); border: 2px solid var(--line-2); box-sizing: border-box; position: relative; z-index: 1; }
.stp-dot .ic { width: 13px; height: 13px; stroke-width: 3; }
.stp li.done .stp-dot { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.stp li.cur .stp-dot { background: var(--li); border-color: var(--li); color: #fff; box-shadow: 0 0 0 4px var(--lf); }
.stp li.cur.late .stp-dot { background: var(--crit); border-color: var(--crit); box-shadow: 0 0 0 4px var(--crit-bg); }
.stp-lbl { font-size: 10.8px; line-height: 1.5; color: var(--muted); font-weight: 500; max-width: 74px; }
.stp li.done .stp-lbl { color: var(--ink-2); }
.stp li.cur .stp-lbl { color: var(--li); font-weight: 800; }
.stp li.cur.late .stp-lbl { color: var(--crit-ink); }
.stp.big .stp-dot { width: 32px; height: 32px; font-size: 13px; }
.stp.big li:not(:last-child)::after { top: 15px; inset-inline-start: calc(50% + 17px); width: calc(100% - 34px); }
.stp.big .stp-lbl { font-size: 12px; max-width: 96px; }
.spill { display: inline-flex; align-items: center; gap: 5px; height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: var(--lf); color: var(--li); border: 1px solid var(--ll); }
.spill .ic { width: 14px; height: 14px; }
.spill.late { background: var(--crit-bg); color: var(--crit-ink); border-color: color-mix(in srgb, var(--crit) 35%, transparent); }
.mc-name .spill { margin-top: 6px; align-self: flex-start; }

/* تابلو */
.st-tiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 14px; }
.st-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); text-align: start; position: relative; overflow: hidden; transition: .15s; }
.st-tile::before { content: ''; position: absolute; inset-block: 0; inset-inline-start: 0; width: 3px; background: var(--li); }
.st-tile span { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.st-tile span .ic { width: 15px; height: 15px; color: var(--li); }
.st-tile b { font-size: 26px; font-weight: 800; line-height: 1.3; }
button.st-tile:hover { border-color: var(--ll); }
.st-tile.on { background: var(--lf); border-color: var(--ll); box-shadow: 0 0 0 3px color-mix(in srgb, var(--li) 14%, transparent); }
.chips-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.chip { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--ink-2); }
.chip .ic { width: 15px; height: 15px; }
.chip.on { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip.on.crit { background: var(--crit); border-color: var(--crit); color: #fff; }
.chips-meta { margin-inline-start: auto; display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.chips-meta .ic { width: 15px; height: 15px; }
.sc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 14px; margin-bottom: 18px; }
.sc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-1); padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sc.late { border-color: color-mix(in srgb, var(--crit) 55%, var(--line)); box-shadow: 0 0 0 1px color-mix(in srgb, var(--crit) 25%, transparent), var(--shadow-1); }
.sc-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sc-ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; background: var(--lf); color: var(--li); flex: none; }
.sc-ic .ic { width: 21px; height: 21px; }
.sc-name { display: flex; flex-direction: column; line-height: 1.45; flex: 1; min-width: 140px; }
.sc-name b { font-size: 16.5px; font-weight: 800; }
.sc-name small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.late-tag { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: var(--crit-bg); color: var(--crit-ink); font-size: 12px; font-weight: 700; white-space: nowrap; }
.late-tag .ic { width: 14px; height: 14px; }
.sc-info { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.sc-info > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.sc-info span { font-size: 11.5px; color: var(--muted); }
.sc-info b { font-size: 13.5px; display: flex; align-items: center; gap: 5px; }
.sc-info b .ic { width: 15px; height: 15px; color: var(--li); flex: none; }
.sc-stage { color: var(--li); }
.sc.late .sc-stage { color: var(--crit-ink); }
.sc-foot { display: flex; align-items: baseline; gap: 10px; font-size: 12.5px; }
.sc-note { flex: 1; color: var(--ink-2); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sc-meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
.sc-acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 12px; margin-top: -2px; }
.healthy { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.healthy > b { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--good); }
.healthy > b .ic { width: 18px; height: 18px; }
.healthy > div { display: flex; flex-wrap: wrap; gap: 8px; }
.hchip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--good-bg); color: var(--good); font-size: 13px; font-weight: 600; }
.hchip i { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.stg-legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 16px; }
.stg-legend > div { display: flex; gap: 10px; align-items: flex-start; }
.stg-legend .stp-dot { background: var(--lf); border-color: var(--ll); color: var(--li); }
.stg-legend span:last-child { display: flex; flex-direction: column; line-height: 1.55; }
.stg-legend b { font-size: 13.5px; color: var(--li); }
.stg-legend small { font-size: 12px; color: var(--muted); }

/* جزئیات */
.tl2-list { list-style: none; margin: 0; padding: 0; }
.tl2 { position: relative; display: flex; gap: 14px; padding-bottom: 18px; }
.tl2:not(:last-child)::before { content: ''; position: absolute; top: 32px; bottom: 0; inset-inline-start: 14px; width: 2px; background: var(--line-2); }
.tl2-dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; font-size: 12px; font-weight: 800; background: var(--lf); color: var(--li); border: 1.5px solid var(--ll); box-sizing: border-box; position: relative; z-index: 1; }
.tl2.cur .tl2-dot { background: var(--li); color: #fff; border-color: var(--li); box-shadow: 0 0 0 5px var(--lf); }
.tl2.cur.late .tl2-dot { background: var(--crit); border-color: var(--crit); box-shadow: 0 0 0 5px var(--crit-bg); }
.tl2.next .tl2-dot { background: var(--surface); color: var(--muted); border: 2px dashed var(--line-2); }
.tl2.next { opacity: .75; }
.tl2-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; padding-top: 3px; }
.tl2-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tl2-head b { font-size: 15px; color: var(--li); }
.tl2.next b { color: var(--muted); }
.tl2-time { margin-inline-start: auto; font-size: 12.5px; color: var(--muted); }
.tl2-note { font-size: 13.5px; color: var(--ink-2); white-space: pre-wrap; }
.tl2-extra { display: flex; flex-wrap: wrap; gap: 6px; }
.tl2-extra span { font-size: 12px; background: var(--surface-2); border-radius: 8px; padding: 2px 9px; color: var(--ink-2); }
.tl2 small { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.tl2 small .ic { width: 13px; height: 13px; }
.tl2 .st { height: 22px; font-size: 11.5px; }
.here-tag { font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; background: var(--crit-bg); color: var(--crit-ink); }
.st-hero { background: var(--lf); border-color: var(--ll); display: flex; flex-direction: column; gap: 8px; }
.st-hero small { color: var(--li); font-size: 12.5px; }
.st-hero h3 { font-size: 22px; font-weight: 800; color: var(--li); }
.st-hero .kv-line .ic { color: var(--li); }
.st-hero.late { background: var(--crit-bg); border-color: color-mix(in srgb, var(--crit) 35%, transparent); }
.st-hero.late h3, .st-hero.late small { color: var(--crit-ink); }
.late-box { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--crit-ink); background: var(--surface); border-radius: 10px; padding: 7px 10px; }
.late-box .ic { width: 16px; height: 16px; }
.sms-mini { list-style: none; margin: 0; padding: 0; }
.sms-mini li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.sms-mini li:first-child { border-top: 0; }
.sms-mini li > span { flex: 1; display: flex; flex-direction: column; line-height: 1.5; min-width: 0; }
.sms-mini small { color: var(--muted); font-size: 12px; }
.st-mini .btn-row { align-items: center; }

/* ثبت وضعیت */
.page.narrow { max-width: 680px; }
.upd { display: flex; flex-direction: column; gap: 14px; }
.upd > .card { margin: 0; }
.upd-cur { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; font-size: 13px; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 14px; border-radius: 14px; border: 1.5px solid var(--line-2); background: var(--surface); text-align: start; transition: .15s; }
.opt:hover { border-color: var(--li); }
.opt-dot { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--lf); color: var(--li); font-weight: 800; font-size: 12.5px; flex: none; }
.opt-txt { flex: 1; display: flex; flex-direction: column; line-height: 1.5; }
.opt-txt b { font-size: 15px; }
.opt-txt small { color: var(--muted); font-size: 12px; }
.opt.on { border-color: var(--li); background: var(--lf); box-shadow: 0 0 0 3px color-mix(in srgb, var(--li) 16%, transparent); }
.opt.on .opt-dot { background: var(--li); color: #fff; }
.sms-tag { padding: 1px 9px; border-radius: 999px; background: var(--crit); color: #fff; font-size: 11px; font-weight: 700; flex: none; }
.more-btn { margin-top: 10px; }
.sms-prev { background: #fff7f5; border: 1px dashed #e8a9a9; display: flex; flex-direction: column; gap: 8px; }
:root[data-theme="dark"] .sms-prev { background: rgba(208, 59, 59, .08); border-color: rgba(208, 59, 59, .35); }
.sms-prev.off { background: var(--surface-2); border-color: var(--line-2); }
.sp-head { display: flex; align-items: center; gap: 7px; font-size: 13.5px; }
.sp-head .ic { color: var(--crit); }
.sms-prev.off .sp-head .ic { color: var(--muted); }
.sp-to { display: flex; flex-wrap: wrap; gap: 6px; }
.to-chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line-2); font-size: 12.5px; }
.to-chip .ic { width: 13px; height: 13px; color: var(--muted); }
.sp-text { font-size: 13.5px; line-height: 1.9; background: var(--surface); border-radius: 12px; padding: 10px 12px; }
.upd-actions { position: sticky; bottom: 10px; }
.pick-list { display: flex; flex-direction: column; gap: 8px; }
.pick-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-1); }
.pick-item:hover { border-color: var(--line-2); box-shadow: var(--shadow-2); }
.pick-main { flex: 1; display: flex; flex-direction: column; line-height: 1.45; min-width: 0; }
.pick-main b { font-size: 16px; }
.pick-main small { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-item > .ic { color: var(--muted); }

/* پیامک */
.sms-top { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); gap: 18px; margin-bottom: 18px; align-items: start; }
.phone-card { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.phone { width: 290px; max-width: 100%; height: 520px; border-radius: 40px; background: #14171c; padding: 12px; box-sizing: border-box; }

'use strict';
const COMPANY_DEFAULT = 'شرکت دام و طیور سپید بستک';

const J = (() => {
  const breaks = [-61, 9, 38, 199, 426, 686, 756, 818, 1111, 1181, 1210, 1635, 2060, 2097, 2192, 2262, 2324, 2394, 2456, 3178];
  const div = (a, b) => ~~(a / b);
  const mod = (a, b) => a - ~~(a / b) * b;
  function jalCal(jy, withoutLeap) {
    const bl = breaks.length, gy = jy + 621;
    let leapJ = -14, jp = breaks[0], jm, jump = 0, leap, n, i;
    for (i = 1; i < bl; i += 1) {
      jm = breaks[i]; jump = jm - jp;
      if (jy < jm) break;
      leapJ = leapJ + div(jump, 33) * 8 + div(mod(jump, 33), 4);
      jp = jm;
    }
    n = jy - jp;
    leapJ = leapJ + div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
    if (mod(jump, 33) === 4 && jump - n === 4) leapJ += 1;
    const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150;
    const march = 20 + leapJ - leapG;
    if (withoutLeap) return { gy, march };
    if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
    leap = mod(mod(n + 1, 33) - 1, 4);
    if (leap === -1) leap = 4;
    return { leap, gy, march };
  }
  function g2d(gy, gm, gd) {
    let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408;
    d = d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752;
    return d;
  }
  function d2g(jdn) {
    let j = 4 * jdn + 139361631;
    j = j + div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908;
    const i = div(mod(j, 1461), 4) * 5 + 308;
    const gd = div(mod(i, 153), 5) + 1;
    const gm = mod(div(i, 153), 12) + 1;
    const gy = div(j, 1461) - 100100 + div(8 - gm, 6);
    return { gy, gm, gd };
  }
  function j2d(jy, jm, jd) {
    const r = jalCal(jy, true);
    return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1;
  }
  function d2j(jdn) {
    const gy = d2g(jdn).gy;
    let jy = gy - 621;
    const r = jalCal(jy, false);
    const jdn1f = g2d(gy, 3, r.march);
    let k = jdn - jdn1f, jm, jd;
    if (k >= 0) {
      if (k <= 185) { jm = 1 + div(k, 31); jd = mod(k, 31) + 1; return { jy, jm, jd }; }

    } else { jy -= 1; k += 179; if (r.leap === 1) k += 1; }

  const monthLength = (jy, jm) => jm <= 6 ? 31 : jm <= 11 ? 30 : (isLeap(jy) ? 30 : 29);
  const months = ['فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
  const weekdays = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];

  function fromDate(dt) { const d = g2d(dt.getFullYear(), dt.getMonth() + 1, dt.getDate()); return d2j(d); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function fmt(o) { return `${o.jy}/${pad(o.jm)}/${pad(o.jd)}`; }
  function today() { return fmt(fromDate(new Date())); }
  function parse(s) {
    if (!s) return null;
    const m = String(toEn(s)).trim().match(/^(\d{2,4})[\/\.\-](\d{1,2})[\/\.\-](\d{1,2})$/);

})();

const FA_DIG = '۰۱۲۳۴۵۶۷۸۹', AR_DIG = '٠١٢٣٤٥٦٧٨٩';
function toEn(s) {
  return String(s ?? '').replace(/[۰-۹]/g, d => FA_DIG.indexOf(d)).replace(/[٠-٩]/g, d => AR_DIG.indexOf(d));
}
function toFa(s) { return String(s ?? '').replace(/\d/g, d => FA_DIG[d]); }
function num(v) {
  if (v === null || v === undefined || v === '') return null;
  const n = Number(toEn(v).replace(/[,\s٬]/g, ''));
  return Number.isFinite(n) ? n : null;
}
function nf(n, digits = 0) {
  if (n === null || n === undefined || !Number.isFinite(+n)) return '—';
  return toFa((+n).toLocaleString('en-US', { maximumFractionDigits: digits, minimumFractionDigits: 0 })).replace(/,/g, '٬');
}
function pct(a, b, d = 1) { if (!b) return '۰٪'; return toFa(((a / b) * 100).toFixed(d).replace(/\.0$/, '')) + '٪'; }

/* ---------- ابزار عمومی ---------- */
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid(p = 'x') { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }
function by(key, dir = 1) { return (a, b) => (a[key] > b[key] ? dir : a[key] < b[key] ? -dir : 0); }
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return Array.from(root.querySelectorAll(sel)); }
function normText(s) {
  return toEn(String(s ?? '')).toLowerCase()
    .replace(/[يى]/g, 'ی').replace(/ك/g, 'ک').replace(/[‌‏ً-ٟ]/g, '')
    .replace(/\s+/g, ' ').trim();
}
function matches(hay, q) { if (!q) return true; const h = normText(hay); return normText(q).split(' ').every(w => h.includes(w)); }
function ordinal(n) { const w = ['اولین', 'دومین', 'سومین', 'چهارمین', 'پنجمین', 'ششمین', 'هفتمین', 'هشتمین', 'نهمین', 'دهمین']; return n >= 1 && n <= 10 ? w[n - 1] : toFa(n) + '‌امین'; }
function meta(...parts) { return parts.filter(Boolean).map(p => `<bdi>${p}</bdi>`).join('<span class="sep">·</span>'); }
function nowStamp() {
  const d = new Date();
  return `${J.today()} ${J.pad(d.getHours())}:${J.pad(d.getMinutes())}`;
}

/* ساختن نسخه دیگری از یک فهرست با تغییرات */
function variantParts(base, mods) {
  const out = {};
  Object.keys(base).forEach(k => { out[k] = base[k].map(r => r.slice()); });
  Object.entries(mods).forEach(([sys, m]) => {
    if (m.replace) { out[sys] = m.replace.map(r => r.slice()); return; }
    let list = out[sys] || (out[sys] = []);
    if (m.set) Object.entries(m.set).forEach(([name, row]) => { const i = list.findIndex(r => r[0] === name); if (i >= 0) list[i] = row; else list.push(row); });
    if (m.drop) { list = list.filter(r => !m.drop.includes(r[0])); out[sys] = list; }
    if (m.add) list.push(...m.add);
  });
  return out;
}

function addFleet2(d) {
  NEW_MODELS.forEach(md => {
    if (!d.models.some(x => x.id === md.id)) d.models.push(clone(md));
    if (!d.catalog[md.id] || !d.catalog[md.id].length) d.catalog[md.id] = buildCatalog(md.id);
  });
  const sup = d.people.find(p => p.role === 'supervisor' && p.active !== false) || {};
  const pm = d.people.find(p => p.role === 'pm' && p.active !== false) || {};
  NEW_MACHINES.forEach(nm => {
    const exists = d.machines.some(m => {
      const t = normText(`${m.code} ${m.type || ''}`).replace(/\s+/g, '');
      return nm.match.every(k => t.includes(k));
    });
    if (exists) return;
    const rec = newMachineRec(nm, sup.id || '', pm.id || '');
    if (d.machines.some(m => m.id === rec.id)) rec.id = uid('m');

function buildCatalog(modelId) {
  const extra = EXTRA_PARTS[modelId];
  const tw = extra ? {} : (MODEL_TWEAKS[modelId] || {});
  const srcParts = extra || BASE_PARTS;
  const out = [];
  SYSTEMS.forEach(sys => {
    const t = tw[sys.key] || {};
    let i = 0;
    (srcParts[sys.key] || []).forEach(([name, km, mo, act, note]) => {
      if (t.drop && t.drop.includes(name)) return;
      i++;
      out.push({
        id: `${modelId}-${sys.key}-${String(i).padStart(2, '0')}`,
        sys: sys.key,
        name: (t.rename && t.rename[name]) || name,
        km, mo, act, note, cons: '',
        alts: [],
      });
    });
  });
  return out;
}

/* ارتقای داده‌ها به نسخه ۳:
   - مراحل ده‌گانه وضعیت به چهار مرحله نگاشت می‌شوند
   - فهرست قطعات (نگهداری پیشگیرانه و جایگزین‌ها) خالی می‌شود تا کاربر خودش وارد کند؛
     سوابق تعویض با نام قطعه نگه داشته می‌شوند تا در تاریخچه ماشین بمانند */
function migrateV3(d) {
  const mp = (n) => OLD_STAGE_MAP[n] || n;
  (d.repairs || []).forEach(r => {
    (r.track || []).forEach(e => {
      const o = e.n;
      e.n = mp(o);
      if (o === 6 && e.part) e.part.step = 'arrived';
      if (o === 8 && !r.doneDate) r.doneDate = e.date;
      if (o !== e.n) e.oldN = o;
    });
  });
  (d.users || []).forEach(u => { if (Array.isArray(u.stages)) u.stages = [...new Set(u.stages.map(mp))].sort((a, b) => a - b); });
  (d.smsLog || []).forEach(x => { if (x.n) x.n = mp(x.n); });
  d.settings = d.settings || {};
  d.settings.stageCfg = {};
  if (d.settings.sms && d.settings.sms.rules) d.settings.sms.rules = {};
  const names = {};
  Object.entries(d.catalog || {}).forEach(([mid, list]) => (list || []).forEach(p => { names[p.id] = { name: p.name, sys: p.sys, act: p.act }; }));
  (d.partLogs || []).forEach(l => { const x = names[l.partId]; if (x && !l.partName) { l.partName = x.name; l.partSys = x.sys; l.partAct = x.act; } });
  Object.keys(d.catalog || {}).forEach(k => { d.catalog[k] = []; });
}

/* ارتقا به نسخه ۴: مراحل قابل تعریف با شناسه ثابت
   - نام‌ها و حد مجازی که کاربر قبلاً در تنظیمات عوض کرده بود حفظ می‌شود */
function migrateV4(d) {
  const base = clone(STAGE_DEFAULTS);
  const cfg = (d.settings && d.settings.stageCfg) || {};
  base.forEach((s, i) => {
    const c = cfg[i + 1] || {};
    if (String(c.label || '').trim()) s.label = String(c.label).trim();
    if (c.limit !== undefined && i > 0 && i < base.length - 1) s.limit = c.limit;
  });
  d.settings.stages = base;
  d.settings.stageCfg = {};
  const sidOf = (n) => SID_BY_OLDN[(+n || 1) - 1] || 'wait';
  (d.repairs || []).forEach(r => (r.track || []).forEach(e => {
    if (!e.sid) { e.sid = sidOf(e.n); e.label = (base.find(x => x.sid === e.sid) || {}).label || ''; }
  }));
  (d.users || []).forEach(u => { if (Array.isArray(u.stages)) u.stages = [...new Set(u.stages.map(x => typeof x === 'number' ? sidOf(x) : x))]; });
  (d.smsLog || []).forEach(x => { if (x.n && !x.sid) x.sid = sidOf(x.n); });
  const sms = d.settings.sms || {};
  if (sms.rules && typeof sms.rules === 'object') {
    const nr = {};
    Object.entries(sms.rules).forEach(([k, v]) => { nr[/^\d+$/.test(k) ? sidOf(+k) : k] = v; });
    sms.rules = nr;
  }
}

/* ============================================================
   ذخیره‌سازی: IndexedDB + نسخه‌های داخلی + پشتیبان خودکار در پوشه
   ============================================================ */

const Store = (() => {
  const DB_NAME = 'fleet-maint-app';
  const DB_VER = 1;
  let idb = null;
  let data = null;
  let fallback = false;
  const listeners = new Set();

  function openIDB() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('no idb'));
      const req = indexedDB.open(DB_NAME, DB_VER);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        if (!db.objectStoreNames.contains('snapshots')) db.createObjectStore('snapshots', { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  function tx(store, mode, fn) {
    return new Promise((resolve, reject) => {
      const t = idb.transaction(store, mode);
      const s = t.objectStore(store);
      let out;
      Promise.resolve(fn(s)).then(r => { out = r; });
      t.oncomplete = () => resolve(out);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error);
    });
  }
  const reqP = (r) => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

  async function kvGet(key) {
    if (fallback) { const v = localStorage.getItem('fma:' + key); return v ? JSON.parse(v) : undefined; }
    return tx('kv', 'readonly', s => reqP(s.get(key)));
  }
  async function kvSet(key, val) {
    if (fallback) { try { localStorage.setItem('fma:' + key, JSON.stringify(val)); } catch (e) { console.warn(e); } return; }
    return tx('kv', 'readwrite', s => { s.put(val, key); });
  }

  async function init() {
    try { idb = await openIDB(); } catch (e) { fallback = true; }
    let d;
    try { d = await kvGet('db'); } catch (e) { d = undefined; }
    if (d && (d.schema || 1) < 4) { data = d; try { await addSnapshot('before-upgrade'); } catch (e) { /* */ } }
    const oldSchema = d ? (d.schema || 1) : null;
    data = d ? migrate(d) : seedDB();
    if (!d || oldSchema !== data.schema) await persistNow();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* */ }
    return data;
  }

  function migrate(d) {
    const s = seedDB();
    d.settings = Object.assign({}, s.settings, d.settings || {});
    if (!d.settings.companyName) d.settings.companyName = COMPANY_DEFAULT;
    d.rules = d.rules || s.rules;
    ['people', 'machines', 'models', 'analyses', 'partLogs', 'odoLogs', 'repairs', 'users', 'smsLog'].forEach(k => { if (!Array.isArray(d[k])) d[k] = s[k] || []; });
    if (!d.users.some(u => u.super)) d.users.unshift(clone(s.users[0]));
    if (!d.settings.sms || typeof d.settings.sms !== 'object') d.settings.sms = {};
    if (!d.settings.stageCfg || typeof d.settings.stageCfg !== 'object') d.settings.stageCfg = {};
    d.catalog = d.catalog || {};
    if ((d.schema || 1) < 2) { addFleet2(d); d.schema = 2; }
    if ((d.schema || 1) < 3) { migrateV3(d); d.schema = 3; }
    if ((d.schema || 1) < 4) { migrateV4(d); d.schema = 4; }
    if (!Array.isArray(d.settings.stages) || d.settings.stages.length < 2) d.settings.stages = clone(STAGE_DEFAULTS);
    d.models.forEach(m => { if (!d.catalog[m.id]) d.catalog[m.id] = []; });
    return d;
  }

  const persistSoon = debounce(() => persistNow(), 250);
  async function persistNow() {
    data.updatedAt = new Date().toISOString();
    try { await kvSet('db', data); } catch (e) { console.error(e); Toast.show('ذخیره‌سازی با خطا روبه‌رو شد', 'danger'); }
    maybeDailySnapshot();
    AutoBackup.schedule();
  }

  /* هر تغییر از این مسیر عبور می‌کند */
  function update(fn, opts = {}) {
    const tok = (!opts.system && typeof Auth !== 'undefined') ? Auth.pre(data) : null;
    const backup = tok ? clone(data) : null;
    fn(data);
    if (tok) {
      const why = Auth.post(tok, data);
      if (why) {
        data = backup;
        Toast.show(why, 'warn', 4500);
        if (typeof App !== 'undefined') App.hold = false;
        listeners.forEach(l => l());
        return false;
      }
    }
    persistSoon();
    if (!opts.silent) listeners.forEach(l => l());
    return true;
  }
  function onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); }
  function get() { return data; }

  /* ---------- نسخه‌های داخلی (Snapshot) ---------- */
  async function listSnapshots() {
    if (fallback) return [];
    const all = await tx('snapshots', 'readonly', s => reqP(s.getAll()));
    return (all || []).sort((a, b) => b.id.localeCompare(a.id));
  }
  async function addSnapshot(reason) {
    if (fallback) return;
    const snap = { id: new Date().toISOString(), reason, stamp: nowStamp(), data: clone(data), size: JSON.stringify(data).length };
    await tx('snapshots', 'readwrite', s => { s.put(snap); });
    const all = await listSnapshots();
    const extra = all.slice(20);
    if (extra.length) await tx('snapshots', 'readwrite', s => { extra.forEach(x => s.delete(x.id)); });
  }
  async function getSnapshot(id) { return tx('snapshots', 'readonly', s => reqP(s.get(id))); }
  let lastSnapDay = null;
  async function maybeDailySnapshot() {
    const day = J.today();
    if (lastSnapDay === day) return;
    try {
      const all = await listSnapshots();
      lastSnapDay = day;
      if (!all.some(s => s.reason === 'daily' && s.stamp.startsWith(day))) await addSnapshot('daily');
    } catch (e) { /* */ }
  }

  async function replaceAll(newData, reason = 'before-restore') {
    if (typeof Auth !== 'undefined' && Auth.current() && !Auth.isSuper()) { Toast.show('بازیابی و بازنشانی داده‌ها فقط با مدیر کل است', 'warn'); return; }
    if (!Array.isArray(newData.users) || !newData.users.some(u => u.super && u.hash)) newData.users = clone(data.users || []);
    try { await addSnapshot(reason); } catch (e) { /* */ }
    data = migrate(newData);
    await persistNow();
    listeners.forEach(l => l());
  }

  return { init, get, update, onChange, persistNow, listSnapshots, addSnapshot, getSnapshot, replaceAll, kvGet, kvSet, get fallback() { return fallback; } };
})();

/* ============================================================
   پشتیبان خودکار در پوشه (کروم و اج)
   ============================================================ */
const AutoBackup = (() => {
  let handle = null;
  let state = 'unsupported'; // unsupported | off | needs-permission | on | error
  const supported = typeof window.showDirectoryPicker === 'function';

  async function init() {
    if (!supported) { state = 'unsupported'; return; }
    try { handle = await Store.kvGet('backupDir'); } catch (e) { handle = null; }
    if (!handle) { state = 'off'; return; }
    try {
      const p = await handle.queryPermission({ mode: 'readwrite' });
      state = p === 'granted' ? 'on' : 'needs-permission';
    } catch (e) { state = 'needs-permission'; }
  }
  async function choose() {
    try {
      const h = await window.showDirectoryPicker({ id: 'fleet-backup', mode: 'readwrite' });
      handle = h;
      await Store.kvSet('backupDir', h);
      state = 'on';
      await writeNow();
      return true;
    } catch (e) { if (e && e.name !== 'AbortError') Toast.show('انتخاب پوشه ممکن نشد', 'danger'); return false; }
  }
  async function reconnect() {
    if (!handle) return choose();
    try {
      const p = await handle.requestPermission({ mode: 'readwrite' });
      state = p === 'granted' ? 'on' : 'needs-permission';
      if (state === 'on') await writeNow();
      return state === 'on';
    } catch (e) { return false; }
  }
  async function disconnect() {
    handle = null; state = supported ? 'off' : 'unsupported';
    await Store.kvSet('backupDir', null);
  }
  const schedule = debounce(() => { if (state === 'on') writeNow(); }, 2500);
  async function writeNow() {
    if (!handle || state !== 'on') return false;
    try {
      const d = Store.get();
      const json = JSON.stringify({ app: 'fleet-maint', exportedAt: new Date().toISOString(), data: d });
      const day = J.today().replace(/\//g, '-');
      for (const name of ['پشتیبان-آخرین.json', `پشتیبان-${day}.json`]) {
        const fh = await handle.getFileHandle(name, { create: true });
        const w = await fh.createWritable();
        await w.write(json);
        await w.close();
      }
      d.settings.lastAutoBackupAt = nowStamp();
      Store.update(() => { }, { silent: true, system: true });
      App.refreshChrome();
      return true;
    } catch (e) {
      console.warn(e);
      state = 'needs-permission';
      App.refreshChrome();
      return false;
    }
  }
  return {
    init, choose, reconnect, disconnect, schedule, writeNow,
    get state() { return state; }, get supported() { return supported; },
    get folderName() { return handle ? handle.name : ''; },
  };
})();

/* ============================================================
   منطق دامنه: تحلیل خرابی، شمارش سهل‌انگاری، اقدامات مدیریتی
   ============================================================ */
const Logic = (() => {
  function resultOf(a) {
    const d = a.q1 === 'yes' && a.q1b === 'no';
    const p = a.q2 === 'yes' && a.q2b === 'no';
    return d && p ? 'both' : d ? 'driver' : p ? 'pm' : 'none';
  }
  const driverNeg = (a) => ['driver', 'both'].includes(resultOf(a));
  const pmNeg = (a) => ['pm', 'both'].includes(resultOf(a));

  function sorted(list) {
    return list.slice().sort((a, b) => (a.date === b.date ? (a.createdAt || '').localeCompare(b.createdAt || '') : a.date.localeCompare(b.date)));
  }
  function inWindow(dateStr, refDateStr) {
    const w = Store.get().settings.countWindow;
    if (w === 'all') return true;
    if (w === 'year') return String(dateStr).slice(0, 4) === String(refDateStr).slice(0, 4);
    if (w === '12m') { const a = J.toDay(dateStr), b = J.toDay(refDateStr); return a !== null && b !== null && b - a <= 365 && b - a >= 0; }
    return true;
  }
  function ruleAction(role, sev, n) {
    if (!n) return '';
    const list = (Store.get().rules[role] || {})[sev] || [];
    const r = list.find(r => n >= r.min && (r.max === null || r.max === undefined || r.max === '' || n <= r.max));
    return r ? r.action : '';
  }
  /* شماره‌ی تکرار این مورد برای شخص (تا همین تحلیل) */
  function occurrence(a, role) {
    const pid = role === 'driver' ? a.driverId : a.pmId;
    const isNeg = role === 'driver' ? driverNeg : pmNeg;
    if (!pid || !a.severity || !isNeg(a)) return 0;
    const all = sorted(Store.get().analyses.filter(x => x.id !== a.id));
    const before = all.filter(x => (x.date < a.date || (x.date === a.date && (x.createdAt || '') <= (a.createdAt || '9'))));
    const n = before.filter(x => (role === 'driver' ? x.driverId : x.pmId) === pid && isNeg(x) && x.severity === a.severity && inWindow(x.date, a.date)).length;
    return n + 1;
  }
  function actionsFor(a) {
    const out = {};
    ['driver', 'pm'].forEach(role => {
      const n = occurrence(a, role);
      out[role] = n ? { n, action: ruleAction(role, a.severity, n) } : null;
    });
    return out;
  }
  /* وضعیت فعلی هر شخص: برای هر سطح حساسیت */
  function personSummary(pid, role) {
    const today = J.today();
    const isNeg = role === 'driver' ? driverNeg : pmNeg;
    const list = Store.get().analyses.filter(x => (role === 'driver' ? x.driverId : x.pmId) === pid && isNeg(x));
    const rows = SEVERITIES.map(s => {
      const n = list.filter(x => x.severity === s.key && inWindow(x.date, today)).length;
      return { sev: s.key, label: s.label, n, action: ruleAction(role, s.key, n) };
    });
    return { rows, total: list.length, items: sorted(list).reverse() };
  }
  function actionTone(action) {
    if (!action) return 'none';
    if (action.includes('حقوق')) return 'crit';
    if (action.includes('پاداش')) return 'serious';
    return 'warn';
  }
  return { resultOf, driverNeg, pmNeg, sorted, occurrence, actionsFor, personSummary, ruleAction, actionTone, inWindow };
})();

/* ============================================================
   منطق نگهداری: وضعیت هر قطعه برای هر ماشین
   ============================================================ */
const Maint = (() => {
  function lastLog(machineId, partId) {
    let best = null;
    for (const l of Store.get().partLogs) {
      if (l.machineId !== machineId || l.partId !== partId) continue;
      if (!best || (l.km ?? -1) > (best.km ?? -1) || ((l.km ?? -1) === (best.km ?? -1) && l.date > best.date)) best = l;
    }
    return best;
  }
  function logsFor(machineId, partId) {
    return Store.get().partLogs.filter(l => l.machineId === machineId && (!partId || l.partId === partId))
      .sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.km ?? 0) - (a.km ?? 0));
  }
  function status(machine, part) {
    const iv = pIv(part, machine);
    const hasInterval = (iv > 0) || (part.mo > 0);
    const last = lastLog(machine.id, part.id);
    const res = { hasInterval, last, remainKm: null, remainDays: null, usedPct: null, state: 'na', nextKm: null, nextDate: null };
    if (!hasInterval) { res.state = 'na'; return res; }
    if (!last) { res.state = 'none'; return res; }
    const warn = (Store.get().settings.warnPercent || 10) / 100;
    let worst = 'ok', used = 0;
    if (iv > 0 && last.km !== null && last.km !== undefined) {
      res.nextKm = last.km + iv;
      if (machine.odometer !== null && machine.odometer !== undefined) {
        res.remainKm = res.nextKm - machine.odometer;
        const u = (machine.odometer - last.km) / iv; used = Math.max(used, u);
        if (res.remainKm < 0) worst = 'over';
        else if (res.remainKm <= iv * warn) worst = worst === 'over' ? worst : 'soon';
      }
    }
    if (part.mo > 0 && last.date) {
      const ld = J.toDay(last.date);
      if (ld !== null) {
        const next = ld + Math.round(part.mo * 30.44);
        res.nextDate = J.fromDay(next);
        res.remainDays = next - J.todayDay();
        const u = (J.todayDay() - ld) / (part.mo * 30.44); used = Math.max(used, u);
        if (res.remainDays < 0) worst = 'over';
        else if (res.remainDays <= part.mo * 30.44 * warn && worst !== 'over') worst = 'soon';
      }
    }
    res.usedPct = Math.max(0, Math.min(1.2, used));
    res.state = worst;
    return res;
  }
  function machineSummary(machine) {
    const parts = Store.get().catalog[machine.model] || [];
    const c = { over: 0, soon: 0, ok: 0, none: 0, na: 0, total: parts.length, items: [] };
    parts.forEach(p => { const s = status(machine, p); c[s.state]++; if (s.state === 'over' || s.state === 'soon') c.items.push({ part: p, st: s }); });
    c.items.sort((a, b) => (a.st.state === b.st.state ? (a.st.usedPct > b.st.usedPct ? -1 : 1) : a.st.state === 'over' ? -1 : 1));
    return c;
  }
  return { lastLog, logsFor, status, machineSummary };
})();

/* ============================================================
   اعلام خرابی و پیگیری تعمیر: منطق
   ============================================================ */
const URGENCY = [
  { key: 'urgent', label: 'فوری', short: 'فوری', days: 0, tone: 'crit', hint: 'همین امروز به تعمیر فرستاده شود' },
  { key: 'd13', label: 'ارسال با تأخیر ۱ تا ۳ روز', short: '۱ تا ۳ روز', days: 3, tone: 'serious', hint: 'حداکثر ۳ روز پس از اعلام' },
  { key: 'd47', label: 'ارسال با تأخیر ۴ تا ۷ روز', short: '۴ تا ۷ روز', days: 7, tone: 'warn', hint: 'حداکثر ۷ روز پس از اعلام' },
  { key: 'none', label: 'ضروری نیست', short: 'ضروری نیست', days: null, tone: 'muted', hint: 'هر زمان امکان داشت' },
];
const URG = Object.fromEntries(URGENCY.map(u => [u.key, u]));
const REP_ST = {
  wait: { label: 'اعلام‌شده، در کارخانه', tone: 'warn', icon: 'factory' },
  repair: { label: 'در دست تعمیر', tone: 'info', icon: 'wrench' },
  done: { label: 'بایگانی‌شده', tone: 'good', icon: 'archive' },
};

const Rep = (() => {
  const day = (s) => J.toDay(s);
  function status(r) { return day(r.returnDate) !== null ? 'done' : day(r.referDate) !== null ? 'repair' : 'wait'; }
  /* تأخیر در بازگشت: تاریخ بازگشت − تاریخ پیش‌بینی (اگر هنوز برنگشته: امروز − پیش‌بینی) */
  function delay(r) {
    const exp = day(r.expectedDate);
    if (exp === null) return null;
    const ret = day(r.returnDate);
    if (ret !== null) return { days: ret - exp, live: false };
    if (day(r.referDate) !== null) return { days: J.todayDay() - exp, live: true };
    return null;
  }
  /* مهلت ارسال بر اساس سطح ضرورت */
  function sendDeadline(r) {
    const u = URG[r.urgency]; const rep = day(r.reportDate);
    if (!u || u.days === null || rep === null) return null;
    return rep + u.days;
  }
  function sendLate(r) {
    const dl = sendDeadline(r); if (dl === null) return 0;
    const sent = day(r.referDate);
    return Math.max(0, (sent !== null ? sent : J.todayDay()) - dl);
  }
  function downDays(r) {
    const a = day(r.referDate); if (a === null) return null;
    const b = day(r.returnDate);
    return (b !== null ? b : J.todayDay()) - a;
  }
  function late(r) {
    const st = status(r);
    if (st === 'repair') { const dl = delay(r); return !!(dl && dl.days > 0); }
    if (st === 'wait') return sendLate(r) > 0;
    return false;
  }
  function needReason(r) { const dl = delay(r); return !!(dl && dl.days > 0 && !String(r.delayReason || '').trim()); }
  function sorted(list) {
    return list.slice().sort((a, b) => (b.reportDate || '').localeCompare(a.reportDate || '') || (b.createdAt || '').localeCompare(a.createdAt || ''));
  }
  function forMachine(id) { return sorted(Store.get().repairs.filter(r => r.machineId === id)); }
  function openOf(machineId) { return Store.get().repairs.filter(r => r.machineId === machineId && status(r) !== 'done'); }
  function uniq(arr) {
    const seen = new Set(), out = [];
    arr.forEach(v => { const s = String(v || '').trim(); const k = normText(s); if (s && !seen.has(k)) { seen.add(k); out.push(s); } });
    return out;
  }
  function diagnoserNames() {
    const d = Store.get();
    return uniq([...d.people.filter(p => (p.role === 'pm' || p.role === 'supervisor') && p.active !== false).map(p => p.name), ...d.repairs.map(r => r.diagnoser)]);
  }
  function shopNames() { return uniq(Store.get().repairs.map(r => r.shop)); }
  return { status, delay, sendDeadline, sendLate, downDays, late, needReason, sorted, forMachine, openOf, diagnoserNames, shopNames, uniq };
})();

/* برچسب مرحله یک خرابی باز: [نام مرحله، آیکون، رنگ] — از نام‌هایی که در تنظیمات تعریف شده */
function openLbl(n) { const s = Track.stage(n); return [s.label, LOCS[s.loc] ? LOCS[s.loc].icon : 'wrench', s.n === 1 ? 'warn' : 'info']; }
function repStatusPill(r) {

}
/* توضیح کوتاه وضعیت یک خرابی باز (برای فهرست‌ها) */
function repInfoText(r) {

    if (late > 0) return `${nf(late)} روز از مهلت ارسال گذشته`;
    return since !== null ? (since === 0 ? 'امروز اعلام شده' : `${nf(since)} روز از اعلام`) : '';
  }

  }
  return '';
}

/* ============================================================
   نام‌ها: مقایسه نام‌های مشابه (رضایی / رضائی)
   ============================================================ */
function normName(s) {
  return normText(s).replace(/ئ/g, 'ی').replace(/[أإآ]/g, 'ا').replace(/ؤ/g, 'و').replace(/ة/g, 'ه').replace(/ء/g, '').replace(/[\s‌]+/g, '');
}
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function similarName(a, b) {
  const x = normName(a), y = normName(b);
  if (!x || !y) return false;
  if (x === y) return true;
  const L = Math.min(x.length, y.length);
  const dist = levenshtein(x, y);
  return L >= 9 ? dist <= 2 : L >= 4 ? dist <= 1 : false;
}
/* اگر نام تایپ‌شده شبیه یکی از نام‌های قبلی باشد، از کاربر می‌پرسد. خروجی null یعنی کاربر منصرف شد */
async function resolveName(raw, existing, { what = 'نام' } = {}) {
  const name = String(raw || '').trim().replace(/\s+/g, ' ');
  if (!name) return '';
  const exact = existing.find(n => normText(n) === normText(name));
  if (exact) return exact;
  const sim = existing.filter(n => similarName(n, name)).slice(0, 3);
  if (!sim.length) return name;
  return Modal.choose({

/* نام راننده → شناسه فرد (اگر نبود، به فهرست رانندگان اضافه می‌شود) */
async function resolveDriverId(raw) {
  const drivers = Store.get().people.filter(p => p.role === 'driver');
  const name = await resolveName(raw, drivers.map(p => p.name), { what: 'راننده' });
  if (name === null) return null;

  const ex = drivers.find(p => normText(p.name) === normText(name));

/* ---------- پنجره (Modal) ---------- */
const Modal = (() => {
  let stack = [];
  function open({ title, body, footer = '', size = 'md', onMount, onClose, icon: ic }) {
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';
    wrap.innerHTML = `
      <div class="modal-backdrop" data-close></div>
      <div class="modal modal-${size}" role="dialog" aria-modal="true">
        <header class="modal-head">
          ${ic ? `<span class="modal-ic">${icon(ic)}</span>` : ''}
          <h3>${esc(title)}</h3>
          <button class="icon-btn" data-close aria-label="بستن">${icon('x')}</button>
        </header>
        <div class="modal-body">${body}</div>
        ${footer ? `<footer class="modal-foot">${footer}</footer>` : ''}
      </div>`;
    document.body.appendChild(wrap);
    document.body.classList.add('has-modal');
    requestAnimationFrame(() => wrap.classList.add('in'));
    const api = {
      el: wrap,
      close() {
        wrap.classList.remove('in');
        setTimeout(() => wrap.remove(), 200);
        stack = stack.filter(x => x !== api);
        if (!stack.length) document.body.classList.remove('has-modal');
        onClose && onClose();
      },
    };
    wrap.addEventListener('click', e => { if (e.target.closest('[data-close]')) api.close(); });
    stack.push(api);
    onMount && onMount(wrap, api);
    const f = wrap.querySelector('[autofocus]') || wrap.querySelector('input:not([type=hidden]),textarea,select');
    if (f) setTimeout(() => f.focus(), 60);
    return api;
  }
  function closeTop() { const t = stack[stack.length - 1]; if (t) t.close(); }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) { if (document.querySelector('.datepicker, .combo-pop')) return; e.preventDefault(); closeTop(); } });
  function confirm({ title = 'تأیید', message, ok = 'تأیید', cancel = 'انصراف', danger = false, icon: ic = danger ? 'triangle-alert' : 'info' }) {
    return new Promise(resolve => {
      let done = false;
      const m = open({
        title, icon: ic, size: 'sm',
        body: `<p class="confirm-msg">${message}</p>`,
        footer: `<button class="btn btn-ghost" data-close>${esc(cancel)}</button><button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-ok>${esc(ok)}</button>`,
        onMount(el, api) { el.querySelector('[data-ok]').addEventListener('click', () => { done = true; resolve(true); api.close(); }); },
        onClose() { if (!done) resolve(false); },
      });
      return m;
    });
  }
  function choose({ title, message, options, icon: ic = 'info' }) {
    return new Promise(resolve => {
      let done = false;
      open({
        title, icon: ic, size: 'sm',
        body: `<p class="confirm-msg">${message}</p>`,
        footer: options.map((o, i) => `<button class="btn ${o.primary ? 'btn-primary' : 'btn-ghost'}" data-ch="${i}">${esc(o.label)}</button>`).join(''),
        onMount(el, api) { el.querySelectorAll('[data-ch]').forEach(b => b.addEventListener('click', () => { done = true; resolve(options[+b.dataset.ch].value); api.close(); })); },
        onClose() { if (!done) resolve(null); },
      });
    });
  }
  function closeAll() { stack.slice().reverse().forEach(m => m.close()); }
  return { open, confirm, choose, closeTop, closeAll };
})();

const DatePicker = (() => {
  let pop = null, target = null, view = null;
  function close() { if (pop) { pop.remove(); pop = null; target = null; } document.removeEventListener('mousedown', outside, true); }

        <button type="button" class="icon-btn" data-nav="1" aria-label="ماه بعد">${icon('chevron-left')}</button>
      </div>
      <div class="dp-week">${['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'].map(w => `<span>${w}</span>`).join('')}</div>
      <div class="dp-grid">${cells}</div>
      <div class="dp-foot"><button type="button" class="btn btn-sm btn-ghost" data-today>امروز</button><button type="button" class="btn btn-sm btn-ghost" data-clear>پاک کردن</button></div>`;
  }
  function open(input) {
    close();
    target = input;
    const cur = J.parse(input.value) || J.parse(J.today());
    view = { jy: cur.jy, jm: cur.jm };
    pop = document.createElement('div');
    pop.className = 'datepicker';
    document.body.appendChild(pop);
    render();
    const r = input.getBoundingClientRect();
    const w = 288;
    let left = r.right - w; if (left < 8) left = 8;
    let top = r.bottom + 6 + window.scrollY;
    if (r.bottom + 340 > window.innerHeight && r.top > 340) top = r.top - 336 + window.scrollY;
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
    pop.addEventListener('mousedown', e => e.preventDefault());
    pop.addEventListener('click', e => {
      const nav = e.target.closest('[data-nav]');
      if (nav) { view.jm += +nav.dataset.nav; if (view.jm < 1) { view.jm = 12; view.jy--; } if (view.jm > 12) { view.jm = 1; view.jy++; } render(); return; }
      const d = e.target.closest('[data-d]');
      if (d) { set(J.fmt({ jy: view.jy, jm: view.jm, jd: +d.dataset.d })); return; }
      if (e.target.closest('[data-today]')) { set(J.today()); return; }
      if (e.target.closest('[data-clear]')) { set(''); }
    });
    setTimeout(() => document.addEventListener('mousedown', outside, true), 0);
  }
  function set(v) {
    const t = target;
    t.value = v ? toFa(v) : '';
    t.dispatchEvent(new Event('input', { bubbles: true }));
    t.dispatchEvent(new Event('change', { bubbles: true }));
    close();
  }
  document.addEventListener('focusin', e => { const el = e.target; if (el.matches && el.matches('input[data-date]')) open(el); });
  document.addEventListener('click', e => { const el = e.target; if (el.matches && el.matches('input[data-date]') && !pop) open(el); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && pop) close(); if (e.key === 'Tab') close(); });
  window.addEventListener('resize', close);
  window.addEventListener('scroll', e => { if (pop && !pop.contains(e.target)) close(); }, true);
  return { open, close };
})();

const Combo = (() => {
  const sources = {};
  let pop = null, input = null, items = [], idx = -1;
  function register(key, fn) { sources[key] = fn; }
  function list(key) { try { return sources[key] ? sources[key]() : []; } catch (e) { return []; } }
  function close() { if (pop) { pop.remove(); pop = null; } input = null; }
  function position() {
    if (!pop || !input) return;
    const r = input.getBoundingClientRect();
    pop.style.width = Math.max(220, r.width) + 'px';
    pop.style.left = (r.right - Math.max(220, r.width) + window.scrollX) + 'px';
    const below = window.innerHeight - r.bottom;
    const h = Math.min(pop.scrollHeight, 270);
    pop.style.top = (below < h + 12 && r.top > h + 12 ? r.top - h - 4 : r.bottom + 4) + window.scrollY + 'px';
  }
  function render() {
    const q = input.value.trim();
    const all = list(input.dataset.combo);
    items = q ? all.filter(n => matches(n, q)) : all.slice();
    if (q) all.forEach(n => { if (!items.includes(n) && similarName(n, q)) items.push(n); });
    if (idx >= items.length) idx = items.length - 1;
    const exact = all.some(n => normText(n) === normText(q));
    const ic = input.dataset.comboIcon || 'user';
    pop.innerHTML = items.map((n, i) => `<button type="button" class="cb-item ${i === idx ? 'on' : ''}" data-i="${i}">${icon(ic)}<span>${esc(n)}</span></button>`).join('')
      + (q && !exact ? `<div class="cb-new">${icon('plus')}<span>«${esc(q)}» به‌عنوان نام جدید ثبت می‌شود</span></div>` : '')
      + (!items.length && !q ? `<div class="cb-empty">${icon('info')}<span>هنوز نامی ثبت نشده؛ نام را بنویسید</span></div>` : '');
    position();
  }
  function open(el) {
    if (input === el && pop) return;
    close();
    input = el; idx = -1;
    pop = document.createElement('div');
    pop.className = 'combo-pop';
    document.body.appendChild(pop);
    pop.addEventListener('mousedown', e => e.preventDefault());
    pop.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) pick(items[+b.dataset.i]); });
    render();
  }
  function pick(v) {
    const t = input;
    t.value = v;
    close();
    t.dispatchEvent(new Event('input', { bubbles: true }));
    t.dispatchEvent(new Event('change', { bubbles: true }));
  }
  document.addEventListener('focusin', e => { const el = e.target; if (el.matches && el.matches('input[data-combo]')) open(el); else if (pop && !pop.contains(el)) close(); });
  document.addEventListener('click', e => { const el = e.target; if (el.matches && el.matches('input[data-combo]') && !pop) open(el); });
  document.addEventListener('input', e => { if (pop && e.target === input) { idx = -1; render(); } });
  document.addEventListener('keydown', e => {
    if (!pop || e.target !== input) return;
    if (e.key === 'ArrowDown') { idx = Math.min(items.length - 1, idx + 1); render(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { idx = Math.max(-1, idx - 1); render(); e.preventDefault(); }
    else if (e.key === 'Enter' && idx >= 0 && items[idx]) { pick(items[idx]); e.preventDefault(); }
    else if (e.key === 'Escape') { close(); e.stopPropagation(); }
    else if (e.key === 'Tab') close();
  }, true);
  document.addEventListener('mousedown', e => { if (pop && !pop.contains(e.target) && e.target !== input) close(); }, true);
  window.addEventListener('resize', close);
  window.addEventListener('scroll', e => { if (pop && !pop.contains(e.target)) position(); }, true);
  return { register, list, close };
})();

const Charts = (() => {

  function tipRow(color, label, value) {

  }

  /* ---------- دونات ---------- */
  function donut(items, { size = 200, thickness = 26, centerLabel = 'کل بررسی‌ها' } = {}) {
    const total = items.reduce((s, i) => s + i.value, 0);
    const r = size / 2 - 4, rin = r - thickness, cx = size / 2, cy = size / 2;
    let a0 = -Math.PI / 2;
    let paths = '';
    const gap = total > 0 && items.filter(i => i.value > 0).length > 1 ? 0.035 : 0;
    if (!total) {
      paths = `<circle cx="${cx}" cy="${cy}" r="${(r + rin) / 2}" fill="none" stroke="var(--grid)" stroke-width="${thickness}"/>`;
    } else {
      items.forEach((it, idx) => {
        if (!it.value) return;
        const frac = it.value / total;
        let a1 = a0 + frac * Math.PI * 2;
        const s = a0 + gap / 2, e = Math.max(s + 0.001, a1 - gap / 2);
        const large = e - s > Math.PI ? 1 : 0;
        const p = (ang, rad) => [cx + rad * Math.cos(ang), cy + rad * Math.sin(ang)];
        let d;
        if (frac >= 0.9999) {
          d = `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.01} ${cy - r} L ${cx - 0.01} ${cy - rin} A ${rin} ${rin} 0 1 0 ${cx} ${cy - rin} Z`;
        } else {
          const [x1, y1] = p(s, r), [x2, y2] = p(e, r), [x3, y3] = p(e, rin), [x4, y4] = p(s, rin);
          d = `M ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${rin} ${rin} 0 ${large} 0 ${x4} ${y4} Z`;
        }
        paths += `<path d="${d}" fill="${it.color}" class="donut-seg" ${it.href ? `data-href="${it.href}"` : ''} data-hover="d${idx}" data-tip="${esc(tipRow(it.color, it.label, `${nf(it.value)} <small>(${pct(it.value, total)})</small>`))}"/>`;
        a0 = a1;
      });
    }
    const legend = items.map((it, idx) => `
      <li data-hover="d${idx}" ${it.href ? `data-href="${it.href}"` : ''} data-tip="${esc(tipRow(it.color, it.label, `${nf(it.value)} <small>(${pct(it.value, total)})</small>`))}">
        <i style="background:${it.color}"></i><span>${esc(it.label)}</span><b>${nf(it.value)}</b><em>${pct(it.value, total, 0)}</em>
      </li>`).join('');
    return `<div class="donut">
      <div class="donut-fig"><svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="توزیع نتایج">${paths}</svg>
        <div class="donut-center"><b>${nf(total)}</b><span>${esc(centerLabel)}</span></div></div>
      <ul class="legend legend-v">${legend}</ul></div>`;
  }

  function niceMax(v) {
    if (v <= 4) return 4;
    if (v <= 40) return Math.ceil(v / 4) * 4;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const n = v / p;
    const m = n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10;
    return m * p;
  }

  /* ---------- ستونی گروهی ---------- */
  function groupedBars(groups, series, { height = 240, width = 560 } = {}) {
    // groups: [{label, values:[...]}], series: [{label,color}]
    const W = Math.max(260, width), H = height, padL = 30, padR = 6, padT = 12, padB = 44;
    const max = niceMax(Math.max(1, ...groups.flatMap(g => g.values)));
    const iw = W - padL - padR, ih = H - padT - padB;
    const gw = iw / groups.length;
    const n = series.length;
    const bw = Math.max(3, Math.min(16, (gw - 12) / n - 2));
    const inner = n * bw + (n - 1) * 2;
    let grid = '', bars = '', labels = '';
    const ticks = 4;
    for (let i = 0; i <= ticks; i++) {
      const v = (max / ticks) * i, y = padT + ih - (v / max) * ih;
      grid += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" class="${i === 0 ? 'axis' : 'gridline'}"/>`;
      grid += `<text x="${padL - 8}" y="${y + 4}" class="tick" text-anchor="end">${toFa(Math.round(v * 10) / 10)}</text>`;
    }
    groups.forEach((g, gi) => {
      // راست به چپ: گروه اول در سمت راست
      const gx = W - padR - gw * (gi + 1);
      const x0 = gx + (gw - inner) / 2;
      const tipHtml = `<div class="tip-title">${esc(g.label)}</div>` + series.map((s, si) => tipRow(s.color, s.label, nf(g.values[si]))).join('');
      bars += `<rect x="${gx}" y="${padT}" width="${gw}" height="${ih}" fill="transparent" class="hit" ${g.href ? `data-href="${g.href}"` : ''} data-hover="g${gi}" data-tip="${esc(tipHtml)}"/>`;
      series.forEach((s, si) => {
        const v = g.values[si];
        const h = v > 0 ? Math.max(3, (v / max) * ih) : 0;
        const x = x0 + (n - 1 - si) * (bw + 2);
        const y = padT + ih - h;
        if (h > 0) {
          const r = Math.min(4, bw / 2, h);
          bars += `<path class="bar" ${g.href ? `data-href="${g.href}"` : ''} data-hover="g${gi}" data-tip="${esc(tipHtml)}" fill="${s.color}" d="M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + bw - r},${y} Q${x + bw},${y} ${x + bw},${y + r} L${x + bw},${y + h} Z"/>`;
        }
      });
      const lp = String(g.label).split(/\s+/);
      labels += `<text x="${gx + gw / 2}" y="${H - 26}" class="xlabel" text-anchor="middle" ${g.href ? `data-href="${g.href}"` : ''} data-hover="g${gi}"><tspan x="${gx + gw / 2}" dy="0">${esc(lp[0])}</tspan>${lp[1] ? `<tspan x="${gx + gw / 2}" dy="14" class="xlabel-2">${esc(toFa(lp.slice(1).join(' ')))}</tspan>` : ''}</text>`;
    });
    const legend = series.map(s => `<li><i style="background:${s.color}"></i><span>${esc(s.label)}</span></li>`).join('');
    return `<ul class="legend legend-h">${legend}</ul>
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="مقایسه بر اساس خودرو">${grid}${bars}${labels}</svg>`;
  }

  /* ---------- روند (خطی) ---------- */
  function trend(points, lines, { height = 240, width = 560 } = {}) {
    // points: [{label, values:[...]}], lines:[{label,color,area?}]
    const W = Math.max(260, width), H = height, padL = 30, padR = 14, padT = 14, padB = 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    const max = niceMax(Math.max(1, ...points.flatMap(p => p.values)));
    const n = points.length;
    const xAt = i => W - padR - (n === 1 ? iw / 2 : (iw / (n - 1)) * i); // RTL: قدیمی سمت راست
    const yAt = v => padT + ih - (v / max) * ih;
    let grid = '';
    for (let i = 0; i <= 4; i++) {
      const v = (max / 4) * i, y = yAt(v);
      grid += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" class="${i === 0 ? 'axis' : 'gridline'}"/>`;
      grid += `<text x="${padL - 8}" y="${y + 4}" class="tick" text-anchor="end">${toFa(Math.round(v * 10) / 10)}</text>`;
    }
    let paths = '';
    lines.forEach((ln, li) => {
      const pts = points.map((p, i) => [xAt(i), yAt(p.values[li])]);
      const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
      if (ln.area) {
        const ad = d + ` L${pts[pts.length - 1][0]},${yAt(0)} L${pts[0][0]},${yAt(0)} Z`;
        paths += `<path d="${ad}" fill="${ln.color}" opacity=".12"/>`;
      }
      paths += `<path d="${d}" fill="none" stroke="${ln.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      pts.forEach((p, i) => { paths += `<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="${ln.color}" stroke="var(--surface)" stroke-width="2" class="dot" data-hover="t${i}"/>`; });
    });
    let hits = '', labels = '';
    const step = n > 1 ? iw / (n - 1) : iw;
    const every = W / n < 44 ? 2 : 1;
    points.forEach((p, i) => {
      const x = xAt(i);
      const tipHtml = `<div class="tip-title">${esc(p.label)}</div>` + lines.map((l, li) => tipRow(l.color, l.label, nf(p.values[li]))).join('');
      hits += `<line x1="${x}" x2="${x}" y1="${padT}" y2="${padT + ih}" class="crosshair" data-hover="t${i}"/>`;
      hits += `<rect x="${x - step / 2}" y="${padT}" width="${step}" height="${ih}" fill="transparent" data-hover="t${i}" data-tip="${esc(tipHtml)}"/>`;
      if ((n - 1 - i) % every === 0) labels += `<text x="${x}" y="${H - 12}" class="xlabel" text-anchor="middle">${esc(p.short || p.label)}</text>`;
    });
    const legend = lines.map(l => `<li><i style="background:${l.color}"></i><span>${esc(l.label)}</span></li>`).join('');
    return `<ul class="legend legend-h">${legend}</ul>
      <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="روند">${grid}${paths}${hits}${labels}</svg>`;
  }

  /* ---------- حلقه پیشرفت کوچک ---------- */
  function ring(frac, color, size = 44, stroke = 5) {
    const r = (size - stroke) / 2, c = 2 * Math.PI * r;
    const f = Math.max(0, Math.min(1, frac || 0));
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="ring"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="var(--grid)" stroke-width="${stroke}" fill="none"/><circle cx="${size / 2}" cy="${size / 2}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none" stroke-dasharray="${c * f} ${c}" stroke-linecap="round" transform="rotate(-90 ${size / 2} ${size / 2})"/></svg>`;
  }
  return { donut, groupedBars, trend, ring };
})();

  function shell() {

    const bk = backupHealth();
    $('#nav').innerHTML = NAV.map(g => ({ ...g, items: g.items.filter(it => Auth.canHref(it.href)) })).filter(g => g.items.length).map(g => `
      <div class="nav-group"><div class="nav-title">${g.group}</div>
      ${g.items.map(it => {
      let badge = '';
      if (it.badge === 'status') {
        const op = Track.list();
        const lt = op.filter(r => Track.late(r)).length;

        else if (op.length) badge = `<span class="nav-badge info" title="ماشین‌های دارای خرابی باز">${nf(op.length)}</span>`;
      }

      if (it.badge === 'repairs') {
        const op = d.repairs.filter(r => Rep.status(r) !== 'done');
        const lt = op.filter(r => Rep.late(r)).length;
        if (lt) badge = `<span class="nav-badge crit" title="خرابی‌های دارای تأخیر">${nf(lt)}</span>`;
        else if (op.length) badge = `<span class="nav-badge info" title="خرابی‌های باز">${nf(op.length)}</span>`;

  function backupHealth() {
    const s = Store.get().settings;
    if (AutoBackup.state === 'on') return { tone: 'good', title: 'پشتیبان خودکار فعال', sub: s.lastAutoBackupAt ? 'آخرین: ' + toFa(s.lastAutoBackupAt) : 'در پوشه ' + AutoBackup.folderName };
    if (AutoBackup.state === 'needs-permission') return { tone: 'warn', title: 'پشتیبان خودکار متوقف است', sub: 'برای ادامه، اجازه دسترسی دهید' };

    if (!last) return { tone: 'warn', title: 'هنوز پشتیبان نگرفته‌اید', sub: 'برای امنیت داده‌ها یک فایل پشتیبان بگیرید' };

  function parseHash(hs) {
    const h = ((hs === undefined ? location.hash : hs) || '#/dashboard').replace(/^#\/?/, '');

    if (a === 'insight') return { name: 'dashboard', page: 'insight', params: [b || 'total', c] };

    if (a === 'repairs' && b === 'edit') return { name: 'repairs', page: 'repairForm', params: [c] };
    if (a === 'repairs' && b) return { name: 'repairs', page: 'repair', params: [b] };
    if (a === 'repairs') return { name: 'repairs', page: 'repairs', params: [] };
    if (a === 'analyses' && b === 'from-repair') return { name: 'new', page: 'wizard', params: [null, null, c] };
    if (a === 'analyses' && b === 'new') return { name: 'new', page: 'wizard', params: [null, c] };
    if (a === 'analyses' && b === 'edit') return { name: 'analyses', page: 'wizard', params: [c] };
    if (a === 'analyses' && b) return { name: 'analyses', page: 'analysis', params: [b] };
    if (a === 'analyses') return { name: 'analyses', page: 'analyses', params: [] };
    if (a === 'people' && b) return { name: 'people', page: 'person', params: [b] };
    if (a === 'people') return { name: 'people', page: 'people', params: [] };
    if (a === 'machines' && b) return { name: 'machines', page: 'machine', params: [b] };
    if (a === 'machines') return { name: 'machines', page: 'machines', params: [] };
    if (a === 'maint') return { name: 'maint', page: 'maint', params: [b] };
    if (a === 'parts') return { name: 'parts', page: 'parts', params: [b, c] };
    if (a === 'backup') return { name: 'backup', page: 'backup', params: [] };
    if (a === 'settings') return { name: 'settings', page: ({ machines: 'defMachines', people: 'defPeople', models: 'defModels', stages: 'defStages', rules: 'defRules' })[b] || 'settings', params: [] };
    if (a === 'archive') return { name: 'archive', page: 'archive', params: [] };

    if (a === 'status' && b === 'update' && !c) return { name: 'statnew', page: 'statusPick', params: [] };

const GSearch = (() => {
  let idx = 0, results = [];
  function search(q) {
    const d = Store.get();
    const out = [];
    if (!q.trim()) return out;
    Track.list().forEach(r => {
      const m = Q.machine(r.machineId) || {};
      if (matches(`${m.code} ${m.plate} ${r.type}`, q)) out.push({ ic: 'map-pin', t: m.code, s: `${Track.stage(Track.cur(r)).label} · ${Track.where(r)}`, href: `#/status/${r.id}`, g: 'وضعیت لحظه‌ای' });
    });
    d.machines.forEach(m => {
      if (matches(`${m.code} ${m.plate} ${m.type} ${Q.modelName(m.model)} ${Q.pname(m.driverId)}`, q))
        out.push({ ic: 'truck', t: m.code, s: `${m.type} · پلاک ${toFa(m.plate)} · ${Q.pname(m.driverId)}`, href: `#/machines/${m.id}`, g: 'ماشین‌آلات' });
    });
    d.repairs.forEach(r => {
      const m = Q.machine(r.machineId);
      if (matches(`${r.type} ${r.shop} ${r.diagnoser} ${r.repairerNote} ${m ? m.code : ''}`, q))
        out.push({ ic: 'wrench', t: r.type || 'خرابی', s: `${m ? m.code : ''} · ${REP_ST[Rep.status(r)].label} · ${toFa(r.reportDate || '')}`, href: `#/repairs/${r.id}`, g: 'خرابی‌ها و تعمیرات' });
    });
    d.people.forEach(p => {
      if (matches(p.name, q)) out.push({ ic: 'user', t: p.name, s: roleLabel(p.role), href: `#/people/${p.id}`, g: 'پرسنل' });
    });
    d.analyses.forEach(a => {
      const m = Q.machine(a.machineId);
      if (matches(`${a.topic} ${a.cause} ${m ? m.code : ''}`, q))
        out.push({ ic: 'clipboard-list', t: a.topic || 'تحلیل بدون موضوع', s: `${m ? m.code : ''} · ${toFa(a.date)}`, href: `#/analyses/${a.id}`, g: 'تحلیل‌ها' });
    });
    d.models.forEach(md => {
      (d.catalog[md.id] || []).forEach(p => {
        const altTxt = (p.alts || []).map(a => a.name + ' ' + (a.src || '')).join(' ');
        if (matches(`${p.name} ${altTxt}`, q))
          out.push({ ic: 'package', t: p.name, s: `${md.name} · ${Q.sys(p.sys).name}${p.alts && p.alts.length ? ` · ${nf(p.alts.length)} جایگزین` : ''}`, href: `#/parts/${md.id}/${p.id}`, g: 'قطعات' });
      });
    });
    return out.filter(x => Auth.canHref(x.href)).slice(0, 40);
  }
  function render() {
    const pop = $('#gsearchPop');
    const q = $('#gsearchInput').value;
    if (!q.trim()) { pop.classList.remove('open'); return; }
    results = search(q);
    idx = Math.min(idx, Math.max(0, results.length - 1));
    if (!results.length) { pop.innerHTML = `<div class="sp-empty">${icon('search-x')}<span>نتیجه‌ای پیدا نشد</span></div>`; pop.classList.add('open'); return; }
    let g = '', html = '';
    results.forEach((r, i) => {
      if (r.g !== g) { g = r.g; html += `<div class="sp-group">${g}</div>`; }
      html += `<a class="sp-item ${i === idx ? 'on' : ''}" href="${r.href}" data-i="${i}">${icon(r.ic)}<span><b>${esc(r.t)}</b><small>${esc(r.s)}</small></span></a>`;
    });
    pop.innerHTML = html;
    pop.classList.add('open');
  }
  function bind() {
    const inp = $('#gsearchInput');
    inp.addEventListener('input', () => { idx = 0; render(); });
    inp.addEventListener('focus', render);
    inp.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { idx = Math.min(results.length - 1, idx + 1); render(); e.preventDefault(); }
      if (e.key === 'ArrowUp') { idx = Math.max(0, idx - 1); render(); e.preventDefault(); }
      if (e.key === 'Enter' && results[idx]) { location.hash = results[idx].href; close(); }
      if (e.key === 'Escape') close();
    });
    $('#gsearchPop').addEventListener('click', () => setTimeout(close, 10));
    document.addEventListener('mousedown', e => { if (!e.target.closest('#gsearch')) $('#gsearchPop').classList.remove('open'); });
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K' || e.key === 'ک')) { e.preventDefault(); inp.focus(); inp.select(); }
    });
  }
  function close() { $('#gsearchInput').value = ''; $('#gsearchPop').classList.remove('open'); $('#gsearchInput').blur(); }
  return { bind };
})();

const DashState = { driver: '', machine: '', period: 'all' };

const COLORS = { none: 'var(--c-none)', pm: 'var(--c-pm)', driver: 'var(--c-driver)', both: 'var(--c-both)' };

function filterAnalyses(list, { driver = '', machine = '', period = 'all', from = '', to = '' } = {}) {
  const today = J.todayDay();
  return list.filter(a => {
    if (driver && a.driverId !== driver) return false;
    if (machine && a.machineId !== machine) return false;
    const d = J.toDay(a.date);
    if (period === '30' && !(d !== null && today - d <= 29)) return false;
    if (period === '90' && !(d !== null && today - d <= 89)) return false;
    if (period === 'year' && a.date.slice(0, 4) !== J.today().slice(0, 4)) return false;
    if (from && a.date < from) return false;
    if (to && a.date > to) return false;
    return true;
  });
}

    mount(el) {
