        form.urgency.value = v;
        el.querySelectorAll('[data-urg]').forEach(x => x.classList.toggle('on', x.dataset.urg === v));
      }));
      const upd = () => {
        if (!live) return;
        const v = F.read(form);
        const tmp = { referDate: v.referDate || r.referDate, expectedDate: v.expectedDate, returnDate: v.returnDate || r.returnDate };
        const dl = Rep.delay(tmp);
        const down = Rep.downDays(tmp);
        live.innerHTML = !J.norm(v.expectedDate)
          ? '<span class="muted small">با وارد کردن تاریخ پیش‌بینی و تاریخ بازگشت، خودکار حساب می‌شود</span>'
          : `${delayHtml(tmp)}${down !== null ? `<span class="muted small">· ${nf(down)} روز ${J.norm(v.returnDate) ? 'در تعمیرگاه بوده' : 'در تعمیرگاه'}</span>` : ''}`;
        el.querySelector('.delay-reason').classList.toggle('need', !!(dl && dl.days > 0 && J.norm(v.returnDate)));
      };
      form.addEventListener('input', upd); form.addEventListener('change', upd); upd();

      form.addEventListener('submit', async e => {
        e.preventDefault();
        const v = F.read(form);
        if (!v.machineId) { miss('ماشین را انتخاب کنید'); el.querySelector('.machine-pick').scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
        const reportDate = J.norm(v.reportDate);
        if (!reportDate) { miss('تاریخ اعلام خرابی معتبر نیست'); return; }
        if (!v.type.trim()) { miss('نوع خرابی را بنویسید'); form.type.focus(); return; }
        const dt = {};
        for (const [k, label] of [['referDate', 'تاریخ ارسال'], ['expectedDate', 'تاریخ پیش‌بینی'], ['returnDate', 'تاریخ تست سلامت']]) {
          const raw = String(v[k] || '').trim();
          if (raw && !J.norm(raw)) { miss(`${label} معتبر نیست`); return; }
          dt[k] = J.norm(raw) || '';
          /* تاریخ‌های مرحله‌ای فقط اصلاح می‌شوند؛ خالی کردن یا پر کردن تازه فقط از مسیر ثبت مرحله */
          if (k !== 'expectedDate') dt[k] = ex0 && ex0[k] ? (dt[k] || ex0[k]) : (ex0 ? (ex0[k] || '') : '');
        }
        if (dt.returnDate && !dt.referDate) { miss('برای ثبت تاریخ بازگشت، تاریخ ارجاع به تعمیر را هم وارد کنید'); return; }
        if (dt.referDate && dt.referDate < reportDate) { miss('تاریخ ارجاع نمی‌تواند قبل از تاریخ اعلام خرابی باشد'); return; }
        if (dt.returnDate && dt.returnDate < dt.referDate) { miss('تاریخ بازگشت نمی‌تواند قبل از تاریخ ارجاع باشد'); return; }
        if (dt.expectedDate && dt.referDate && dt.expectedDate < dt.referDate) { miss('تاریخ پیش‌بینی بازگشت نمی‌تواند قبل از تاریخ ارجاع باشد'); return; }
        const diagnoser = await resolveName(v.diagnoser, Rep.diagnoserNames());
        if (diagnoser === null) return;
        const shop = 'shop' in v ? await resolveName(v.shop, Rep.shopNames(), { what: 'تعمیرگاه' }) : (r.shop || '');
        if (shop === null) return;
        const rec = {
          machineId: v.machineId, reportDate, urgency: v.urgency || '', type: v.type.trim(), diagnoser,
          referDate: dt.referDate, expectedDate: dt.expectedDate, shop, repairerNote: String(v.repairerNote ?? r.repairerNote ?? '').trim(),
          returnDate: dt.returnDate, delayReason: String(v.delayReason ?? r.delayReason ?? '').trim(), note: String(v.note || '').trim(), updatedAt: new Date().toISOString(),
        };
        if (!editId && Rep.openOf(v.machineId).length && !await Modal.confirm({ title: 'خرابی باز دارد', icon: 'triangle-alert', message: `ماشین «${esc((Q.machine(v.machineId) || {}).code || '')}» هنوز یک خرابی باز دارد. خرابی جدید هم ثبت شود؟`, ok: 'بله، ثبت شود' })) return;
        if (Rep.needReason(rec) && rec.returnDate) {
          const ok = await Modal.confirm({ title: 'علت تأخیر نوشته نشده', icon: 'clock', message: `این تعمیر ${toFa(Rep.delay(rec).days)} روز دیرتر از موعد پیش‌بینی‌شده برگشته ولی علت تأخیر نوشته نشده است. بدون علت ذخیره شود؟`, ok: 'ذخیره شود', cancel: 'برگشت و نوشتن علت' });
          if (!ok) { form.delayReason.focus(); return; }
        }
        let id = editId;
        const me = Auth.current() || {};
        const nowD = new Date();
        const e1 = { id: uid('t'), n: 1, sid: Track.stage(1).sid, label: Track.stage(1).label, at: (reportDate === J.today() ? nowD : (jDate(reportDate, hhmm(nowD)) || nowD)).toISOString(), date: reportDate, time: hhmm(nowD), by: me.id, byName: me.name || '', note: rec.type, fl: {} };
        App.hold = true;
        Store.update(dd => {
          if (editId) Object.assign(dd.repairs.find(x => x.id === editId), rec);
          else {
            dd.settings.repairSeq = (dd.settings.repairSeq || 0) + 1;
            id = uid('r');
            const nr = { id, no: dd.settings.repairSeq, analysisId: null, createdAt: nowD.toISOString(), ...rec, track: [e1] };
            if (from) { nr.prevId = from.id; const fr = dd.repairs.find(x => x.id === from.id); if (fr) fr.nextId = id; }
            dd.repairs.push(nr);
          }
        });
        App.hold = false;
        Toast.show(editId ? 'تغییرات ذخیره شد' : 'خرابی ثبت شد');
        if (!editId) { const nr = Store.get().repairs.find(x => x.id === id); if (nr) SMS.onStage(nr, e1); }
        location.hash = '#/repairs/' + id;
      });
    },
  };
};

    },
  };
};

const ArchState = { q: '', machine: '', result: '', from: '', to: '' };
Pages.archive = () => {
  const d = Store.get();
  const all = d.repairs.filter(r => Track.closed(r)).sort((a, b) => (b.returnDate || '').localeCompare(a.returnDate || '') || (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  const f = J.norm(ArchState.from), t = J.norm(ArchState.to);
  const list = all.filter(r => {
    if (ArchState.machine && r.machineId !== ArchState.machine) return false;
    if (ArchState.result && Track.testResult(r) !== ArchState.result) return false;
    if (f && (r.returnDate || '') < f) return false;
    if (t && (r.returnDate || '') > t) return false;
    if (ArchState.q && !matches(`${r.type} ${r.diagnoser} ${r.shop} ${r.repairerNote} ${r.note} ${(r.test || {}).note || ''} ${(Q.machine(r.machineId) || {}).code || ''}`, ArchState.q)) return false;
    return true;
  });
  const c = { all: all.length, pass: 0, fail: 0, old: 0 };
  all.forEach(r => { c[Track.testResult(r)]++; });
  const tile = (k, label, n, tone, ic) => `<button class="sum-tile ${tone} ${ArchState.result === k ? 'on' : ''}" data-res="${k}"><b>${nf(n)}</b><span>${icon(ic)}${label}</span></button>`;
  const perM = d.machines.map(m => ({ m, n: all.filter(r => r.machineId === m.id).length })).filter(x => x.n);
  const rows = list.map(r => {
    const m = Q.machine(r.machineId) || {};
    const down = Rep.downDays(r);
    return `<tr class="row-link" data-href="#/repairs/${r.id}">
      <td class="num-cell muted">${r.no ? toFa(r.no) : ''}</td>
      <td class="nowrap"><b class="mcode">${esc(m.code || '—')}</b></td>
      <td class="cell-topic"><b>${esc(r.type || '—')}</b>${r.repairerNote ? `<small>تعمیرکار: ${esc(r.repairerNote)}</small>` : ''}${r.prevId ? `<small>${icon('link')}ادامه خرابی قبلی</small>` : ''}</td>
      <td class="nowrap">${toFa(r.reportDate || '—')}</td>
      <td class="nowrap">${r.referDate ? toFa(r.referDate) : '<span class="muted">—</span>'}</td>
      <td class="nowrap">${r.doneDate ? toFa(r.doneDate) : '<span class="muted">—</span>'}</td>
      <td class="nowrap">${toFa(r.returnDate || '—')}</td>
      <td>${testPill(r)}</td>
      <td class="nowrap">${down !== null ? nf(down) + ' روز' : '—'}</td>
    </tr>`;
  }).join('');
  const html = `
    <div class="sum-tiles">
      ${tile('', 'همه پرونده‌های بایگانی', c.all, 'muted', 'archive')}
      ${tile('pass', 'تست سلامت قبول', c.pass, 'good', 'circle-check')}
      ${tile('fail', 'تست سلامت رد', c.fail, 'crit', 'circle-x')}
      ${tile('old', 'قبل از راه‌اندازی تست', c.old, 'muted', 'history')}
    </div>
    ${perM.length ? `<div class="chips-row"><button class="chip ${!ArchState.machine ? 'on' : ''}" data-m="">همه ماشین‌ها</button>${perM.map(x => `<button class="chip ${ArchState.machine === x.m.id ? 'on' : ''}" data-m="${x.m.id}"><bdi>${esc(x.m.code)}</bdi> (${nf(x.n)})</button>`).join('')}</div>` : ''}
    <div class="filters card">
      <div class="field grow"><span class="field-label">جستجو</span><div class="input-ic">${icon('search')}<input class="input" name="q" placeholder="نوع خرابی، تعمیرگاه، شرح تست…" value="${esc(ArchState.q)}"></div></div>
      ${F.field('از تاریخ تست', F.date('from', ArchState.from))}
      ${F.field('تا تاریخ', F.date('to', ArchState.to))}
    </div>
    <section class="card flush">
      ${all.length ? (list.length ? `<div class="table-wrap"><table class="table rep-table">
        <thead><tr><th>شماره</th><th>ماشین</th><th>نوع خرابی</th><th>اعلام</th><th>ارسال برای تعمیر</th><th>پایان تعمیر</th><th>تست سلامت</th><th>نتیجه</th><th>مدت توقف</th></tr></thead>
        <tbody>${rows}</tbody></table></div><div class="table-foot">${nf(list.length)} پرونده از ${nf(all.length)}</div>`
      : emptyState('search-x', 'پرونده‌ای با این فیلترها پیدا نشد'))
      : emptyState('archive', 'بایگانی هنوز خالی است', 'هر خرابی بعد از ثبت «تست سلامت» در کارخانه، اینجا بایگانی می‌شود.')}
    </section>
    ${ArchState.machine ? `<a class="card arch-link" href="#/machines/${ArchState.machine}">${icon('history')}<span><b>تاریخچه کامل ${esc((Q.machine(ArchState.machine) || {}).code || '')}</b><small>خرابی‌ها، تست‌ها، تحلیل‌ها، تعویض قطعات و کارکرد — همه در یک صفحه</small></span>${icon('chevron-left')}</a>` : ''}`;

/* ============================================================
   تاریخچه کامل یک ماشین: همه رویدادهای ثبت‌شده در یک خط زمانی
   ============================================================ */
const HIST_KINDS = {
  rep: { label: 'خرابی و تعمیر', icon: 'wrench' },
  test: { label: 'تست سلامت', icon: 'stethoscope' },
  an: { label: 'تحلیل خرابی', icon: 'clipboard-list' },
  pm: { label: 'نگهداری و تعویض قطعه', icon: 'gauge' },
  odo: { label: 'کارکرد', icon: 'activity' },
};
const HistState = { id: null, kind: '', more: false };
function machineHistory(id) {
  const d = Store.get();
  const m = Q.machine(id) || {};
  const ev = [];
  d.repairs.filter(r => r.machineId === id).forEach(r => {
    Track.history(r).forEach(e => {
      const sg = Track.stageOf(e);
      const isTest = sg.kind === 'test';
      const res = isTest ? Track.testResult(r) : '';
      ev.push({
        kind: isTest ? 'test' : 'rep', date: e.date || '', at: e.at || '',
        title: sg.kind === 'report' ? `${sg.label}: ${r.type || ''}` : isTest ? `${sg.label}: ${res === 'old' ? 'بسته شده (قبل از تست)' : (TEST_RES[res] || {}).short || ''}` : `${sg.label}`,
        sub: [sg.kind !== 'report' ? r.type : '', e.note && e.note !== r.type ? e.note : '', e.part && e.part.name ? 'منتظر: ' + e.part.name : '', e.shop ? e.shop : '', e.byName ? 'ثبت: ' + e.byName : ''].filter(Boolean).join(' · '),
        href: `#/repairs/${r.id}`, tone: isTest ? (res === 'fail' ? 'crit' : res === 'pass' ? 'good' : 'muted') : sg.kind === 'report' ? 'warn' : 'info',
      });
    });
  });
  d.analyses.filter(a => a.machineId === id).forEach(a => {
    const rs = Logic.resultOf(a);
    ev.push({ kind: 'an', date: a.date || '', at: a.createdAt || '', title: `تحلیل خرابی: ${a.topic || ''}`, sub: `${(RESULTS[rs] || {}).label || ''}${a.severity && SEV[a.severity] ? ' · ' + SEV[a.severity].label : ''}`, href: `#/analyses/${a.id}`, tone: rs === 'none' ? 'good' : 'crit' });
  });
  d.partLogs.filter(l => l.machineId === id).forEach(l => {
    const p = Q.part(m.model, l.partId);
    const name = p ? p.name : (l.partName || 'قطعه حذف‌شده');
    const act = ACT_TYPES[p ? p.act : l.partAct] || ACT_TYPES.r;
    ev.push({ kind: 'pm', date: l.date || '', at: l.at || '', title: `${act.label}: ${name}`, sub: [l.km !== null && l.km !== undefined ? `${nf(l.km)} ${unitLabel(m)}` : '', l.note || '', !p ? 'از فهرست قبلی قطعات' : ''].filter(Boolean).join(' · '), href: `#/maint/${id}`, tone: 'info' });
  });
  d.odoLogs.filter(o => o.machineId === id).forEach(o => ev.push({ kind: 'odo', date: o.date || '', at: '', title: `ثبت کارکرد: ${nf(o.value)} ${unitLabel(m)}`, sub: '', href: '', tone: 'muted' }));
  return ev.sort((a, b) => (b.date || '').localeCompare(a.date || '') || (b.at || '').localeCompare(a.at || ''));
}
function machineHistoryCard(id) {
  if (HistState.id !== id) { HistState.id = id; HistState.kind = ''; HistState.more = false; }
  const all = machineHistory(id);
  const list = all.filter(e => !HistState.kind || e.kind === HistState.kind);
  const shown = HistState.more ? list : list.slice(0, 30);
  const chips = [['', 'همه', all.length], ...Object.entries(HIST_KINDS).map(([k, v]) => [k, v.label, all.filter(e => e.kind === k).length])].filter(x => x[0] === '' || x[2])
    .map(([k, l, n]) => `<button class="chip ${HistState.kind === k ? 'on' : ''}" data-hk="${k}">${k ? icon(HIST_KINDS[k].icon) : ''}${l} (${nf(n)})</button>`).join('');
  let lastMonth = '';
  const items = shown.map(e => {
    const mo = (e.date || '').slice(0, 7);
    const head = mo && mo !== lastMonth ? `<li class="hist-month">${toFa(J.long((mo + '/01')).replace(/^\S+\s/, '') || mo)}</li>` : '';
    lastMonth = mo || lastMonth;
    const inner = `<span class="mh-ic tone-${e.tone}">${icon(HIST_KINDS[e.kind].icon)}</span><span class="mh-main"><b>${esc(e.title)}</b>${e.sub ? `<small>${esc(e.sub)}</small>` : ''}</span><span class="mh-date">${toFa(e.date || '—')}</span>`;
    return head + `<li class="mh-item">${e.href ? `<a href="${e.href}">${inner}</a>` : `<div>${inner}</div>`}</li>`;
  }).join('');
  return `<section class="card mh-card" id="hist">
    <div class="card-head"><h3>${icon('history')}تاریخچه کامل ماشین (بایگانی)</h3><div class="head-acts"><span class="muted small">هر چیزی که برای این ماشین ثبت شود اینجا می‌ماند</span><button class="btn btn-sm btn-ghost" data-hprint>${icon('printer')}چاپ</button></div></div>
    <div class="chips-row">${chips}</div>
    ${list.length ? `<ol class="mh-list">${items}</ol>${list.length > shown.length ? `<button class="btn btn-ghost full" data-hmore>${icon('chevron-down')}نمایش ${nf(list.length - shown.length)} مورد دیگر</button>` : ''}` : emptyState('history', 'هنوز چیزی برای این ماشین ثبت نشده')}
  </section>`;
}
function bindMachineHistory(el, id) {
  el.querySelectorAll('[data-hk]').forEach(b => b.addEventListener('click', () => { HistState.kind = b.dataset.hk; HistState.more = false; App.rerender(); }));
  const mb = el.querySelector('[data-hmore]'); if (mb) mb.addEventListener('click', () => { HistState.more = true; App.rerender(); });
  const pb = el.querySelector('[data-hprint]'); if (pb) pb.addEventListener('click', () => {
    const m = Q.machine(id) || {};
    const list = machineHistory(id).filter(e => !HistState.kind || e.kind === HistState.kind);
    const html = `<div class="pr-doc">
      ${Printer.head('تاریخچه ماشین ' + esc(m.code || ''), HistState.kind ? esc(HIST_KINDS[HistState.kind].label) : 'همه رویدادها', `<span>تعداد: ${toFa(list.length)}</span>`)}
      <table class="pr-table"><thead><tr><th class="c">ش</th><th>تاریخ</th><th>نوع</th><th>شرح</th><th>جزئیات</th></tr></thead>
      <tbody>${list.map((e, i) => `<tr><td class="c">${toFa(i + 1)}</td><td class="nw">${pv(e.date)}</td><td class="nw">${esc(HIST_KINDS[e.kind].label)}</td><td>${esc(e.title)}</td><td>${esc(e.sub || '')}</td></tr>`).join('')}</tbody></table>
      ${Printer.signs(['مسئول ماشین‌آلات', 'سرپرست', 'مدیریت'])}
      ${Printer.foot()}
    </div>`;
    Printer.run(html, { title: 'تاریخچه ' + (m.code || '') });
  });
}

   ============================================================ */
function backupPayload() { return { app: 'fleet-maint', version: 1, exportedAt: new Date().toISOString(), exportedAtFa: nowStamp(), data: Store.get() }; }
function exportBackup() {
  const stamp = nowStamp().replace(/[\/: ]/g, '-');
  downloadBlob(`پشتیبان-سامانه-ناوگان-${stamp}.json`, new Blob([JSON.stringify(backupPayload(), null, 1)], { type: 'application/json' }));
  Store.update(d => { d.settings.lastExportAt = nowStamp(); }, { system: true });
  Toast.show('فایل پشتیبان دانلود شد');
}
function parseBackup(text) {
  const o = JSON.parse(text);
  const data = o && o.app === 'fleet-maint' ? o.data : o;
  if (!data || !Array.isArray(data.machines) || !Array.isArray(data.analyses) || !data.catalog) throw new Error('این فایل، پشتیبان معتبر این سامانه نیست');
  return { data, when: o.exportedAtFa || o.exportedAt || '' };
}
function dataStats(d) {
  const alts = Object.values(d.catalog || {}).reduce((s, l) => s + l.reduce((a, p) => a + (p.alts || []).length, 0), 0);
  const parts = Object.values(d.catalog || {}).reduce((s, l) => s + l.length, 0);
  return { machines: d.machines.length, people: d.people.length, repairs: (d.repairs || []).length, analyses: d.analyses.length, logs: d.partLogs.length, parts, alts };
}

        <p class="muted small">پیش از بازیابی، از وضعیت فعلی یک نسخه داخلی خودکار ذخیره می‌شود تا در صورت اشتباه قابل برگشت باشد.</p>

        <p class="muted small">سایت هر روز یک نسخه از داده‌ها را داخل مرورگر نگه می‌دارد (تا ۲۰ نسخه آخر). این نسخه‌ها جایگزین فایل پشتیبان نیستند چون در همان مرورگر ذخیره می‌شوند.</p>
        <div id="snaps"><div class="skeleton"></div></div>
      </section>
      <div class="stack">
        <section class="card">
          <div class="card-head"><h3>${icon('database')}اطلاعات ذخیره‌شده</h3></div>
          ${statsList(s)}
          <div class="muted small">حجم داده‌ها: ${nf(size / 1024, 1)} کیلوبایت${d.settings.lastExportAt ? ` · آخرین پشتیبان دستی: ${toFa(d.settings.lastExportAt)}` : ''}</div>

    mount(el) {
      el.querySelector('[data-export]').addEventListener('click', exportBackup);
      const on = (sel, fn) => { const b = el.querySelector(sel); if (b) b.addEventListener('click', fn); };
      on('[data-auto-choose]', async () => { if (await AutoBackup.choose()) { Toast.show('پشتیبان خودکار فعال شد'); App.rerender(); } });
      on('[data-auto-re]', async () => { if (await AutoBackup.reconnect()) { Toast.show('پشتیبان خودکار دوباره فعال شد'); App.rerender(); } });
      on('[data-auto-now]', async () => { if (await AutoBackup.writeNow()) Toast.show('در پوشه ذخیره شد'); App.rerender(); });
      on('[data-auto-off]', async () => { await AutoBackup.disconnect(); App.rerender(); });
      on('[data-csv-rep]', () => exportRepairsCSV(Rep.sorted(Store.get().repairs)));
      on('[data-csv-an]', () => exportAnalysesCSV(Logic.sorted(Store.get().analyses)));
      on('[data-csv-logs]', () => {
        const dd = Store.get();
        const rows = [['تاریخ', 'ماشین', 'مدل', 'سیستم', 'قطعه', 'کارکرد', 'شرح']];
        dd.partLogs.slice().sort((a, b) => (a.date || '').localeCompare(b.date || '')).forEach(l => {
          const m = Q.machine(l.machineId) || {}; const p = Q.part(m.model, l.partId) || {};
          rows.push([l.date, m.code, Q.modelName(m.model), Q.sys(p.sys).name, p.name, l.km ?? '', l.note]);
        });
        downloadCSV(`سوابق-تعویض-قطعات-${J.today().replace(/\//g, '-')}.csv`, rows);
      });
      on('[data-snap]', async () => { await Store.addSnapshot('manual'); Toast.show('نسخه داخلی ذخیره شد'); loadSnaps(); });
      on('[data-reset]', async () => {
        if (!await Modal.confirm({ title: 'بازنشانی کامل', message: 'همه تحلیل‌ها، سوابق، قطعات جایگزین و تنظیمات پاک می‌شوند. مطمئن هستید؟', ok: 'بله، بازنشانی شود', danger: true })) return;
        await Store.replaceAll(seedDB(), 'before-reset');
        Toast.show('داده‌ها بازنشانی شد');
      });

      /* بازیابی */
      const drop = el.querySelector('#drop'), fileIn = el.querySelector('#restoreFile');
      const handle = (file) => {
        if (!file) return;
        const r = new FileReader();
        r.onload = () => {
          let parsed;
          try { parsed = parseBackup(r.result); } catch (e) { Toast.show(e.message && e.message.includes('معتبر') ? e.message : 'فایل قابل خواندن نیست', 'danger', 5000); return; }
          const st = dataStats(parsed.data);
          Modal.open({
            title: 'بازیابی از فایل پشتیبان', icon: 'upload',
            body: `<p>فایل <b>${esc(file.name)}</b>${parsed.when ? ` (ذخیره‌شده در ${esc(toFa(parsed.when))})` : ''} شامل این اطلاعات است:</p>${statsList(st)}
              <div class="notice notice-warn">${icon('triangle-alert')}<span>اطلاعات فعلی سایت با محتوای این فایل <b>جایگزین</b> می‌شود. از وضعیت فعلی یک نسخه داخلی ذخیره خواهد شد.</span></div>`,
            footer: `<button class="btn btn-ghost" data-close>انصراف</button><button class="btn btn-primary" data-go>${icon('upload')}بازیابی شود</button>`,
            onMount(mel, api) {
              mel.querySelector('[data-go]').addEventListener('click', async () => {
                await Store.replaceAll(parsed.data, 'before-restore');
                api.close(); Toast.show('اطلاعات با موفقیت بازیابی شد');
              });
            },
          });
        };
        r.readAsText(file);
      };
      fileIn.addEventListener('change', () => { handle(fileIn.files[0]); fileIn.value = ''; });
      ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
      ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
      drop.addEventListener('drop', e => handle(e.dataTransfer.files[0]));

      /* نسخه‌های داخلی */
      const reasons = { daily: 'نسخه روزانه', manual: 'ذخیره دستی', 'before-restore': 'پیش از بازیابی', 'before-reset': 'پیش از بازنشانی', 'before-snapshot-restore': 'پیش از بازگشت به نسخه', 'before-upgrade': 'پیش از به‌روزرسانی سایت' };
      async function loadSnaps() {
        const box = el.querySelector('#snaps');
        let list = [];
        try { list = await Store.listSnapshots(); } catch (e) { list = []; }
        if (!list.length) { box.innerHTML = `<div class="calm">${icon('history')}<span>هنوز نسخه‌ای ذخیره نشده است.</span></div>`; return; }
        box.innerHTML = `<ul class="snap-list">${list.map(s => `<li>
          <span class="sn-ic">${icon(s.reason === 'daily' ? 'calendar' : s.reason === 'manual' ? 'bookmark' : 'shield')}</span>
          <div><b>${toFa(s.stamp)}</b><small>${reasons[s.reason] || s.reason} · ${nf((s.size || 0) / 1024, 1)} کیلوبایت · ${nf((s.data.analyses || []).length)} تحلیل</small></div>
          <span class="grow"></span>
          <button class="btn btn-sm btn-ghost" data-dl="${esc(s.id)}">${icon('download')}دانلود</button>
          <button class="btn btn-sm btn-soft" data-restore="${esc(s.id)}">${icon('rotate-ccw')}بازگشت</button>
        </li>`).join('')}</ul>`;
        box.querySelectorAll('[data-dl]').forEach(b => b.addEventListener('click', async () => {
          const s = await Store.getSnapshot(b.dataset.dl);
          downloadBlob(`نسخه-${s.stamp.replace(/[\/: ]/g, '-')}.json`, new Blob([JSON.stringify({ app: 'fleet-maint', version: 1, exportedAt: s.id, exportedAtFa: s.stamp, data: s.data })], { type: 'application/json' }));
        }));
        box.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', async () => {
          const s = await Store.getSnapshot(b.dataset.restore);
          if (!await Modal.confirm({ title: 'بازگشت به نسخه', message: `اطلاعات به وضعیت ${toFa(s.stamp)} برگردد؟ از وضعیت فعلی هم یک نسخه ذخیره می‌شود.`, ok: 'بازگشت' })) return;
          await Store.replaceAll(s.data, 'before-snapshot-restore');
          Toast.show('به نسخه انتخابی بازگشت');
        }));
      }
      loadSnaps();
    },
  };
};

/* ---------- SHA-256 (بدون وابستگی؛ روی http ساده هم کار می‌کند) ---------- */
function sha256Hex(str) {
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174, 0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967, 0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070, 0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  const bytes = Array.from(new TextEncoder().encode(str));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i > 3 ? 0 : (bitLen >>> (i * 8)) & 0xff);
  let h = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const w = new Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < bytes.length; o += 64) {
    for (let i = 0; i < 16; i++) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, hh] = h;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (hh + S1 + ch + K[i] + w[i]) | 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const mj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + mj) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    h = [h[0] + a, h[1] + b, h[2] + c, h[3] + d, h[4] + e, h[5] + f, h[6] + g, h[7] + hh].map(x => x | 0);
  }
  return h.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
function hashPass(pw, salt) {
  let h = sha256Hex(salt + ':' + pw);
  for (let i = 0; i < 2000; i++) h = sha256Hex(h + salt);
  return h;
}

function normPhone(p) {
  let s = toEn(String(p || '')).replace(/[^\d+]/g, '');

  else if (s.startsWith('0098')) s = '0' + s.slice(4);

      if ('prevExpected' in fl) r.expectedDate = fl.prevExpected;
      if (fl.setNote) r.repairerNote = '';
      if ('prevDone' in fl) r.doneDate = fl.prevDone;
      if (fl.setReturn) r.returnDate = '';
      if ('prevDelay' in fl) r.delayReason = fl.prevDelay;
      if (fl.setTest) delete r.test;
    });
  }
  return { stages, stage, bySid, stageOf, posOf, nexts, entries, history, cur, closed, testResult, canNext, sinceMs, late, lateText, partInfo, where, list, add, undo, lastReal, lastAny };
})();

/* ---------- نوار مراحل با نام زیر هر گام ---------- */
function stepper(r, { big = false } = {}) {
  const c = Track.cur(r);
  const late = Track.late(r);
  const tr = Track.testResult(r);
  const L = SL();
  return `<div class="stp-wrap"><ol class="stp dyn ${big ? 'big' : ''}" style="--n:${L}">${Track.stages().map(s => {
    const st = s.n < c || (c === L) ? 'done' : s.n === c ? 'cur' : 'todo';
    const failed = s.n === L && tr === 'fail';
    return `<li class="${st} loc-${s.loc} ${st === 'cur' && late ? 'late' : ''} ${failed ? 'failed' : ''}" title="${esc(s.desc)}">
      <span class="stp-dot">${failed ? icon('x') : st === 'done' ? icon('check') : toFa(s.n)}</span>
      <span class="stp-lbl">${esc(s.label)}${failed ? '<small>رد شد</small>' : ''}</span></li>`;
  }).join('')}</ol></div>`;
}
function stagePill(n, extra = '') {
  const s = Track.stage(n);
  return `<span class="spill loc-${s.loc} ${extra}">${icon(LOCS[s.loc].icon)}${toFa(s.n)}. ${esc(s.label)}</span>`;
}
function testPill(r) {
  const t = Track.testResult(r);
  if (!t) return '';
  if (t === 'old') return `<span class="st st-muted">${icon('archive')}بایگانی (قبل از تست سلامت)</span>`;
  const x = TEST_RES[t];
  return `<span class="st st-${x.tone}">${icon(x.icon)}تست سلامت: ${x.short}</span>`;
}
/* کارت نتیجه تست سلامت و پیوند به خرابی قبلی/بعدی */
function repLinksCard(r) {
  const t = Track.testResult(r);
  const prev = r.prevId ? Q.repair(r.prevId) : null;
  const next = r.nextId ? Q.repair(r.nextId) : null;
  if (!t && !prev && !next) return '';
  const lnk = (x, label) => x ? `<a class="an-link" href="#/repairs/${x.id}"><span class="al-main"><b>${label}: ${esc(x.type || '')}</b><small>${x.no ? 'شماره ' + toFa(x.no) + ' · ' : ''}${toFa(x.reportDate || '')}</small></span>${Track.closed(x) ? testPill(x) : stagePill(Track.cur(x))}</a>` : '';
  const tst = r.test || {};
  return `<section class="card test-card ${t ? 'tc-' + t : ''}">
    <div class="card-head"><h3>${icon('stethoscope')}تست سلامت و پیوندها</h3>${t ? testPill(r) : ''}</div>
    ${t && t !== 'old' ? `<dl class="kv">
      <div><dt>تاریخ تست</dt><dd>${toFa(tst.date || r.returnDate || '—')}${tst.time ? '، ' + toFa(tst.time) : ''}</dd></div>
      <div><dt>ثبت‌کننده</dt><dd>${esc(tst.byName || '—')}</dd></div>
      ${tst.note ? `<div class="span2"><dt>شرح تست</dt><dd class="pre">${esc(tst.note)}</dd></div>` : ''}
    </dl>` : t === 'old' ? '<p class="muted small">این پرونده قبل از راه‌اندازی مرحله تست سلامت بسته شده است.</p>' : ''}
    ${prev ? lnk(prev, 'ادامه خرابی قبلی') : ''}
    ${next ? lnk(next, 'خرابی بعدی (پس از رد تست)') : ''}
    ${t === 'fail' && !next && Auth.canHref('#/repairs/new') ? `<a class="btn btn-primary full" href="#/repairs/again/${r.id}">${icon('plus')}اعلام خرابی جدید برای همین ماشین</a>` : ''}
  </section>`;
}

const StatusState = { grp: '', type: '', late: false };
/* کاشی‌های بالای صفحه وضعیت: یکی برای هر مرحله باز (همه به‌جز تست سلامت که پرونده را می‌بندد) */
function statusGroups() { return Track.stages().slice(0, -1).map(s => ({ key: s.sid, label: s.label, ns: [s.n], loc: s.loc })); }

function statusCard(r) {
  const m = Q.machine(r.machineId) || {};
  const n = Track.cur(r);
  const s = Track.stage(n);
  const late = Track.late(r);
  const la = Track.lastAny(r);
  const ago = agoText(Track.sinceMs(r));
  const by = la ? (la.byName || '') : '';
  const note = la && la.real ? (la.note || (la.part && la.part.name ? 'قطعه: ' + la.part.name : '')) : (r.type || '');
  const nx = Track.nexts(n)[0];
  return `<article class="sc loc-${s.loc} ${late ? 'late' : ''}">
    <div class="sc-top">
      <span class="sc-ic">${icon(machineIcon(m))}</span>
      <div class="sc-name"><b class="mcode">${esc(m.code || '—')}</b><small>${esc(m.type || '')}${r.type ? ' · ' + esc(r.type) : ''}</small></div>
      ${late ? `<span class="late-tag">${icon('clock')}${esc(Track.lateText(r))}</span>` : ''}
      ${m.plate ? plateTag(m.plate) : ''}
    </div>
    ${stepper(r)}
    <div class="sc-info">
      <div><span>مرحله فعلی</span><b class="sc-stage">${toFa(n)}. ${esc(s.label)}</b></div>
      <div><span>مرحله بعد</span><b>${nx ? `${icon('lock-open')}${esc(Track.stage(nx).label)}` : '—'}</b></div>
    </div>
    <div class="sc-foot">
      <span class="sc-note">${esc(note || '—')}</span>
      <span class="sc-meta">${ago ? inStage(ago) : ''}${by ? ' · ' + esc(by) : ''}</span>
    </div>
    <div class="sc-acts">
      <a class="btn btn-sm btn-ghost" href="#/status/${r.id}">${icon('history')}جزئیات و تاریخچه</a>
      ${Track.stages().some(x => Auth.canStage(x.n)) ? `<a class="btn btn-sm btn-primary" href="#/status/${r.id}/update">${icon('route')}ثبت مرحله بعد</a>` : ''}
    </div>
  </article>`;
}

Pages.status = () => {
  const d = Store.get();
  const all = Track.list();
  const openM = new Set(Track.list({ scoped: false }).map(r => r.machineId));
  const healthy = d.machines.filter(m => m.active !== false && !openM.has(m.id));
  const types = [...new Set(d.machines.filter(m => m.active !== false).map(m => String(m.type || '').trim()).filter(Boolean))];
  let list = all.filter(r => {
    const n = Track.cur(r);
    const grp = StatusState.grp && statusGroups().find(g => g.key === StatusState.grp);
    if (grp && !grp.ns.includes(n)) return false;
    if (StatusState.type && String((Q.machine(r.machineId) || {}).type || '').trim() !== StatusState.type) return false;
    if (StatusState.late && !Track.late(r)) return false;
    return true;
  });
  list.sort((a, b) => (Track.late(b) ? 1 : 0) - (Track.late(a) ? 1 : 0) || (Track.sinceMs(b) || 0) - (Track.sinceMs(a) || 0));
  const lateN = all.filter(r => Track.late(r)).length;
  const groups = statusGroups();
  const tiles = groups.map(g => {
    const c = all.filter(r => g.ns.includes(Track.cur(r))).length;
    return `<button class="st-tile loc-${g.loc} ${StatusState.grp === g.key ? 'on' : ''}" data-grp="${g.key}"><span>${icon(LOCS[g.loc].icon)}${g.label}</span><b>${nf(c)}</b></button>`;
  }).join('') + (Auth.scopeShop() ? '' : `<div class="st-tile loc-done static"><span>${icon('circle-check')}سالم و در حال کار</span><b>${nf(healthy.length)}</b></div>`);
  const chips = [['', `همه (${nf(all.length)})`], ...types.map(t => [t, t])].map(([v, l]) => `<button class="chip ${StatusState.type === v ? 'on' : ''}" data-type="${esc(v)}">${esc(l)}</button>`).join('')
    + `<button class="chip ${StatusState.late ? 'on crit' : ''}" data-late>${icon('clock')}فقط تأخیردارها${lateN ? ` (${nf(lateN)})` : ''}</button>`;
  const lastAt = d.repairs.flatMap(r => (r.track || []).map(e => e.at)).sort().pop();
  const html = `
    <div class="st-tiles dyn" style="--cols:${Math.min(6, groups.length + (Auth.scopeShop() ? 0 : 1))}">${tiles}</div>
    <div class="chips-row">${chips}<span class="chips-meta">${icon('clock')}${lastAt ? 'آخرین ثبت: ' + agoAgo(Date.now() - Date.parse(lastAt)) : 'هنوز وضعیتی ثبت نشده'}</span></div>
    ${list.length ? `<div class="sc-grid">${list.map(statusCard).join('')}</div>`
      : `<section class="card">${all.length ? emptyState('search-x', 'ماشینی با این فیلترها پیدا نشد') : emptyState('shield-check', Auth.scopeShop() ? 'الان ماشینی در تعمیر نیست' : 'همه ماشین‌ها سالم و در حال کارند', 'هر وقت خرابی اعلام شود، ماشین با مرحله‌اش اینجا نشان داده می‌شود.', Auth.canHref('#/repairs/new') ? `<a class="btn btn-primary" href="#/repairs/new">${icon('plus')}اعلام خرابی</a>` : '')}</section>`}
    ${!Auth.scopeShop() && healthy.length ? `<section class="card healthy"><b>${icon('circle-check')}سالم و در حال کار</b><div>${healthy.map(m => `<a class="hchip" href="#/machines/${m.id}"><i></i><bdi>${esc(m.code)}</bdi></a>`).join('')}</div></section>` : ''}
    <section class="card legend-card">
      <div class="card-head"><h3>${icon('route')}مراحل پیگیری خرابی</h3><span class="muted small">هر مرحله فقط بعد از ثبت مرحله قبل باز می‌شود</span></div>
      <div class="stg-legend">${Track.stages().map(s => `<div class="loc-${s.loc}"><span class="stp-dot">${toFa(s.n)}</span><span><b>${esc(s.label)}</b><small>${esc(s.desc)}${s.limit ? ` · حد مجاز ${nf(s.limit)} روز` : ''}</small></span></div>`).join('')}</div>
    </section>`;
  return {
    title: 'وضعیت ماشین‌ها',
    sub: Auth.scopeShop() ? 'ماشین‌هایی که برای تعمیر آمده‌اند؛ هر تغییر را با «ثبت مرحله بعد» وارد کنید' : 'هر ماشینی که خرابی باز دارد، با مرحله‌ای که الان در آن است',
    actions: `<a class="btn btn-primary" href="#/status/update">${icon('route')}ثبت مرحله بعد</a>`,
    html,
    mount(el) {
      el.querySelectorAll('[data-grp]').forEach(b => b.addEventListener('click', () => { StatusState.grp = StatusState.grp === b.dataset.grp ? '' : b.dataset.grp; App.rerender(); }));
      el.querySelectorAll('[data-type]').forEach(b => b.addEventListener('click', () => { StatusState.type = b.dataset.type; App.rerender(); }));
      const l = el.querySelector('[data-late]'); if (l) l.addEventListener('click', () => { StatusState.late = !StatusState.late; App.rerender(); });
    },
  };
};

      e.part && e.part.vendor ? 'فروشنده: ' + esc(e.part.vendor) : '',

      e.delayReason ? 'علت تأخیر: ' + esc(e.delayReason) : '',

    items.push(`<li class="tl2 loc-${es.loc} ${isCur ? 'cur' : ''} ${isCur && late ? 'late' : ''}">

        ${e.note ? `<div class="tl2-note">${esc(e.note)}</div>` : ''}
        ${extra.length ? `<div class="tl2-extra">${extra.map(x => `<span>${x}</span>`).join('')}</div>` : ''}
        <small>${e.synth ? 'از روی تاریخ‌های فرم خرابی' : `${icon('user')}ثبت: ${esc(e.byName || '—')}`}</small>
      </div></li>`);
  });
  const part = Track.partInfo(r);
  const smsAll = (d.smsLog || []).filter(x => x.repairId === r.id).slice(-8).reverse();

  const html = `
    <section class="card">${stepper(r, { big: true })}</section>

      <section class="card">
        <div class="card-head"><h3>${icon('history')}تاریخچه مراحل</h3>${canUndo ? `<button class="btn btn-sm btn-ghost danger-text" data-undo>${icon('undo-2')}برگرداندن آخرین ثبت</button>` : ''}</div>

      </section>

        <section class="card st-hero loc-${s.loc} ${late ? 'late' : ''}">
          <small>وضعیت فعلی</small>
          <h3>${toFa(n)}. ${esc(s.label)}</h3>
          <div class="kv-line">${icon('map-pin')}<span>${esc(Track.where(r))}</span></div>
          <div class="kv-line">${icon('clock')}<span>${agoText(Track.sinceMs(r)) ? inStage(agoText(Track.sinceMs(r))) : '—'}</span></div>

            <div><dt>تحویل تقریبی</dt><dd>${part.eta ? toFa(part.eta) : '—'}</dd></div>

        <section class="card">

        </section>
        <section class="card">
          <div class="card-head"><h3>${icon('wrench')}اعلام خرابی</h3>${Auth.canHref('#/repairs/' + r.id) ? `<a class="link" href="#/repairs/${r.id}">صفحه خرابی ${icon('chevron-left')}</a>` : ''}</div>
          <dl class="kv">
            <div class="span2"><dt>نوع خرابی</dt><dd class="pre">${esc(r.type || '—')}</dd></div>
            <div><dt>تاریخ اعلام</dt><dd>${toFa(r.reportDate || '—')}</dd></div>
            <div><dt>سطح ضرورت</dt><dd>${esc((URG[r.urgency] || {}).label || '—')}</dd></div>

            <div><dt>پیش‌بینی بازگشت</dt><dd>${toFa(r.expectedDate || '—')}</dd></div>

        </section>

    crumbs: `<a href="#/status">وضعیت ماشین‌ها</a>${icon('chevron-left')}<span>جزئیات</span>`,
    actions: `${m.plate ? plateTag(m.plate) : ''}`,
    html,
    mount(el) {
      const u = el.querySelector('[data-undo]');

        if (!await Modal.confirm({ title: 'برگرداندن آخرین ثبت', message: `ثبت «${esc(Track.stage(last.n).label)}» (${toFa(last.date)} ${toFa(last.time || '')}) حذف شود؟ پیامکی که فرستاده شده برنمی‌گردد.`, ok: 'حذف شود', danger: true })) return;
        Track.undo(r.id); Toast.show('آخرین ثبت برگردانده شد');

/* ---------- ثبت وضعیت (مناسب گوشی) — فقط مرحله بعد باز است ---------- */
const UpdState = { id: null, n: null, result: '' };

  if (!r) return { title: 'یافت نشد', html: emptyState('search-x', 'این مورد پیدا نشد', '', `<a class="btn btn-ghost" href="#/status/update">بازگشت</a>`) };
  const m = Q.machine(r.machineId) || {};
  const n = Track.cur(r);
  const crumbs = `<a href="#/status">وضعیت ماشین‌ها</a>${icon('chevron-left')}<a href="#/status/${r.id}"><bdi>${esc(m.code || '')}</bdi></a>${icon('chevron-left')}<span>ثبت وضعیت</span>`;
  if (n >= SL()) {

  const lastPart = Track.partInfo(r) || {};

  const sk = sel ? Track.stage(sel).kind : '';

  const fields = !sel ? '' : (() => {

    if (sk === 'wait') {
      f.push(F.field('نام تعمیرگاه یا تعمیرکار', F.combo('shop', r.shop, 'shops', '', 'wrench'), { cls: 'span2' }));
      f.push(F.field('منتظر چه چیزی است؟', F.input('partName', lastPart.name || '', 'placeholder="مثلاً: پمپ آب، تراشکاری میل‌لنگ، سرویس گیربکس"'), { cls: 'span2', hint: 'نام قطعه یا خدمتی که ماشین منتظر آن است' }));
      f.push(F.field('وضعیت تأمین', F.select('partStep', PART_STEPS, lastPart.step || 'ordered')));
      f.push(F.field('تحویل تقریبی قطعه / خدمات', F.date('partEta', lastPart.eta || '')));
      f.push(F.field('فروشنده / محل تأمین', F.input('partVendor', lastPart.vendor || '')));

    }
    if (isTest) {
      f.push(`<div class="field span2"><span class="field-label">نتیجه تست سلامت<i class="req">*</i></span><input type="hidden" name="result" value="${esc(UpdState.result)}">
        <div class="test-pick">${Object.entries(TEST_RES).map(([k, t]) => `<button type="button" class="tp tp-${t.tone} ${UpdState.result === k ? 'on' : ''}" data-res="${k}">${icon(t.icon)}<b>${t.label}</b><small>${k === 'pass' ? 'پرونده این خرابی بایگانی می‌شود' : 'پرونده بسته می‌شود و ثبت خرابی جدید پیشنهاد می‌شود'}</small></button>`).join('')}</div></div>`);
      if (J.norm(r.expectedDate) && J.today() > r.expectedDate && !String(r.delayReason || '').trim()) f.push(F.field('علت تأخیر در تعمیر', F.textarea('delayReason', '', 'rows="2" placeholder="تعمیر دیرتر از پیش‌بینی تمام شده؛ علت را بنویسید"'), { cls: 'span2 delay-reason need' }));
    }
    f.push(F.field(sk === 'done' ? 'کار انجام‌شده' : isTest ? 'شرح تست' : 'توضیح (اختیاری)', F.textarea('note', '', `rows="2" placeholder="${sk === 'done' ? 'مثلاً: کلاچ تعویض شد' : isTest ? 'مثلاً: ۲ ساعت کار زیر بار، نشتی و صدای غیرعادی نداشت' : ''}"`), { cls: 'span2' }));
    return f.join('');
  })();
  const html = `
    <form id="suf" class="upd" autocomplete="off" novalidate>
      <section class="card upd-m">
        <div class="sc-top"><span class="sc-ic loc-${Track.stage(n).loc}">${icon(machineIcon(m))}</span><div class="sc-name"><b class="mcode">${esc(m.code || '')}</b><small>${esc(r.type || '')}</small></div>${m.plate ? plateTag(m.plate) : ''}</div>

        <div class="card-head"><h3>${icon('route')}مرحله بعد</h3><span class="muted small">${icon('lock')}مراحل به ترتیب ثبت می‌شوند</span></div>

        ${!sugg.length ? `<div class="notice notice-warn">${icon('lock')}<span>ثبت مرحله «${esc(Track.stage(nexts[0]).label)}» با شما نیست؛ تا وقتی کاربر مسئول آن را ثبت نکند، این ماشین در همین مرحله می‌ماند.</span></div>` : ''}

      <div class="form-actions card upd-actions">
        <a class="btn btn-ghost" href="#/status/${r.id}">انصراف</a>
        <span class="wz-miss" id="sufMiss"></span>
        <button type="submit" class="btn btn-primary btn-lg" ${sel ? '' : 'disabled'}>${icon('check')}${sel && rule.on ? 'ثبت و ارسال پیامک' : 'ثبت'}</button>

  return {
    title: 'ثبت وضعیت',
    sub: meta(`<bdi>${esc(m.code || '')}</bdi>`, esc((Auth.current() || {}).name || '')),
    crumbs,
    cls: 'narrow',
    html,
    mount(el) {
      const f = el.querySelector('#suf');
      if (!f) return;
      el.querySelectorAll('[data-opt]').forEach(b => b.addEventListener('click', () => { UpdState.n = +b.dataset.opt; App.rerender(); }));

      }));
      const read = () => {
        const v = F.read(f);

        const time = /^\d{1,2}:\d{2}$/.test(toEn(v.time || '')) ? toEn(v.time) : hhmm(new Date());

        const e = { id: uid('t'), n: sel, at: at.toISOString(), date, time, by: (Auth.current() || {}).id, byName: (Auth.current() || {}).name || '', note: String(v.note || '').trim() };

        if ('partName' in v && (v.partName.trim() || (v.partVendor || '').trim() || J.norm(v.partEta))) e.part = { name: v.partName.trim(), vendor: (v.partVendor || '').trim(), eta: J.norm(v.partEta) || '', step: v.partStep || '' };

          ? `<div class="sp-head">${icon('message-square')}<b>این پیامک فرستاده می‌شود</b></div>
             <div class="sp-to">${p.to.length ? p.to.map(t => `<span class="to-chip">${icon('user')}${esc(t.name)} <bdi dir="ltr">${toFa(t.phone)}</bdi></span>`).join('') : `<span class="danger-text small">${icon('triangle-alert')}برای گیرنده‌های این مرحله شماره موبایل ثبت نشده است</span>`}</div>
             <div class="sp-text">${esc(p.text)}</div>
             ${SMS.cfg().provider === 'off' ? `<div class="notice notice-warn">${icon('triangle-alert')}<span>سرویس پیامک هنوز تنظیم نشده؛ پیامک در گزارش ثبت می‌شود ولی فرستاده نمی‌شود.</span></div>` : ''}`
          : `<div class="sp-head muted">${icon('message-square')}<span>این مرحله پیامک ندارد؛ فقط در سامانه ثبت می‌شود.</span></div>`;

        if (!Auth.canStage(sel)) { miss('اجازه ثبت این مرحله را ندارید'); return; }
        if (!Track.canNext(Store.get().repairs.find(x => x.id === r.id), sel)) { miss('ابتدا مرحله قبل باید ثبت شود'); return; }

        if (e.date < (r.reportDate || '')) { miss('تاریخ نمی‌تواند قبل از تاریخ اعلام خرابی باشد'); return; }

        if (lastE && lastE.date && e.date < lastE.date) { miss('تاریخ نمی‌تواند قبل از تاریخ مرحله قبل باشد'); return; }
        if (e.shop) { const sh = await resolveName(e.shop, Rep.shopNames(), { what: 'تعمیرگاه' }); if (sh === null) return; e.shop = sh; }
        if (isTest && e.result === 'pass' && !await Modal.confirm({ title: 'تأیید سلامت و بایگانی', icon: 'archive', message: `تست سلامت «${esc(m.code || '')}» قبول ثبت شود؟ پرونده این خرابی بسته و بایگانی می‌شود.`, ok: 'بله، بایگانی شود' })) return;
        App.hold = true;
        const ok = Track.add(r.id, e);
        App.hold = false;
        if (!ok) { miss('ثبت نشد؛ صفحه را دوباره باز کنید'); return; }
        const rr = Store.get().repairs.find(x => x.id === r.id);
        if (!(rr.track || []).some(x => x.id === e.id)) return; /* نگهبان دسترسی جلوی ثبت را گرفت */
        UpdState.id = null;
        SMS.onStage(rr, e);
        if (isTest) {
          if (e.result === 'pass') { Toast.show('تست سلامت قبول شد؛ پرونده بایگانی شد'); location.hash = '#/repairs/' + r.id; return; }
          Toast.show('تست سلامت رد شد؛ پرونده بسته شد', 'warn');
          const go = await Modal.confirm({ title: 'تست سلامت قبول نشد', icon: 'triangle-alert', message: `ماشین «${esc(m.code || '')}» هنوز ایراد دارد. آیا برای آن خرابی جدید اعلام شود؟<br><small class="muted">خرابی جدید به همین پرونده وصل می‌شود و در تاریخچه ماشین کنار هم دیده می‌شوند.</small>`, ok: 'بله، خرابی جدید اعلام شود', cancel: 'فعلاً نه' });
          location.hash = go ? '#/repairs/again/' + r.id : '#/repairs/' + r.id;

        }
        Toast.show(`«${Track.stage(sel).label}» ثبت شد`);
        location.hash = '#/status/' + r.id;
      });
    },
  };
};

/* ---------- تعریف مراحل وضعیت (در تنظیمات): نام، نوع، محل، حد مجاز؛ افزودن، حذف و جابه‌جایی ---------- */
const StgDraft = { list: null, dirty: false };
const STG_LOCS = [['factory', 'ماشین در کارخانه'], ['shop', 'ماشین در تعمیرگاه'], ['part', 'در انتظار قطعه یا خدمات']];
function stgOpenCount(sid) { return Track.list({ scoped: false }).filter(r => Track.stage(Track.cur(r)).sid === sid).length; }
function stageCfgCard() {
  if (!StgDraft.list) { StgDraft.list = Track.stages().map(({ n, ...x }) => clone(x)); StgDraft.dirty = false; }

  const ed = Auth.level('settings') >= 2;

          ${F.field('نوع مرحله', fixed ? `<div class="stg-fixed">${icon('lock')}${STAGE_KINDS[i === 0 ? 'report' : 'test'].label}</div>` : F.select('kind', ['step', 'wait', 'done'].map(k => [k, STAGE_KINDS[k].label]), s.kind || 'step'))}
          ${F.field('ماشین کجاست؟', fixed ? `<div class="stg-fixed">${icon('factory')}در کارخانه</div>` : F.select('loc', STG_LOCS, loc))}
          ${F.field('حد مجاز (روز)', `<input class="input num" name="limit" inputmode="numeric" value="${s.limit === null || s.limit === undefined ? '' : toFa(s.limit)}" placeholder="${fixed ? (i === 0 ? 'طبق سطح ضرورت' : '—') : 'بدون حد'}" ${fixed ? 'disabled' : ''}>`)}
        </div>
        <div class="stg-ed-r2">
          ${F.field('توضیح کوتاه', `<input class="input" name="desc" value="${esc(s.desc || '')}" placeholder="این مرحله یعنی چه؟">`, { cls: 'grow' })}
          ${F.field('چه کسی ثبت می‌کند؟', `<input class="input" name="who" value="${esc(s.who || '')}" placeholder="مثلاً: تعمیرات">`)}
        </div>
        ${!fixed ? `<small class="muted">${esc(STAGE_KINDS[s.kind || 'step'].hint)}</small>` : `<small class="muted">${esc(STAGE_KINDS[i === 0 ? 'report' : 'test'].hint)} · این مرحله حذف یا جابه‌جا نمی‌شود</small>`}
      </div>
      <div class="stg-ed-ops">

        ${!fixed && ed ? `<button type="button" class="icon-btn sm" data-up="${i}" ${i <= 1 ? 'disabled' : ''} title="بالاتر">${icon('arrow-up')}</button>
        <button type="button" class="icon-btn sm" data-down="${i}" ${i >= last - 1 ? 'disabled' : ''} title="پایین‌تر">${icon('arrow-down')}</button>
        <button type="button" class="icon-btn sm danger" data-rmstg="${i}" title="${open ? 'خرابی باز در این مرحله است؛ حذف نمی‌شود' : 'حذف مرحله'}">${icon('trash-2')}</button>` : ''}

  </section>`;

function bindStageCfg(el) {
  const box = el.querySelector('#stageCfg'); if (!box) return;
  const L = () => StgDraft.list;
  const collect = () => {
    $$('.stg-ed', box).forEach(row => {
      const i = +row.dataset.i; const s = L()[i]; if (!s) return;
      const q = (n) => row.querySelector(`[name=${n}]`);
      s.label = q('label').value.trim();
      s.desc = q('desc').value.trim();
      s.who = q('who').value.trim();
      if (q('kind')) s.kind = q('kind').value;
      if (q('loc')) s.loc = q('loc').value;
      if (i !== 0 && i !== L().length - 1) { const lim = num(q('limit').value); s.limit = lim && lim > 0 ? lim : null; }
    });
  };
  const redraw = () => { StgDraft.dirty = true; App.rerender(); };
  box.addEventListener('input', () => { collect(); if (!StgDraft.dirty) { StgDraft.dirty = true; } });
  box.querySelectorAll('select[name=kind]').forEach(x => x.addEventListener('change', () => { collect(); const s = L()[+x.closest('.stg-ed').dataset.i]; if (s.kind === 'wait') s.loc = 'part'; if (s.kind === 'done') s.loc = 'shop'; redraw(); }));
  box.querySelectorAll('[data-ins]').forEach(b => b.addEventListener('click', () => {
    collect();
    L().splice(+b.dataset.ins, 0, { sid: uid('stg'), kind: 'step', label: '', loc: 'shop', limit: null, who: '', desc: '', isNew: true });
    redraw();
    setTimeout(() => { const inp = $(`#stageCfg .stg-ed[data-i="${b.dataset.ins}"] input[name=label]`); if (inp) inp.focus(); }, 30);
  }));
  box.querySelectorAll('[data-up]').forEach(b => b.addEventListener('click', () => { collect(); const i = +b.dataset.up; [L()[i - 1], L()[i]] = [L()[i], L()[i - 1]]; redraw(); }));
  box.querySelectorAll('[data-down]').forEach(b => b.addEventListener('click', () => { collect(); const i = +b.dataset.down; [L()[i + 1], L()[i]] = [L()[i], L()[i + 1]]; redraw(); }));
  box.querySelectorAll('[data-rmstg]').forEach(b => b.addEventListener('click', async () => {
    collect();
    const i = +b.dataset.rmstg; const s = L()[i];
    const open = stgOpenCount(s.sid);
    if (open) { Toast.show(`${nf(open)} خرابی باز الان در مرحله «${s.label}» است؛ اول آن‌ها را به مرحله بعد ببرید، بعد حذف کنید`, 'warn', 6000); return; }
    if (!await Modal.confirm({ title: 'حذف مرحله', danger: true, message: `مرحله «${esc(s.label || 'بدون نام')}» حذف شود؟ سوابق قبلی ثبت‌شده در این مرحله با همین نام در تاریخچه می‌ماند.`, ok: 'حذف' })) return;
    L().splice(i, 1); redraw();

    const list = L();
    const empty = list.findIndex(s => !s.label);

    const before = Track.stages().map(x => x.sid);
    const clean = list.map((s, i) => {
      const o = { sid: s.sid, kind: i === 0 ? 'report' : i === list.length - 1 ? 'test' : (s.kind || 'step'), label: s.label, loc: i === 0 ? 'factory' : i === list.length - 1 ? 'done' : (s.loc || 'shop'), limit: i === 0 || i === list.length - 1 ? null : (s.limit || null), who: s.who || '', desc: s.desc || '' };
      return o;
    });
    const added = clean.map((s, i) => ({ s, i })).filter(x => !before.includes(x.s.sid));

      d.settings.stages = clean;
      d.settings.stageCfg = {};
      /* مرحله تازه: به کاربرانی داده می‌شود که اجازه ثبت مرحله قبل از آن را دارند */
      added.forEach(({ s: ns, i }) => {
        const prev = clean[i - 1];
        (d.users || []).forEach(u => { if (!u.super && Array.isArray(u.stages) && prev && u.stages.includes(prev.sid) && !u.stages.includes(ns.sid)) u.stages.push(ns.sid); });
      });
    });
    StgDraft.list = null; StgDraft.dirty = false;
    Toast.show(added.length ? 'مراحل ذخیره شد؛ اجازه ثبت مرحله جدید به کاربرانِ مرحله قبلش داده شد' : 'مراحل ذخیره شد', 'ok', 5000);
    App.rerender();
  });
  const reset = box.querySelector('[data-stg-reset]');
  if (reset) reset.addEventListener('click', async () => {
    const custom = Track.stages().filter(x => !STAGE_DEFAULTS.some(d => d.sid === x.sid));
    const busy = custom.filter(x => stgOpenCount(x.sid));
    if (busy.length) { Toast.show(`خرابی باز در مرحله «${busy[0].label}» هست؛ اول آن را جلو ببرید`, 'warn', 6000); return; }
    if (!await Modal.confirm({ title: 'مراحل پیش‌فرض', message: 'مراحل به همان چهار مرحله اولیه (با نام‌های اولیه) برگردد؟ مراحلی که اضافه کرده‌اید حذف می‌شوند.' })) return;
    StgDraft.list = null; StgDraft.dirty = false;
    Store.update(d => { d.settings.stages = clone(STAGE_DEFAULTS); d.settings.stageCfg = {}; });
  });
}

};
function smsStageLabel(x) {
  if (x.sid) { const s = Track.bySid(x.sid); return s ? s.label : (x.label || '—'); }
  return x.n ? Track.stage(x.n).label : '';
}
const SMS_TOKENS = { sup: 'سرپرست همان ماشین', pm: 'مسئول PM همان ماشین', admin: 'مدیر کل' };
const SMS_VARS = ['ماشین', 'پلاک', 'خرابی', 'مرحله', 'تاریخ', 'ساعت', 'ثبت‌کننده', 'تعمیرگاه', 'قطعه', 'تحویل قطعه', 'نتیجه تست', 'توضیح'];
const SMS_PROVIDERS = {
  off: { label: 'خاموش (فقط در گزارش ثبت شود)' },
  kavenegar: { label: 'کاوه‌نگار' },
  smsir: { label: 'sms.ir' },
  custom: { label: 'وب‌سرویس دلخواه / سرور سامانه' },
};
const SMS_STATUS = {
  sent: ['فرستاده شد', 'good'], unconfirmed: ['فرستاده شد (بدون تأیید)', 'good'], pending: ['در حال ارسال', 'info'],
  failed: ['نرسید', 'crit'], off: ['فرستاده نشد — سرویس خاموش', 'muted'], nophone: ['شماره ندارد', 'warn'],
};
function smsStatusTag(st) { const s = SMS_STATUS[st] || [st, 'muted']; return `<span class="st st-${s[1]}">${esc(s[0])}</span>`; }

const SMS = (() => {
  function cfg() {
    const c = Store.get().settings.sms || {};
    return {
      provider: c.provider || 'off', apiKey: c.apiKey || '', sender: c.sender || '',
      method: c.method || 'POST', url: c.url || '', headers: c.headers || 'Content-Type: application/json', body: c.body ?? '{"to": {to_json}, "text": {text_json}}', perRecipient: !!c.perRecipient,
      retry: c.retry === undefined ? 3 : c.retry,
    };
  }
  function rule(n) {
    const st = Track.stage(n);
    const r = ((Store.get().settings.sms || {}).rules || {})[st.sid] || {};
    const b = SMS_DEFAULT_RULES[st.sid] || SMS_DEFAULT_RULES[st.kind] || SMS_DEFAULT_RULES.step;
    return { on: r.on === undefined ? b.on : !!r.on, to: Array.isArray(r.to) ? r.to : b.to.slice(), text: r.text === undefined || r.text === '' ? b.text : r.text };
  }
  function vars(r, e) {
    const m = Q.machine(r.machineId) || {};
    const part = (e && e.part) || Track.partInfo(r) || {};
    return {
      'ماشین': m.code || '', 'پلاک': m.plate ? toFa(m.plate) : '', 'خرابی': r.type || '', 'مرحله': e ? Track.stage(e.n).label : '',
      'تاریخ': e ? toFa(e.date || '') : '', 'ساعت': e ? toFa(e.time || '') : '', 'ثبت‌کننده': e ? (e.byName || '') : '',
      'تعمیرگاه': (e && e.shop) || r.shop || '', 'ساعت حرکت': e && e.depart ? toFa(e.depart) : '', 'رسیدن تقریبی': e && e.eta ? toFa(e.eta) : '',
      'قطعه': part.name || '', 'تحویل قطعه': part.eta ? toFa(part.eta) : '', 'توضیح': e ? (e.note || '') : '',
      'نتیجه تست': e && e.result && TEST_RES[e.result] ? TEST_RES[e.result].short : '',
    };
  }
  function render(tpl, v) {
    const fill = (s) => s.replace(/«([^»]+)»/g, (_, k) => (v[k] ?? ''));
    let out = String(tpl || '').replace(/\[([^\[\]]*)\]/g, (_, seg) => {
      const keys = [...seg.matchAll(/«([^»]+)»/g)].map(x => x[1]);
      return keys.some(k => !String(v[k] ?? '').trim()) ? '' : fill(seg);
    });
    return fill(out).replace(/[ \t]+/g, ' ').replace(/ ([.،:])/g, '$1').trim();
  }
  function personPhone(pid) {
    const p = Q.person(pid);
    if (!p) return null;
    const lu = Auth.users().find(x => x.active !== false && x.personId === pid && normPhone(x.mobile));
    if (lu) return { name: p.name, phone: normPhone(lu.mobile) };
    const ph = normPhone(p.phone);
    if (ph) return { name: p.name, phone: ph };
    const u = Auth.users().find(x => x.active !== false && normName(x.name) === normName(p.name) && normPhone(x.mobile));
    return u ? { name: p.name, phone: normPhone(u.mobile) } : { name: p.name, phone: '' };
  }
  function recipients(r, n, { includeSelf = false } = {}) {
    const m = Q.machine(r.machineId) || {};
    const rl = rule(n);
    const out = [];
    rl.to.forEach(t => {
      if (t === 'sup') { const x = personPhone(m.supervisorId); if (x) out.push({ ...x, role: 'سرپرست' }); }
      else if (t === 'pm') { const x = personPhone(m.pmId); if (x) out.push({ ...x, role: 'مسئول PM' }); }
      else if (t === 'admin') { const su = Auth.superUser(); if (su) out.push({ name: su.name, phone: normPhone(su.mobile), role: 'مدیر کل' }); }
    });
    Auth.users().filter(u => u.receiveSms && u.active !== false).forEach(u => out.push({ name: u.name, phone: normPhone(u.mobile), role: 'گیرنده همه پیامک‌ها' }));
    const me = Auth.current();
    const myPhone = me ? normPhone(me.mobile) : '';
    const seen = new Set(); const res = [];
    out.forEach(x => {
      if (x.phone && seen.has(x.phone)) return;
      if (!includeSelf && x.phone && x.phone === myPhone) return;
      if (x.phone) seen.add(x.phone);
      res.push(x);
    });
    return res;
  }
  function preview(r, e) {
    const all = recipients(r, e.n);
    return { to: all.filter(x => x.phone), missing: all.filter(x => !x.phone), text: render(rule(e.n).text, vars(r, e)) };
  }

  /* ---------- ارسال ---------- */
  function fillReq(s, to, text, c, enc) {
    const E = enc || (x => x);
    return String(s || '')
      .replace(/\{to_json\}/g, JSON.stringify(to)).replace(/\{text_json\}/g, JSON.stringify(text))
      .replace(/\{to\}/g, E(to.join(','))).replace(/\{text\}/g, E(text))
      .replace(/\{sender\}/g, E(c.sender)).replace(/\{apikey\}/g, E(c.apiKey));
  }
  async function sendOnce(to, text) {
    const c = cfg();
    if (c.provider === 'off') return { status: 'off' };
    if (!to.length) return { status: 'nophone' };
    try {
      if (c.provider === 'kavenegar') {
        if (!c.apiKey) throw new Error('کلید API کاوه‌نگار وارد نشده');
        const url = `https://api.kavenegar.com/v1/${encodeURIComponent(c.apiKey)}/sms/send.json?receptor=${encodeURIComponent(to.join(','))}&message=${encodeURIComponent(text)}${c.sender ? '&sender=' + encodeURIComponent(c.sender) : ''}`;
        let res;
        try { res = await fetch(url); } catch (e) { await fetch(url, { mode: 'no-cors' }); return { status: 'unconfirmed' }; }
        const j = await res.json().catch(() => null);
        if (j && j.return && j.return.status === 200) return { status: 'sent' };
        throw new Error((j && j.return && j.return.message) || ('خطای ' + res.status));
      }
      if (c.provider === 'smsir') {
        if (!c.apiKey) throw new Error('کلید API سامانه sms.ir وارد نشده');
        const res = await fetch('https://api.sms.ir/v1/send/bulk', {
          method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'text/plain', 'x-api-key': c.apiKey },
          body: JSON.stringify({ lineNumber: Number(toEn(c.sender)) || toEn(c.sender), messageText: text, mobiles: to, sendDateTime: null }),
        });
        const j = await res.json().catch(() => null);
        if (res.ok && j && j.status === 1) return { status: 'sent' };
        throw new Error((j && j.message) || ('خطای ' + res.status));
      }
      if (c.provider === 'custom') {
        if (!c.url) throw new Error('نشانی وب‌سرویس وارد نشده');
        const groups = c.perRecipient ? to.map(x => [x]) : [to];
        let unconf = false;
        for (const g of groups) {
          const url = fillReq(c.url, g, text, c, encodeURIComponent);
          const headers = {};
          String(c.headers || '').split('\n').forEach(l => { const i = l.indexOf(':'); if (i > 0) headers[l.slice(0, i).trim()] = fillReq(l.slice(i + 1).trim(), g, text, c); });
          const opt = { method: c.method, headers };
          if (c.method !== 'GET') opt.body = fillReq(c.body, g, text, c);
          let res;
          try { res = await fetch(url, opt); } catch (e) {
            if (c.method === 'GET') { await fetch(url, { mode: 'no-cors' }); unconf = true; continue; }
            throw new Error('مرورگر اجازه اتصال به این وب‌سرویس را نداد (CORS)؛ ارسال باید از طریق سرور سامانه انجام شود');
          }
          if (!res.ok) throw new Error('خطای ' + res.status);
        }
        return { status: unconf ? 'unconfirmed' : 'sent' };
      }
      return { status: 'off' };
    } catch (e) {
      const msg = e && e.message === 'Failed to fetch' ? 'اتصال برقرار نشد (اینترنت یا محدودیت مرورگر)' : (e && e.message) || 'خطای نامشخص';
      return { status: 'failed', error: msg };
    }
  }
  function logUpdate(id, patch) {
    Store.update(d => { const x = (d.smsLog || []).find(y => y.id === id); if (x) Object.assign(x, patch); }, { silent: true, system: true });
    if (['sms', 'statusDetail'].includes(App.current.page)) App.rerender();
  }
  async function deliver(id) {
    const x = (Store.get().smsLog || []).find(y => y.id === id); if (!x) return;
    const phones = x.to.filter(t => t.phone).map(t => t.phone);
    const max = Math.max(1, (cfg().retry || 0) + 1);
    let res = { status: 'failed' };
    for (let i = 0; i < max; i++) {
      logUpdate(id, { status: 'pending', tries: (x.tries || 0) + i + 1 });
      res = await sendOnce(phones, x.text);
      if (res.status !== 'failed') break;
      if (i < max - 1) await new Promise(r => setTimeout(r, [3000, 10000, 30000][i] || 30000));
    }
    logUpdate(id, { status: res.status, error: res.error || '', doneAt: nowStamp() });
    return res;
  }
  function queue(r, e, { test = false, to = null, text = null } = {}) {
    const p = to ? { to, text } : preview(r, e);
    const id = uid('s');
    const rec = { id, at: new Date().toISOString(), stamp: nowStamp(), repairId: r ? r.id : null, entryId: e ? e.id : null, n: e ? e.n : null, sid: e ? Track.stage(e.n).sid : null, label: e ? Track.stage(e.n).label : '', test, to: (p.to || []).map(t => ({ name: t.name, phone: t.phone, role: t.role || '' })), missing: (p.missing || []).map(t => t.name), text: text || p.text, status: 'pending', tries: 0, by: (Auth.current() || {}).name || '' };
    Store.update(d => { d.smsLog = d.smsLog || []; d.smsLog.push(rec); if (d.smsLog.length > 600) d.smsLog = d.smsLog.slice(-600); }, { silent: true, system: true });
    return id;
  }
  async function onStage(r, e) {
    const rl = rule(e.n);
    if (!rl.on) return;
    const p = preview(r, e);
    if (!p.to.length) { const id = queue(r, e); logUpdate(id, { status: 'nophone' }); Toast.show('پیامک فرستاده نشد: برای گیرنده‌ها شماره موبایل ثبت نشده', 'warn', 5000); return; }
    const id = queue(r, e);
    if (cfg().provider === 'off') { logUpdate(id, { status: 'off' }); Toast.show('پیامک در گزارش ثبت شد؛ سرویس پیامک هنوز تنظیم نشده', 'warn', 5000); return; }
    Toast.show(`پیامک برای ${nf(p.to.length)} نفر در حال ارسال است…`, 'info');
    const res = await deliver(id);
    if (res && (res.status === 'sent' || res.status === 'unconfirmed')) Toast.show(`پیامک برای ${p.to.map(t => t.name).join('، ')} فرستاده شد`);
    else if (res) Toast.show('ارسال پیامک ناموفق بود: ' + (res.error || ''), 'danger', 6000);
  }
  return { cfg, rule, vars, render, recipients, preview, queue, deliver, onStage, personPhone, sendOnce };
})();

              ${F.field('فرستنده (برای {sender})', F.input('sender', c.sender, `dir="ltr" ${ed ? '' : 'readonly'}`))}
            </div></div>
            ${F.field('تعداد تلاش دوباره اگر نرسید', F.select('retry', [[0, 'تلاش نکند'], [1, '۱ بار'], [2, '۲ بار'], [3, '۳ بار']], c.retry, ed ? '' : 'disabled'))}
          </form>
          ${ed ? `<div class="btn-row"><button class="btn btn-primary" data-cfg-save>${icon('save')}ذخیره</button><button class="btn btn-ghost" data-test>${icon('smartphone')}ارسال پیامک آزمایشی</button></div>` : ''}
          <p class="muted small" style="margin-top:12px">پیامک از همین مرورگر به سرویس‌دهنده فرستاده می‌شود و کامپیوتر باید به اینترنت وصل باشد. اگر ارسال آزمایشی نرسید، مرورگر اتصال مستقیم را بسته است؛ در این حالت واحد برنامه‌نویسی ارسال را از سرور سامانه انجام می‌دهد (گزینه «وب‌سرویس دلخواه»).</p>
        </section>
        <section class="card">
          <div class="card-head"><h3>${icon('smartphone')}شماره موبایل گیرنده‌ها</h3></div>
          <ul class="phone-list">${phoneRows || '<li class="muted">گیرنده‌ای تعریف نشده</li>'}</ul>
          <p class="muted small">شماره سرپرست از موبایل کاربریِ او خوانده می‌شود (در بخش کاربران، «این کاربر کیست؟» را روی نام سرپرست بگذارید). اگر هنوز کاربری ندارد، همین‌جا شماره‌اش را ثبت کنید.</p>
        </section>
      </div>
      <section class="card phone-card">
        <div class="phone"><div class="phone-in">
          <div class="phone-head"><span class="ph-av">${icon('truck')}</span><b>${esc(c.sender ? toFa(c.sender) : 'سامانه ناوگان')}</b><small>نمونه پیامک «${esc(Track.stage(SmsState.sel).label)}»</small></div>
          <div class="phone-body"><div class="bubble">${esc(prevText)}<small>${toFa(hhmm(new Date()))}</small></div></div>
        </div></div>
        <p class="muted small" style="text-align:center">روی هر ردیف جدول زیر بزنید تا نمونه آن را اینجا ببینید.</p>
      </section>
    </div>
    <section class="card flush">
      <div class="card-head pad"><h3>${icon('route')}کدام مرحله، برای چه کسی پیامک بفرستد؟</h3>${ed ? `<button class="btn btn-sm btn-primary" data-rules-sms>${icon('save')}ذخیره قوانین</button>` : ''}</div>
      <div class="table-wrap"><table class="table sms-rules"><thead><tr><th>مرحله</th><th>پیامک</th><th>گیرنده‌ها</th><th>متن پیامک</th></tr></thead><tbody>${rules}</tbody></table></div>
      <div class="table-foot">کلمه‌های داخل «» خودکار پر می‌شوند: ${SMS_VARS.map(v => `«${v}»`).join(' ')}. هر بخشی که داخل [ ] باشد، اگر خالی بماند از متن حذف می‌شود. کسانی که در بخش کاربران «دریافت همه پیامک‌ها» برایشان روشن است هم پیامک‌ها را می‌گیرند. برای کسی که خودش وضعیت را ثبت می‌کند پیامک فرستاده نمی‌شود.</div>
    </section>
    <section class="card flush">
      <div class="card-head pad"><h3>${icon('history')}گزارش ارسال پیامک</h3><span class="count">${nf((d.smsLog || []).length)} پیامک</span></div>
      ${log.length ? `<div class="table-wrap"><table class="table sms-log"><thead><tr><th>زمان</th><th>ماشین / مرحله</th><th>گیرنده</th><th>متن</th><th>نتیجه</th></tr></thead><tbody>${logRows}</tbody></table></div>` : emptyState('message-square', 'هنوز پیامکی فرستاده نشده', 'با ثبت مراحلی که پیامک دارند، پیامک‌ها اینجا ثبت می‌شوند.')}
    </section>`;
  return {
    title: 'پیامک', sub: 'به‌محض ثبت یک مرحله، پیامک خودکار برای گیرنده‌های همان مرحله فرستاده می‌شود',
    html,
    mount(el) {
      const f = el.querySelector('#smsCfg');
      const ps = f.querySelector('select[name=provider]');
      ps.addEventListener('change', () => { f.querySelector('.prov-k').hidden = !['kavenegar', 'smsir'].includes(ps.value); f.querySelector('.prov-c').hidden = ps.value !== 'custom'; });
      const readCfg = () => {
        const v = F.read(f);
        const kv = F.read(f.querySelector(ps.value === 'custom' ? '.prov-c' : '.prov-k'));
        return { provider: v.provider, apiKey: (kv.apiKey || '').trim(), sender: toEn(kv.sender || '').trim(), method: v.method, url: (v.url || '').trim(), headers: v.headers, body: v.body, perRecipient: v.perRecipient, retry: +v.retry || 0 };
      };
      const save = el.querySelector('[data-cfg-save]');
      if (save) save.addEventListener('click', () => { const nc = readCfg(); Store.update(dd => { dd.settings.sms = { ...(dd.settings.sms || {}), ...nc }; }); Toast.show('تنظیمات پیامک ذخیره شد'); });
      const test = el.querySelector('[data-test]');
      if (test) test.addEventListener('click', () => {
        const me = Auth.current() || {};
        Modal.open({
          title: 'ارسال پیامک آزمایشی', icon: 'smartphone', size: 'sm',
          body: `<form class="form-grid cols-1" id="tf">${F.field('شماره موبایل', F.input('phone', toFa(normPhone(me.mobile) || ''), 'dir="ltr" inputmode="tel" placeholder="۰۹۱۲۰۰۰۰۰۰۰"'))}${F.field('متن', F.textarea('text', 'پیامک آزمایشی سامانه ناوگان — ' + companyName(), 'rows="2"'))}</form>
            <p class="muted small">پیش از ارسال، تنظیمات بالا ذخیره می‌شود.</p>`,
          footer: `<button class="btn btn-ghost" data-close>انصراف</button><button class="btn btn-primary" data-go>${icon('send')}ارسال</button>`,
          onMount(mel, api) {
            mel.querySelector('[data-go]').addEventListener('click', async () => {
              const v = F.read(mel.querySelector('#tf'));
              const ph = normPhone(v.phone);
              if (!ph) { Toast.show('شماره موبایل درست نیست', 'warn'); return; }
              const nc = readCfg(); Store.update(dd => { dd.settings.sms = { ...(dd.settings.sms || {}), ...nc }; }, { silent: true });
              api.close();
              const id = SMS.queue(null, null, { test: true, to: [{ name: 'آزمایشی', phone: ph }], text: v.text });
              Toast.show('در حال ارسال…', 'info');
              const res = await SMS.deliver(id);
              if (res.status === 'sent') Toast.show('پیامک آزمایشی فرستاده شد');
              else if (res.status === 'unconfirmed') Toast.show('درخواست فرستاده شد ولی مرورگر جواب سرویس را نشان نمی‌دهد؛ گوشی را نگاه کنید', 'info', 7000);
              else if (res.status === 'off') Toast.show('سرویس پیامک خاموش است', 'warn');
              else Toast.show('ارسال ناموفق: ' + (res.error || ''), 'danger', 7000);
              App.rerender();
            });
          },
        });
      });
      el.querySelectorAll('[data-row]').forEach(tr => tr.addEventListener('click', e => { if (e.target.closest('input,textarea,label')) return; SmsState.sel = +tr.dataset.row; App.rerender(); }));
      el.querySelectorAll('.tchip input').forEach(c => c.addEventListener('change', () => c.closest('.tchip').classList.toggle('on', c.checked)));
      const rs = el.querySelector('[data-rules-sms]');
      if (rs) rs.addEventListener('click', () => {
        const rules = {};
        Track.stages().forEach(s => {
          rules[s.sid] = {
            on: el.querySelector(`[data-on="${s.n}"]`).checked,
            to: $$(`[data-to="${s.n}"]`, el).filter(x => x.checked).map(x => x.value),
            text: el.querySelector(`[data-tpl="${s.n}"]`).value.trim(),
          };
        });
        Store.update(dd => { dd.settings.sms = { ...(dd.settings.sms || {}), rules }; });
        Toast.show('قوانین پیامک ذخیره شد');
      });
      el.querySelectorAll('[data-phone]').forEach(b => b.addEventListener('click', () => {
        const p = Q.person(b.dataset.phone);
        Modal.open({
          title: `شماره موبایل ${p.name}`, icon: 'smartphone', size: 'sm',
          body: `<form class="form-grid cols-1" id="phf">${F.field('موبایل', F.input('phone', toFa(p.phone || ''), 'dir="ltr" inputmode="tel" placeholder="۰۹۱۲۰۰۰۰۰۰۰" autofocus'))}</form>`,
          footer: `<button class="btn btn-ghost" data-close>انصراف</button><button class="btn btn-primary" data-ok>${icon('save')}ذخیره</button>`,
          onMount(mel, api) {
            mel.querySelector('[data-ok]').addEventListener('click', () => {
              const v = F.read(mel.querySelector('#phf'));
              const ph = normPhone(v.phone);
              if (String(v.phone).trim() && !ph) { Toast.show('شماره موبایل درست نیست', 'warn'); return; }
              Store.update(dd => { dd.people.find(x => x.id === p.id).phone = ph; });
              api.close(); Toast.show('شماره ذخیره شد');
            });
          },
        });
      }));
      el.querySelectorAll('[data-resend]').forEach(b => b.addEventListener('click', async () => {
        const x = (Store.get().smsLog || []).find(y => y.id === b.dataset.resend);
        if (!x) return;
        if (x.status === 'nophone' && x.repairId) {
          const r = Q.repair(x.repairId); const e = r && (r.track || []).find(t => t.id === x.entryId);
          if (r && e) { const p = SMS.preview(r, e); Store.update(dd => { const y = dd.smsLog.find(z => z.id === x.id); y.to = p.to.map(t => ({ name: t.name, phone: t.phone, role: t.role || '' })); y.missing = p.missing.map(t => t.name); }, { silent: true, system: true }); }
        }
        Toast.show('در حال ارسال دوباره…', 'info');
        const res = await SMS.deliver(x.id);
        Toast.show(res && ['sent', 'unconfirmed'].includes(res.status) ? 'پیامک فرستاده شد' : 'ارسال ناموفق بود', res && ['sent', 'unconfirmed'].includes(res.status) ? 'ok' : 'danger');
      }));
    },
  };
};

/* ============================================================
   اتصال به صفحه‌های قبلی
   ============================================================ */
/* صفحه خرابی: کارت وضعیت لحظه‌ای */
(() => {
  const origB = Pages.backup;
  Pages.backup = () => {
    const o = origB();
    if (!Auth.isSuper()) o.html = o.html.replace('<label class="drop" id="drop">', `<div class="notice notice-info">${icon('lock')}<span>بازیابی از فایل پشتیبان و بازنشانی داده‌ها فقط با مدیر کل است.</span></div><label class="drop" id="drop">`);
    return o;
  };
  Pages.denied = () => ({
    title: 'دسترسی ندارید',
    html: `<section class="card">${emptyState('lock', 'به این بخش دسترسی ندارید', 'اگر لازم است این بخش را ببینید، از مدیر سامانه بخواهید دسترسی‌اش را برایتان روشن کند.', Auth.home() !== '#/denied' ? `<a class="btn btn-primary" href="${Auth.home()}">${icon('arrow-right')}رفتن به صفحه اصلی من</a>` : '')}</section>`,
  });
})();

</script>
</body>
</html>
