services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sepid
      POSTGRES_USER: sepid
      POSTGRES_PASSWORD: ${SEPID_POSTGRES_PASSWORD:?Set SEPID_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fleet-postgres:/var/lib/postgresql/data
      - ./infra/migrations/001_core.sql:/docker-entrypoint-initdb.d/001_core.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "sepid", "-d", "sepid"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  fleet-postgres:
